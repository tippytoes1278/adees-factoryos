<script>
// ── ARVIND HOME ───────────────────────────────────────────────────────────────
function renderArvindHome(c){
  c.innerHTML='';
  if(!D.dash){
    c.appendChild(alert_('yellow','Loading...','Tap Refresh to reload data'));
    return;
  }
  var d=D.dash;
  // ── NEEDS ATTENTION ──────────────────────────────────────────
  var naItems=[];

  // 1. Revision requests — Arvind needs to resubmit
  var reqs=D.reqs&&D.reqs.requests?D.reqs.requests:[];
  var revisionReqs=reqs.filter(function(r){
    return r.status==='REVISION'&&
           r.submittedBy===USER.name&&
           !SEEN_ALERT_IDS.has(r.reqId);
  });
  if(revisionReqs.length>0){
    naItems.push({
      icon:'⚠️',
      text:revisionReqs.length+' request'+(revisionReqs.length!==1?'s':'')+' need revision',
      sub:'Ayush ne changes maange hain — resubmit karo',
      tab:'alerts',
      color:'#d97706'
    });
  }

  // 2. Orders with no approved activities — blocks Job Card issue
  var oasArts=D.entry&&D.entry.articles?D.entry.articles:[];
  var noActOrders=oasArts.filter(function(a){
    return !a.activities||a.activities.length===0;
  });
  if(noActOrders.length>0){
    naItems.push({
      icon:'📋',
      text:noActOrders.length+' order'+(noActOrders.length!==1?'s':'')+' need activity setup',
      sub:noActOrders.map(function(a){return (a.article||a.sheet)+(a.customer?' — '+a.customer:'');}).join(' · '),
      tab:'activities',
      color:'#d97706'
    });
  }

  // 3. Contractors with no department enrollments
  var allCtrs=D.contractors||[];
  var allEnrs=D.enrollments||[];
  var enrolledIds={};
  allEnrs.forEach(function(e){if(e.contractorId)enrolledIds[e.contractorId]=true;});
  var unenrolledCtrs=allCtrs.filter(function(ct){
    return ct.ctrId&&!enrolledIds[ct.ctrId];
  });
  if(unenrolledCtrs.length>0){
    naItems.push({
      icon:'👤',
      text:unenrolledCtrs.length+' contractor'+(unenrolledCtrs.length!==1?'s':'')+' not enrolled in any department',
      sub:unenrolledCtrs.map(function(c){return c.name;}).join(', '),
      tab:'contractors',
      color:'#7c3aed'
    });
  }

  // 4. Completed job cards ready for payment
  var completedCards=D.completedJobCards;
  if(Array.isArray(completedCards)&&completedCards.length>0){
    naItems.push({
      icon:'💰',
      text:completedCards.length+' job card'+(completedCards.length!==1?'s':'')+' ready for payment',
      sub:'Select karo aur Ayush ko submit karo',
      tab:'payment',
      color:'#059669'
    });
  }

  if(naItems.length>0){
    var naCard=el('div',{cls:'fos-card',style:'margin-bottom:16px;padding:12px 16px'});
    naCard.appendChild(el('div',{
      style:'font-size:11px;font-weight:600;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px',
      text:'Needs Attention ('+naItems.length+')'
    }));
    naItems.forEach(function(t){
      var row=el('div',{style:'display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--fos-border);cursor:pointer'});
      row.onclick=function(tab){return function(){loadTab(tab);};}(t.tab);
      var iconEl=el('div',{style:'font-size:20px;flex-shrink:0;width:28px;text-align:center',text:t.icon});
      var txt=el('div',{style:'flex:1;min-width:0'});
      txt.appendChild(el('div',{style:'font-size:13px;font-weight:600;color:'+t.color,text:t.text}));
      if(t.sub)txt.appendChild(el('div',{
        style:'font-size:11px;color:var(--fos-ink-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
        text:t.sub
      }));
      row.appendChild(iconEl);
      row.appendChild(txt);
      row.appendChild(el('div',{style:'font-size:18px;color:var(--fos-ink-secondary);flex-shrink:0',text:'›'}));
      naCard.appendChild(row);
    });
    c.appendChild(naCard);
  }
  // ── END NEEDS ATTENTION ──────────────────────────────────────
  var pt=fosPipelineTracker({cutting:12,prep:8,fitter:14,lasting:10,finish:4});
  pt.classList.add('fos-light');
  c.appendChild(pt);
  var approved=d.approvalStatus&&d.approvalStatus!=='';
  c.appendChild(sectionTitle('Your Week'));
  c.appendChild(approved?alert_('green','Week approved by Ayush','Ready for Saturday payment'):alert_('yellow','Bring to Ayush on Friday evening','Payment not yet approved'));
  var krow=el('div',{cls:'kpi-row'});
  krow.appendChild(kpiEl('Active Orders',String(d.totalOrders),'Tap Entry to add QTY','blue'));
  krow.appendChild(kpiEl('Lot Alerts',String(d.redCount),d.redCount>0?'Over cap - check':'All good',d.redCount>0?'red':'green'));
  c.appendChild(krow);
  c.appendChild(sectionTitle('Orders'));
  var allArvOrders=d.orders?d.orders:[];
  var arvFilter='open',arvBuyer='';
  function renderArvOrders(){
    var existWrap=c.querySelector('.arv-orders-wrap');if(existWrap)existWrap.remove();
    var wrap=el('div',{cls:'arv-orders-wrap'});

    var filterBar=el('div',{style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px'});
    function pill(label,val){
      var p=el('button',{text:label,style:'border:none;border-radius:16px;padding:5px 14px;font-family:var(--fos-font-body);font-size:13px;cursor:pointer;transition:background 0.15s'});
      function upd(){p.style.background=arvFilter===val?'var(--fos-accent)':'var(--fos-surface)';p.style.color=arvFilter===val?'#fff':'var(--fos-ink)';}
      p.onclick=function(){arvFilter=val;renderArvOrders();};
      upd();return p;
    }
    filterBar.appendChild(pill('Open','open'));
    filterBar.appendChild(pill('Closed','closed'));
    var buyers=[];
    allArvOrders.forEach(function(o){if(o.customer&&buyers.indexOf(o.customer)<0)buyers.push(o.customer);});
    buyers.sort();
    if(buyers.length>0){
      var sel=el('select',{style:'border:1px solid var(--fos-border);border-radius:6px;padding:0.4rem 0.75rem;font-family:var(--fos-font-body);font-size:0.85rem;background:var(--fos-surface);color:var(--fos-ink);cursor:pointer'});
      var optAll=document.createElement('option');optAll.value='';optAll.textContent='All Buyers';sel.appendChild(optAll);
      buyers.forEach(function(b){var opt=document.createElement('option');opt.value=b;opt.textContent=b;sel.appendChild(opt);});
      sel.value=arvBuyer;
      sel.onchange=function(){arvBuyer=sel.value;renderArvOrders();};
      filterBar.appendChild(sel);
    }
    wrap.appendChild(filterBar);

    var filtered=allArvOrders.filter(function(o){
      var lot=o.orderQty||0,paid=o.totalPaid||o.cumul||0;
      var isOpen=lot===0||paid<lot;
      var isMatch=arvFilter==='open'?isOpen:!isOpen;
      var buyerMatch=!arvBuyer||o.customer===arvBuyer;
      return isMatch&&buyerMatch;
    });
    if(filtered.length){
      var card=el('div',{cls:'fos-card',style:'padding:0'});
      filtered.forEach(function(o){card.appendChild(orderRowEl(o));});
      wrap.appendChild(card);
    } else {
      wrap.appendChild(el('div',{style:'color:var(--fos-ink-secondary);padding:20px;text-align:center',text:'Is filter mein koi order nahi hai'}));
    }
    c.appendChild(wrap);
  }
  renderArvOrders();
}

// ── ALERTS / NOTIFICATIONS TAB ────────────────────────────────────────────────
function renderAlerts(c){
  c.innerHTML='';
  c.appendChild(sectionTitle('My Submissions'));
  if(!D.myreqs||!D.myreqs.requests){
    c.appendChild(alert_('blue','No data','Tap Refresh to reload'));
    return;
  }
  var reqs=D.myreqs.requests;
  if(!reqs.length){
    c.appendChild(alert_('green','No submissions yet','Your requests will appear here once submitted'));
    return;
  }
  var _now48ms=Date.now()-48*60*60*1000;
  function _parseReqDate(s){var d=new Date((s||'').replace(/(\d+)-(\w+)-(\d+)/,'$2 $1, $3'));return isNaN(d.getTime())?0:d.getTime();}
  var _rateNewest={},_setupNewest={};
  reqs.forEach(function(r){
    if(r.status!=='REJECTED'&&r.status!=='REVISION')return;
    var ms=_parseReqDate(r.date);
    var p={};try{p=JSON.parse(r.details);}catch(e){}
    if(r.type==='RATE_EDIT'){var k=String(p.rowIndex||'');if(!_rateNewest[k]||ms>_rateNewest[k])_rateNewest[k]=ms;}
    else if(r.type==='ACTIVITY_SETUP'){var k=(p.sheet||'')+'|'+(p.dept||'');if(!_setupNewest[k]||ms>_setupNewest[k])_setupNewest[k]=ms;}
  });
  reqs.forEach(function(r){
    var card=el('div',{cls:'req-card'});
    // Type + status row
    var typeRow=el('div',{style:'display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap'});
    typeRow.appendChild(el('span',{cls:'req-type',text:r.type.replace(/_/g,' ')}));
    var sBadge;
    if(r.status==='PENDING')sBadge=el('span',{cls:'badge grey',text:'⏳ Awaiting Approval'});
    else if(r.status==='APPROVED')sBadge=el('span',{cls:'badge green',text:'✅ Approved'});
    else if(r.status==='REVISION'){sBadge=el('span',{cls:'badge',style:'background:#78350f;color:#fcd34d;display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600',text:'↩ Needs revision'});}
    else if(r.status==='REJECTED'){sBadge=el('span',{cls:'badge red',text:'❌ Rejected'});}
    else sBadge=el('span',{cls:'badge grey',text:r.status});
    typeRow.appendChild(sBadge);
    if(r.status==='REJECTED'||r.status==='REVISION'){
      var dimBtn=el('button',{text:'✕',style:'margin-left:auto;background:none;border:none;color:var(--fos-ink-secondary);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px;flex-shrink:0'});
      (function(cardEl,reqId){dimBtn.onclick=function(){fosMarkAlertSeen(reqId);cardEl.remove();};})(card,r.reqId);
      typeRow.appendChild(dimBtn);
    }
    card.appendChild(typeRow);
    // Summary
    var sumDiv=el('div',{cls:'req-details'});
    var pl={};try{pl=JSON.parse(r.details);}catch(e){}
    if(r.type==='RATE_EDIT'){
      sumDiv.appendChild(el('div',{text:'Rate Change: '+(r.activityName||pl.activityName||('Row '+pl.rowIndex))+' → ₹'+(pl.newRate||0)+' rate, ₹'+(pl.newComm||0)+' comm'}));
    } else if(r.type==='ACTIVITY_SETUP'){
      sumDiv.appendChild(el('div',{text:'Activity Setup: '+(r.articleLabel||pl.sheet||'?')+(pl.dept?' — '+pl.dept:'')}));
      if(r.bom)sumDiv.appendChild(el('span',{style:'display:block;font-family:var(--fos-font-mono);font-size:0.72rem;color:var(--fos-ink-secondary);margin-top:2px',text:r.bom}));
    } else if(r.type==='NEW_ORDER'){
      sumDiv.appendChild(el('div',{text:(pl.styleName||'?')+(pl.color?' — '+pl.color:'')+' for '+(pl.buyer||'?')}));
    } else if(r.type==='CUSTOM_PERIOD_REQUEST'){
      sumDiv.appendChild(el('div',{text:'Custom Period: '+(pl.fromDate||'?')+' → '+(pl.toDate||'?')}));
    } else if(r.type==='PAYMENT_SUBMISSION'){
      sumDiv.appendChild(el('div',{text:'Payment: '+(pl.periodId||pl.weekLabel||'?')}));
    } else if(r.type==='SETUP_EDIT_REQUEST'){
      sumDiv.appendChild(el('div',{text:'Setup Edit: '+(pl.dept||'?')+' dept — '+(r.articleLabel||pl.sheet||'?')}));
      if(r.bom)sumDiv.appendChild(el('span',{style:'display:block;font-family:var(--fos-font-mono);font-size:0.72rem;color:var(--fos-ink-secondary);margin-top:2px',text:r.bom}));
    } else {
      sumDiv.appendChild(el('div',{text:r.details||r.type}));
    }
    card.appendChild(sumDiv);
    card.appendChild(el('div',{cls:'req-meta',text:r.date}));
    // Status detail notes
    if(r.status==='APPROVED'&&r.approvedOn)card.appendChild(el('div',{style:'font-size:11px;color:var(--fos-success);margin-bottom:6px',text:'Approved on: '+r.approvedOn}));
    if((r.status==='REJECTED'||r.status==='REVISION')&&r.ayushNotes)card.appendChild(el('div',{style:'padding:6px 10px;background:var(--fos-accent-soft);border-left:3px solid var(--fos-danger);border-radius:0 6px 6px 0;color:var(--fos-danger);font-size:12px;margin-bottom:8px',text:'Reason: '+r.ayushNotes}));
    // Revise & Resubmit for REJECTED/REVISION cards
    if(r.status==='REJECTED'||r.status==='REVISION'){
      (function(req,payload){
        var _cardMs=_parseReqDate(req.date);
        var _within48=_cardMs>_now48ms;
        var _expiredEl=el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-top:6px',text:'Expired — submit a new request if needed'});
        if(req.type==='NEW_ORDER'){
          if(_within48){var rsBtn=el('button',{cls:'rv-btn',style:'width:100%',text:'Revise & Resubmit →'});rsBtn.onclick=function(){NO_TS={tsNumber:payload.tsNumber,styleName:payload.styleName};NO_RESUBMIT={type:'NEW_ORDER',payload:payload,revisionRemark:req.ayushNotes||''};NO_STEP=2;loadTab('neworder');};card.appendChild(rsBtn);}
          else{card.appendChild(_expiredEl);}
        } else if(req.type==='ACTIVITY_SETUP'){
          var _sk=(payload.sheet||'')+'|'+(payload.dept||'');
          var _isNewestSetup=_setupNewest[_sk]===_cardMs;
          if(_within48&&_isNewestSetup){var asBtn=el('button',{cls:'rv-btn',style:'width:100%',text:'Revise & Resubmit →'});(function(sheet,rmk){asBtn.onclick=function(){ENTRY_AUTO_OPEN_SHEET=sheet;ENTRY_REVISION_REMARK=rmk;loadTab('entry');};})(payload.sheet||null,req.ayushNotes||'');card.appendChild(asBtn);}
          else{card.appendChild(_expiredEl);}
        } else if(req.type==='RATE_EDIT'){
          var _rk=String(payload.rowIndex||'');
          var _isNewestRate=_rateNewest[_rk]===_cardMs;
          if(_within48&&_isNewestRate){var reBtn=el('button',{cls:'rv-btn',style:'width:100%',text:'Revise & Resubmit →'});(function(actName,rmk,ri,nr,nc){reBtn.onclick=function(){ACTS_REVISION_ACTIVITY=actName;ACTS_REVISION_REMARK=rmk;NO_RESUBMIT_RATE={rowIndex:ri,currentRate:nr,currentComm:nc,remark:rmk};loadTab('activities');};})(((req.activityName||payload.activityName||'')).toLowerCase().trim(),req.ayushNotes||'',payload.rowIndex,payload.newRate,payload.newComm);card.appendChild(reBtn);}
          else{card.appendChild(_expiredEl);}
        } else if(req.type==='CUSTOM_PERIOD_REQUEST'){
          if(!_within48){card.appendChild(_expiredEl);}
          else{
          var cpBtn=el('button',{cls:'rv-btn',style:'width:100%',text:'Revise & Resubmit →'});
          var cpForm=el('div',{style:'display:none;margin-top:8px;padding:10px;background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:8px'});
          var cpFr=el('input',{type:'date',value:payload.fromDate||'',style:'width:100%;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:6px;padding:7px;color:var(--fos-ink);font-size:13px;box-sizing:border-box;margin-bottom:6px;display:block'});
          var cpTo=el('input',{type:'date',value:payload.toDate||'',style:'width:100%;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:6px;padding:7px;color:var(--fos-ink);font-size:13px;box-sizing:border-box;margin-bottom:6px;display:block'});
          var cpRsn=el('input',{type:'text',value:payload.reason||'',placeholder:'Reason (required)',style:'width:100%;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:6px;padding:7px;color:var(--fos-ink);font-size:13px;box-sizing:border-box;margin-bottom:8px;display:block'});
          var cpRow=el('div',{style:'display:flex;gap:8px'});
          var cpSub=el('button',{style:'flex:1;padding:9px;background:var(--fos-accent);color:#fff;font-weight:700;font-size:13px;border-radius:8px;border:none;cursor:pointer',text:'Resubmit'});
          var cpCxl=el('button',{style:'padding:9px 14px;background:var(--fos-bg);color:var(--fos-ink-secondary);border:1px solid var(--fos-border);font-size:13px;border-radius:8px;cursor:pointer',text:'Cancel'});
          cpRow.appendChild(cpSub);cpRow.appendChild(cpCxl);
          cpForm.appendChild(el('div',{style:'font-size:11px;font-weight:500;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px',text:'From'}));cpForm.appendChild(cpFr);
          cpForm.appendChild(el('div',{style:'font-size:11px;font-weight:500;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px',text:'To'}));cpForm.appendChild(cpTo);
          cpForm.appendChild(el('div',{style:'font-size:11px;font-weight:500;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px',text:'Reason'}));cpForm.appendChild(cpRsn);
          cpForm.appendChild(cpRow);
          cpBtn.onclick=function(){cpForm.style.display='block';cpBtn.style.display='none';};
          cpCxl.onclick=function(){cpForm.style.display='none';cpBtn.style.display='';};
          (function(frm,frI,toI,rsnI,origRemark,sb){
            sb.onclick=function(){
              var rsn=rsnI.value.trim();if(!rsn){toast('Reason is required',true);return;}
              sb.disabled=true;sb.textContent='Submitting…';
              google.script.run
                .withSuccessHandler(function(res){
                  if(res&&res.success){toast('Resubmitted — Ayush will be notified');D.myreqs=null;setTimeout(function(){loadTab('alerts');},800);}
                  else{toast((res&&res.error)||'Error',true);sb.disabled=false;sb.textContent='Resubmit';}
                })
                .withFailureHandler(function(){toast('Error',true);sb.disabled=false;sb.textContent='Resubmit';})
                .submitRequest('CUSTOM_PERIOD_REQUEST',JSON.stringify({fromDate:frI.value,toDate:toI.value,reason:rsn,revisionRemark:origRemark}));
            };
          })(cpForm,cpFr,cpTo,cpRsn,req.ayushNotes||'',cpSub);
          card.appendChild(cpBtn);card.appendChild(cpForm);
          } // end _within48 else
        } else if(req.type==='PAYMENT'){
          var pyBtn=el('button',{cls:'rv-btn',style:'width:100%',text:'Go to Review →'});
          pyBtn.onclick=function(){loadTab('review');};
          card.appendChild(pyBtn);
        }
      })(r,pl);
    }
    c.appendChild(card);
  });
}
// ── NEW ORDER ─────────────────────────────────────────────────────────────────
function renderNewOrder(c){
  c.innerHTML='';
  if(NO_STEP===2&&NO_TS) renderNO_Step2(c);
  else renderNO_Step1(c);
}

function renderNO_Step1(c){
  c.appendChild(sectionTitle('Find BOM'));
  var sc=el('div',{cls:'fos-card'});
  var sr=el('div',{style:'display:flex;gap:8px;margin-bottom:10px'});
  var sI=el('input',{cls:'form-input',placeholder:'Search style name…',type:'text',style:'flex:1;padding:10px 12px'});
  var sB=el('button',{style:'background:var(--fos-accent);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;flex-shrink:0',text:'Search'});
  sr.appendChild(sI);sr.appendChild(sB);sc.appendChild(sr);
  var rL=el('div');sc.appendChild(rL);c.appendChild(sc);
  var nc=el('div',{cls:'fos-card'});
  nc.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-bottom:10px',text:'No matching BOM? Create one:'}));
  var nB=el('button',{cls:'fos-btn-secondary',text:'+ Create New BOM'});
  nB.onclick=function(){renderNO_CreateTS(c);};nc.appendChild(nB);c.appendChild(nc);
  function doSearch(){
    var q=sI.value.trim();
    rL.innerHTML='<div style="color:var(--fos-ink-secondary);font-size:12px;padding:6px 0">Searching…</div>';
    google.script.run
      .withSuccessHandler(function(res){
        rL.innerHTML='';
        if(!res||!res.length){rL.appendChild(el('div',{style:'color:var(--fos-ink-secondary);font-size:12px;padding:6px 0',text:q?'No results for "'+q+'"':'No BOM records yet'}));return;}
        res.forEach(function(ts){
          var row=el('div',{style:'padding:10px 0;border-bottom:0.5px solid var(--fos-border);cursor:pointer;display:flex;align-items:center;justify-content:space-between'});
          var inf=el('div');
          inf.appendChild(el('div',{style:'font-size:13px;font-weight:500;color:var(--fos-ink)',text:ts.styleName}));
          inf.appendChild(el('div',{cls:'fos-code',style:'font-size:11px;color:var(--fos-ink-secondary);margin-top:2px',text:ts.tsNumber+(ts.season?' · '+ts.season:'')}));
          row.appendChild(inf);row.appendChild(el('span',{cls:'badge blue',text:'Select'}));
          (function(t){row.onclick=function(){NO_TS=t;NO_STEP=2;renderTab('neworder');};})(ts);
          rL.appendChild(row);
        });
      })
      .withFailureHandler(function(){rL.innerHTML='<div style="color:#ef4444;font-size:12px">Search failed</div>';})
      .searchTS(q);
  }
  sB.onclick=doSearch;sI.onkeydown=function(e){if(e.key==='Enter')doSearch();};doSearch();
}

function renderNO_CreateTS(c){
  c.innerHTML='';
  c.appendChild(sectionTitle('Create New BOM'));
  var bk=el('button',{style:'background:var(--fos-bg);color:var(--fos-ink-secondary);border:1px solid var(--fos-border);font-size:12px;padding:8px 14px;border-radius:8px;margin-bottom:12px',text:'← Back'});
  bk.onclick=function(){renderTab('neworder');};c.appendChild(bk);
  var card=el('div',{cls:'fos-card'});
  var stG=el('div',{cls:'form-group'});stG.appendChild(el('label',{cls:'form-label',text:'Style Name *'}));
  var stI=el('input',{cls:'form-input',type:'text',placeholder:'e.g. 203090 Full Black'});stG.appendChild(stI);card.appendChild(stG);
  var gr2=el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:10px'});
  var ctG=el('div',{cls:'form-group',style:'margin-bottom:0'});ctG.appendChild(el('label',{cls:'form-label',text:'Category'}));
  var ctI=el('input',{cls:'form-input',type:'text',placeholder:'e.g. Sneakers'});ctG.appendChild(ctI);gr2.appendChild(ctG);
  var snG=el('div',{cls:'form-group',style:'margin-bottom:0'});snG.appendChild(el('label',{cls:'form-label',text:'Season'}));

  var prevW=el('button',{text:'◀',style:'padding:6px 12px;border:1px solid var(--fos-border);border-radius:8px;background:var(--fos-bg);color:var(--fos-ink);font-size:14px;cursor:pointer'});
  var plabel=el('div',{style:'flex:1;text-align:center'});

  var nextW=el('button',{text:'▶',style:'padding:6px 12px;border:1px solid var(--fos-border);border-radius:8px;background:var(--fos-bg);color:'+(atCurrent?'var(--fos-ink-secondary)':'var(--fos-ink)')+';font-size:14px;opacity:'+(atCurrent?'0.4':'1')+';cursor:'+(atCurrent?'not-allowed':'pointer')});
  nextW.disabled=atCurrent;
  prevW.onclick=function(){var s=PAY_PERIOD.custom?_curWk.sat:PAY_PERIOD.sat;var b=new Date(s.getFullYear(),s.getMonth(),s.getDate()-7);PAY_PERIOD=_payWeek(b);renderPayment(c);};
  nextW.onclick=function(){if(atCurrent)return;var a=new Date(PAY_PERIOD.sat.getFullYear(),PAY_PERIOD.sat.getMonth(),PAY_PERIOD.sat.getDate()+7);if(a.getTime()>_curWk.sat.getTime())a=_curWk.sat;PAY_PERIOD=_payWeek(a);renderPayment(c);};
  pick.appendChild(prevW);pick.appendChild(plabel);pick.appendChild(nextW);

  // ── Custom range: Sat–Sat, Sat–Mon, any span up to today (no future) ──
  var cr=el('div',{style:'display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;font-size:13px;color:var(--fos-ink-secondary)'});
  cr.appendChild(el('span',{text:'Or custom:'}));
  var fromI=el('input',{type:'date',style:'padding:6px 8px;border:1px solid var(--fos-border);border-radius:6px;background:var(--fos-surface);color:var(--fos-ink);font-size:13px'});
  var toI=el('input',{type:'date',style:'padding:6px 8px;border:1px solid var(--fos-border);border-radius:6px;background:var(--fos-surface);color:var(--fos-ink);font-size:13px'});
  fromI.value=_iso(PAY_PERIOD.sat); toI.value=_iso(PAY_PERIOD.fri);
  var applyBtn=el('button',{text:'Apply',style:'padding:6px 12px;border:1px solid var(--fos-border);border-radius:8px;background:var(--fos-bg);color:var(--fos-ink);font-size:13px;cursor:pointer'});
  applyBtn.onclick=function(){
    var today=_iso(new Date());
    if(!fromI.value||!toI.value){toast('Pick both dates',true);return;}
    if(toI.value<fromI.value){toast('End date is before start date',true);return;}
    if(toI.value>today){toast('Cannot pay for a future date',true);return;}
    PAY_PERIOD=_customPeriod(fromI.value,toI.value);renderPayment(c);
  };
  cr.appendChild(el('span',{text:'from'}));cr.appendChild(fromI);
  cr.appendChild(el('span',{text:'to'}));cr.appendChild(toI);
  cr.appendChild(applyBtn);
  c.appendChild(cr);

  // ── Non-standard period needs Ayush's approval (one pay run) ──
  var _isFree=(PAY_PERIOD.periodId===_defaultPayWeek().periodId);
  if(!_isFree){
    var appr=el('div',{style:'display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 12px;background:#FFF7E6;border:1px solid var(--fos-warning);border-radius:10px'});
    appr.appendChild(el('div',{style:'flex:1;font-size:12px;color:var(--fos-ink)',text:'This isn\'t the current pay week — it needs Ayush\'s approval before you can pay under it (one run).'}));
    var reqBtn=el('button',{text:'Request approval',style:'padding:8px 14px;border:none;border-radius:8px;background:var(--fos-warning);color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0'});
    reqBtn.onclick=function(){
      var reason=window.prompt('Reason for this custom pay period (optional):')||'';
      reqBtn.disabled=true;reqBtn.textContent='Requesting...';
      google.script.run
        .withSuccessHandler(function(){reqBtn.textContent='Requested ✓';toast('Approval request sent to Ayush — '+PAY_PERIOD.label);})
        .withFailureHandler(function(e){reqBtn.disabled=false;reqBtn.textContent='Request approval';toast((e&&e.message)||'Could not send request',true);})
        .submitRequest('CUSTOM_PERIOD_REQUEST',JSON.stringify({periodId:PAY_PERIOD.periodId,fromDate:_iso(PAY_PERIOD.sat),toDate:_iso(PAY_PERIOD.fri),reason:reason}));
    };
    appr.appendChild(reqBtn);
    c.appendChild(appr);
  }

  var jcs=D.completedJobCards;
  if(!Array.isArray(jcs)){c.appendChild(alert_('yellow','Loading...','Tap Refresh'));return;}

  var arts=D.entry&&D.entry.articles?D.entry.articles:[];
  var contractors=D.contractors||[];
  var artByRef={};arts.forEach(function(a){artByRef[a.sheet]=a;});
  var ctrById={};contractors.forEach(function(ct){ctrById[ct.ctrId]=ct;});

  // ── Advances: open cards with pairs already returned but not yet paid ──
  var advCards=Array.isArray(D.advanceable)?D.advanceable:[];
  if(advCards.length){
    c.appendChild(el('div',{style:'font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--fos-ink-secondary);text-transform:uppercase;margin:4px 0 8px',text:'Advances — pairs returned so far'}));
    advCards.forEach(function(jc){
      var art=artByRef[jc.orderRef];
      var artName=art?(art.article||jc.orderRef):jc.orderRef;
      var lines=Array.isArray(jc.lines)?jc.lines:[];
      var total=typeof jc.totalAmount==='number'?jc.totalAmount:lines.reduce(function(s,l){return s+(l.amount||0);},0);
      var rateOk=lines.length>0&&lines.every(function(l){return safeNum(l.ratePerPair)>0;});
      var card=el('div',{cls:'fos-card',style:'margin-bottom:12px;padding:0;overflow:hidden;border-left:3px solid var(--fos-warning)'});
      var ch=el('div',{style:'padding:12px 16px;background:var(--fos-bg);border-bottom:1px solid var(--fos-border)'});
      ch.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary)',text:jc.jobCardId+' · '+(jc.status||'')}));
      ch.appendChild(el('div',{style:'font-size:15px;font-weight:600;color:var(--fos-ink);margin-top:2px',text:artName}));
      ch.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:(jc.movement||'')+' · '+jc.pairsReceived+' of '+jc.pairsIssued+' pairs returned'}));
      card.appendChild(ch);
      // Hinglish note so the person doing the advance isn't confused
      card.appendChild(el('div',{style:'padding:8px 16px;font-size:11px;color:var(--fos-ink);background:#FFF7E6;border-bottom:1px solid var(--fos-border);line-height:1.5',text:'Advance de rahe ho: har contractor ke aage ₹ amount bharo jitna abhi dena hai. Amount pure pair ke hisaab se adjust hoga (aadha pair nahi hota) — sahi figure neeche dikhega. Kaam se zyada advance nahi de sakte.'}));
      var lw=el('div');
      var lineStates=[];
      var totEl=null;
      function updateAdvTotal(){var t=0;lineStates.forEach(function(s){t+=s.pairs*s.rate;});if(totEl)totEl.textContent='₹'+t.toFixed(2);}
      lines.forEach(function(l){
        var rate=safeNum(l.ratePerPair);
        var maxPairs=safeNum(l.payablePairs);
        var st={contractorId:l.contractorId,rate:rate,pairs:maxPairs};
        var rw=el('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:0.5px solid var(--fos-border)'});
        var lft=el('div',{style:'flex:1;min-width:0'});
        var _lc=ctrById[l.contractorId];
        lft.appendChild(el('div',{style:'font-size:14px;color:var(--fos-ink)',text:_lc?ctrLabel(_lc,contractors):(l.contractorName||l.contractorId)}));
        lft.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:rate>0?('₹'+rate.toFixed(2)+'/pair · '+maxPairs+' pairs unpaid'+(l.alreadyPaidPairs?(' ('+l.alreadyPaidPairs+' already paid)'):'')):'Rate not set'}));
        var pairLbl=el('div',{style:'font-size:11px;color:var(--fos-accent);margin-top:2px',text:maxPairs+' pair'+(maxPairs!==1?'s':'')+' · ₹'+(maxPairs*rate).toFixed(2)});
        lft.appendChild(pairLbl);
        rw.appendChild(lft);
        var amtI=el('input',{type:'number',style:'width:82px;padding:6px 8px;border:1px solid var(--fos-border);border-radius:8px;font-size:14px;text-align:right;background:var(--fos-surface);color:var(--fos-ink);flex-shrink:0'});
        amtI.value=(maxPairs*rate).toFixed(2);
        if(rate<=0)amtI.disabled=true;
        function snap(setInput){
          var typed=parseFloat(amtI.value);if(isNaN(typed)||typed<0)typed=0;
          var p=(rate>0)?Math.round(typed/rate):0;if(isNaN(p)||p<0)p=0;if(p>maxPairs)p=maxPairs;
          st.pairs=p;
          pairLbl.textContent=p+' pair'+(p!==1?'s':'')+' · ₹'+(p*rate).toFixed(2);
          if(setInput)amtI.value=(p*rate).toFixed(2);
          updateAdvTotal();
        }
        amtI.oninput=function(){snap(false);};
        amtI.onchange=function(){snap(true);};
        rw.appendChild(amtI);
        lw.appendChild(rw);
        lineStates.push(st);
      });
      card.appendChild(lw);
      var ft=el('div',{style:'display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--fos-bg)'});
      ft.appendChild(el('div',{style:'flex:1;font-size:12px;color:var(--fos-ink-secondary)',text:'Total advance'}));
      totEl=el('div',{style:'font-family:var(--fos-font-mono);font-size:15px;font-weight:700;color:var(--fos-ink)'});totEl.textContent='₹'+total.toFixed(2);
      ft.appendChild(totEl);
      var advBtn=el('button',{cls:'primary-btn',text:'Pay Advance',style:'width:auto;padding:10px 16px;font-size:13px;border-radius:10px;flex-shrink:0'});
      advBtn.disabled=!rateOk;
      ft.appendChild(advBtn);
      card.appendChild(ft);
      c.appendChild(card);
      (function(theJc,btn,ok,states){
        btn.onclick=function(){
          if(!ok){toast('Some contractors have no rate — check activity setup',true);return;}
          var linePairs={},anyPos=false;
          states.forEach(function(s){linePairs[s.contractorId]=s.pairs;if(s.pairs>0)anyPos=true;});
          if(!anyPos){toast('Enter an advance amount above 0',true);return;}
          btn.disabled=true;btn.textContent='Advancing...';
          google.script.run
            .withSuccessHandler(function(rr){
              if(rr&&rr.success){
                toast('Advance '+theJc.jobCardId+' — ₹'+safeNum(rr.totalAmount).toFixed(2)+(rr.advanceId?' · '+rr.advanceId:''));
                D.completedJobCards=null;D.advanceable=null;loadTab('payment');
              } else { btn.disabled=false;btn.textContent='Pay Advance';toast((rr&&rr.error)?rr.error:'Advance failed',true); }
            })
            .withFailureHandler(function(e){btn.disabled=false;btn.textContent='Pay Advance';toast((e&&e.message)||'Error submitting advance',true);})
            .submitCardAdvance({jobCardId:theJc.jobCardId,periodId:PAY_PERIOD.periodId,linePairs:linePairs,notes:''});

      })(jc,advBtn,rateOk,lineStates);

  }

  if(!jcs.length){
    if(!advCards.length){
      var emptyWrap=el('div',{style:'text-align:center;padding:60px 20px'});
      emptyWrap.appendChild(el('div',{style:'font-size:36px;color:var(--fos-success);margin-bottom:12px',text:'✓'}));
      emptyWrap.appendChild(el('div',{style:'font-size:15px;font-weight:600;color:var(--fos-ink)',text:'No job cards pending payment'}));
      emptyWrap.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary);margin-top:4px',text:'All paid up!'}));
      c.appendChild(emptyWrap);
    }
    return;
  }

  // ── Completed cards — grouped by receive-day, tick to pay ──
  function cardTotalOf(jc){var ls=Array.isArray(jc.lines)?jc.lines:[];return typeof jc.totalAmount==='number'?jc.totalAmount:ls.reduce(function(s,l){return s+(l.amount||0);},0);}
  function rateOkOf(jc){var ls=Array.isArray(jc.lines)?jc.lines:[];return ls.length>0&&ls.every(function(l){return safeNum(l.ratePerPair)>0;});}
  function payableIds(){return jcs.filter(rateOkOf).map(function(j){return j.jobCardId;});}
  var footBtn=null;
  function updateFooter(){
    var n=0,tot=0;
    jcs.forEach(function(j){if(PAY_SELECTED[j.jobCardId]){n++;tot+=cardTotalOf(j);}});
    if(footBtn){footBtn.textContent=n?('Pay '+n+' card'+(n!==1?'s':'')+' · ₹'+tot.toFixed(2)):'Pay Selected';footBtn.disabled=!n;}
  }
  var dayCbs=[], cardCbs={};
  function syncDay(){dayCbs.forEach(function(d){d.cb.checked=d.ids.length>0&&d.ids.every(function(id){return PAY_SELECTED[id];});});}
  function syncAll(){var p=payableIds();allCb.checked=p.length>0&&p.every(function(id){return PAY_SELECTED[id];});}

  var secHdr=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px'});
  secHdr.appendChild(el('div',{style:'font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--fos-ink-secondary);text-transform:uppercase',text:'Completed — tick to pay'}));
  var allWrap=el('label',{style:'display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fos-ink-secondary);cursor:pointer'});
  var allCb=el('input',{type:'checkbox'});
  allWrap.appendChild(allCb);allWrap.appendChild(el('span',{text:'Select all'}));
  secHdr.appendChild(allWrap);
  c.appendChild(secHdr);
  allCb.onchange=function(){payableIds().forEach(function(id){PAY_SELECTED[id]=allCb.checked;if(cardCbs[id])cardCbs[id].checked=allCb.checked;});syncDay();updateFooter();};

  // group by receive-day
  var groups={},order=[];
  jcs.forEach(function(jc){var k=_dayKey(jc.receivedAt);if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(jc);});
  order.sort();

  order.forEach(function(k){
    var dayCards=groups[k];
    var dayPayable=dayCards.filter(rateOkOf).map(function(j){return j.jobCardId;});
    var dh=el('div',{style:'display:flex;align-items:center;gap:8px;margin:14px 0 6px'});
    var dcb=el('input',{type:'checkbox'}); dcb.disabled=!dayPayable.length;
    dh.appendChild(dcb);
    dh.appendChild(el('div',{style:'font-size:13px;font-weight:700;color:var(--fos-ink)',text:_dayLabel(k)}));
    dh.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'· '+dayCards.length+' card'+(dayCards.length!==1?'s':'')}));
    c.appendChild(dh);
    dayCbs.push({cb:dcb,ids:dayPayable});
    dcb.onchange=function(){dayPayable.forEach(function(id){PAY_SELECTED[id]=dcb.checked;if(cardCbs[id])cardCbs[id].checked=dcb.checked;});syncAll();updateFooter();};

    dayCards.forEach(function(jc){
      var art=artByRef[jc.orderRef];
      var artName=art?(art.article||jc.orderRef):jc.orderRef;
      var artColor=(art&&(art.color||art.colour))||jc.color||'';
      var pairs=jc.pairsReceived||jc.pairsIssued||0;
      var lines=Array.isArray(jc.lines)?jc.lines:[];
      var total=cardTotalOf(jc);
      var rateOk=rateOkOf(jc);

      var cCard=el('div',{cls:'fos-card',style:'margin-bottom:12px;padding:0;overflow:hidden'});
      var cHdr=el('div',{style:'display:flex;align-items:flex-start;gap:10px;padding:14px 16px;background:var(--fos-bg);border-bottom:1px solid var(--fos-border)'});
      var cb=el('input',{type:'checkbox',style:'margin-top:3px;flex-shrink:0'}); cb.disabled=!rateOk; cb.checked=!!PAY_SELECTED[jc.jobCardId];
      cardCbs[jc.jobCardId]=cb;
      cb.onchange=function(){PAY_SELECTED[jc.jobCardId]=cb.checked;syncDay();syncAll();updateFooter();};
      cHdr.appendChild(cb);
      var cHdrTxt=el('div',{style:'flex:1;min-width:0'});
      cHdrTxt.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary)',text:jc.jobCardId}));
      cHdrTxt.appendChild(el('div',{style:'font-size:16px;font-weight:700;color:var(--fos-ink);margin-top:2px',text:artName+(artColor?' · '+artColor:'')}));
      cHdrTxt.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:2px',text:(jc.store||'')+(jc.movement?' · '+jc.movement:'')+' · '+pairs+' pairs'}));
      (function(){var _sb=jc.sizeBreakdown||{};var _sk=Object.keys(_sb).filter(function(k){return safeNum(_sb[k])>0;}).sort(function(a,b){return parseFloat(a)-parseFloat(b);});if(_sk.length){var szR=el('div',{style:'display:flex;flex-wrap:wrap;gap:4px;margin-top:4px'});_sk.forEach(function(k){szR.appendChild(el('span',{style:'font-size:10px;background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:5px;padding:1px 6px;color:var(--fos-ink-secondary)',text:k+': '+safeNum(_sb[k])}));});cHdrTxt.appendChild(szR);}})();
      cHdr.appendChild(cHdrTxt);
      cCard.appendChild(cHdr);

      var linesWrap=el('div');
      lines.forEach(function(l){
        var rate=safeNum(l.ratePerPair);
        var row=el('div',{style:'display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:0.5px solid var(--fos-border)'});
        var left=el('div',{style:'flex:1;min-width:0'});
        var _pc=ctrById[l.contractorId];
        left.appendChild(el('div',{style:'font-size:14px;font-weight:500;color:var(--fos-ink)',text:_pc?ctrLabel(_pc,contractors):(l.contractorName||l.contractorId)}));
        var actTxt=(l.activities&&l.activities.length)?l.activities.join(', '):'';
        if(actTxt)left.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:1px',text:actTxt}));
        var _pp=(l.payablePairs!==undefined?l.payablePairs:pairs);
        left.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:rate>0?('₹'+rate.toFixed(2)+'/pair × '+_pp+(l.alreadyPaidPairs?(' ('+l.alreadyPaidPairs+' advanced)'):'')):'Rate not set'}));
        row.appendChild(left);
        var amt=el('div',{style:'text-align:right;flex-shrink:0;padding-top:2px'});
        if(rate>0){amt.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:14px;font-weight:700;color:var(--fos-accent)',text:'₹'+safeNum(l.amount).toFixed(2)}));}
        else{amt.appendChild(el('div',{style:'font-size:11px;color:var(--fos-warning);max-width:100px;text-align:right;line-height:1.4',text:'Rate not set — check activity setup'}));}
        row.appendChild(amt);
        linesWrap.appendChild(row);
      });
      cCard.appendChild(linesWrap);

      var foot=el('div',{style:'display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--fos-bg);border-top:1px solid var(--fos-border)'});
      foot.appendChild(el('div',{style:'flex:1;font-size:13px;color:var(--fos-ink-secondary)',text:lines.length+' contractor'+(lines.length!==1?'s':'')}));
      foot.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:15px;font-weight:700;color:var(--fos-ink)',text:'₹'+total.toFixed(2)}));
      cCard.appendChild(foot);
      c.appendChild(cCard);
    });
  });

  syncDay();syncAll();

  // Pay Selected — pays every ticked card, stamped with the chosen period
  var payBar=el('div',{style:'position:sticky;bottom:0;background:var(--fos-surface);border-top:1px solid var(--fos-border);padding:12px 0;margin-top:8px'});
  footBtn=el('button',{cls:'primary-btn',text:'Pay Selected',style:'width:100%;padding:14px;font-size:15px;border-radius:12px'});
  footBtn.disabled=true;
  payBar.appendChild(footBtn);
  c.appendChild(payBar);
  updateFooter();

  footBtn.onclick=function(){
    var ids=jcs.filter(function(j){return PAY_SELECTED[j.jobCardId];}).map(function(j){return j.jobCardId;});
    if(!ids.length){toast('Tick at least one card to pay',true);return;}
    footBtn.disabled=true;footBtn.textContent='Paying...';
    google.script.run
      .withSuccessHandler(function(rr){
        if(rr&&(rr.success||rr.paid>0)){
          toast('Paid '+(rr.paid||0)+' card'+((rr.paid||0)!==1?'s':'')+(rr.failed?(' · '+rr.failed+' failed'):'')+' — ₹'+safeNum(rr.totalAmount).toFixed(2)+' · '+PAY_PERIOD.label);
          ids.forEach(function(id){delete PAY_SELECTED[id];});
          D.completedJobCards=null;loadTab('payment');
        } else {
          footBtn.disabled=false;updateFooter();
          toast((rr&&rr.error)?rr.error:'Payment failed',true);
        }
      })
      .withFailureHandler(function(e){footBtn.disabled=false;updateFooter();toast((e&&e.message)||'Error submitting pay run',true);})
      .submitPayRun({periodId:PAY_PERIOD.periodId,jobCardIds:ids,notes:''});
  };
}

// ── PAYMENT HISTORY ───────────────────────────────────────────────────────────
function renderPayHistory(c){
  c.innerHTML='';
  // Legacy payment rows were stamped PAY-yyyy-mm-dd (the day paid). Map them to the
  // enclosing Sat-Fri week ID (W-yyyyMMdd) so history groups by pay period, not day.
  function normPeriodId(pid){
    var m=/^PAY-(\d{4})-(\d{2})-(\d{2})$/.exec(pid||'');
    if(!m)return pid;                       // already W-*, or unknown - leave as-is
    var d=new Date(+m[1],+m[2]-1,+m[3]);
    var dow=d.getDay();                      // 0=Sun..6=Sat
    var back=(dow===6)?0:(dow+1);            // walk back to the week's Saturday
    d.setDate(d.getDate()-back);
    var y=d.getFullYear(),mo=('0'+(d.getMonth()+1)).slice(-2),da=('0'+d.getDate()).slice(-2);
    return 'W-'+y+mo+da;
  }
  var batches=D.payBatches||[];
  var artMap={};

            var body='<table><tr><td><b>Payment ID</b></td><td>'+_esc(batch.paymentId||'—')+'</td><td><b>Period</b></td><td>'+_esc(_periodLabel(batch.periodId))+'</td></tr>'+

              '<table><tr><th>Job Card</th><th>Article</th><th class="rt">Pairs</th><th class="rt">Amount</th></tr>'+rows+
              '<tr class="tot"><td colspan="2">Total</td><td class="rt">'+pairsT+'</td><td class="rt">₹'+amtT.toFixed(2)+'</td></tr></table>'+
              '<div style="margin-top:44px;display:flex;justify-content:space-between;font-size:12px"><div>_______________________<br>Contractor signature</div><div>_______________________<br>Authorised signature</div></div>';
            printDoc('Payment Voucher — '+cName,body);

        })(b,ctrName,bPairs,bAmt);
        if(_dispStatus==='APPROVED'&&b.approvedBy){
          var apDate=b.date?(new Date(b.date)).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}):'';

            var rejectBtn=el('button',{style:'padding:5px 14px;background:none;color:#dc2626;border:1.5px solid #dc2626;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer',text:'Reject'});
            var btnRow=el('div',{style:'display:flex;gap:8px;margin-left:auto'});

              var rkWrap=el('div',{style:'display:none;margin-top:8px'});
              var rkInp=el('textarea',{placeholder:'Rejection reason — required',

                  .withSuccessHandler(function(r){

            bftr.appendChild(btnRow);
          } else {
            bftr.appendChild(el('span',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-left:auto',text:'Awaiting approval'}));

        bCard.appendChild(bftr);

  selPeriod.onchange=rebuildList;

    enrRow.appendChild(deptDrop);enrRow.appendChild(addDeptBtn);

    // ── Details toggle: profile · documents · balance to pay ──────────────────

    var detPanel=el('div',{style:'display:none;margin-top:8px'});

      var drawChips=function(){
        chWrap.innerHTML='';

        if(!enrs.length){chWrap.appendChild(el('span',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'No departments assigned'}));return;}
        enrs.forEach(function(e){
          var chip=el('div',{style:'display:inline-flex;align-items:center;gap:3px;background:var(--fos-accent-soft);color:var(--fos-accent);font-size:11px;padding:2px 8px;border-radius:12px'});

          .withSuccessHandler(function(r){
            aBtn.disabled=false;aBtn.textContent='+';
            if(r&&r.success){drop.value='';google.script.run.withSuccessHandler(function(enrs){D.enrollments=Array.isArray(enrs)?enrs:[];drawChips();}).withFailureHandler(function(){}).getEnrollments({status:'ACTIVE'});}

              .deleteContractor({ctrId:cId});
          };
        } else {

            .withSuccessHandler(function(r){
              if(r&&r.success){toast('Contractor reactivated');D.ctrs=null;D.contractors=null;D.enrollments=null;loadTab('contractors');}
              else{btn.disabled=false;btn.textContent='Reactivate';toast((r&&r.error)||'Error',true);}
            })
            .withFailureHandler(function(){btn.disabled=false;btn.textContent='Reactivate';toast('Error',true);})
            .reactivateContractor({ctrId:cId});
        }

    })(ctrId,isActive,actBtn);

    // ── Details panel: lazy-load profile, documents, balance ──────────────────
    (function(cId,cName,tgl,panel){
