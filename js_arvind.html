// ── PHASE 8.2 + 8.3 — Contractor detail: profile, documents, balance to pay ──
var _DOC_TYPES=['Aadhaar','Passbook','Agreement','PAN','Photo','Other'];
function loadContractorDetail(cId,cName,panel){
  panel.innerHTML='<div style="font-size:12px;color:var(--fos-ink-secondary);padding:8px">Loading…</div>';
  google.script.run
    .withSuccessHandler(function(pr){
      google.script.run
        .withSuccessHandler(function(acct){renderContractorDetail(cId,cName,panel,pr,acct);})
        .withFailureHandler(function(){renderContractorDetail(cId,cName,panel,pr,null);})
        .getContractorAccount(cId);
    })
    .withFailureHandler(function(){panel.innerHTML='<div style="font-size:12px;color:var(--fos-danger);padding:8px">Could not load profile.</div>';})
    .getContractorProfile(cId);
}

function renderContractorDetail(cId,cName,panel,pr,acct){
  panel.innerHTML='';
  var box=el('div',{style:'background:var(--fos-bg);border:0.5px solid var(--fos-border);border-radius:10px;padding:12px'});

  // ---- PROFILE ----
  box.appendChild(el('div',{style:'font-size:12px;font-weight:700;color:var(--fos-ink);margin-bottom:8px',text:'Profile'}));
  var prof=(pr&&pr.success&&pr.profile)?pr.profile:{};
  var fields=[['address','Address'],['aadhaarNo','Aadhaar No'],['panNo','PAN No'],['bankName','Bank Name'],['bankAccount','Bank Account No'],['ifsc','IFSC'],['altPhone','Alt Phone'],['notes','Notes']];
  var inputs={};
  var grid=el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:8px'});
  fields.forEach(function(f){
    var g=el('div',{style:(f[0]==='address'||f[0]==='notes')?'grid-column:1 / -1':''});
    g.appendChild(el('label',{style:'font-size:10px;color:var(--fos-ink-secondary);display:block;margin-bottom:2px',text:f[1]}));
    var inp=el('input',{cls:'form-input',type:'text',value:prof[f[0]]||'',style:'font-size:13px;padding:8px'});
    inputs[f[0]]=inp;g.appendChild(inp);grid.appendChild(g);
  });
  box.appendChild(grid);
  var saveP=el('button',{cls:'primary-btn',text:'Save Profile',style:'margin-top:8px;padding:9px 16px;font-size:13px'});
  saveP.onclick=function(){
    saveP.disabled=true;saveP.textContent='Saving…';
    var payload={contractorId:cId};fields.forEach(function(f){payload[f[0]]=inputs[f[0]].value.trim();});
    google.script.run
      .withSuccessHandler(function(r){saveP.disabled=false;saveP.textContent='Save Profile';toast(r&&r.success?'Profile saved':((r&&r.error)||'Error'),!(r&&r.success));})
      .withFailureHandler(function(){saveP.disabled=false;saveP.textContent='Save Profile';toast('Error',true);})
      .saveContractorProfile(payload);
  };
  box.appendChild(saveP);

  // ---- DOCUMENTS ----
  box.appendChild(el('div',{style:'font-size:12px;font-weight:700;color:var(--fos-ink);margin:14px 0 8px',text:'Documents'}));
  var docList=el('div',{style:'margin-bottom:10px'});
  box.appendChild(docList);
  var docs=(pr&&pr.docs)?pr.docs:[];
  function drawDocs(){
    docList.innerHTML='';
    if(!docs.length){docList.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'No documents uploaded yet.'}));return;}
    docs.forEach(function(d){
      var row=el('div',{style:'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--fos-border)'});
      row.appendChild(el('span',{cls:'badge blue',text:d.docType||'Doc'}));
      var link=el('a',{href:d.url,target:'_blank',rel:'noopener',style:'flex:1;font-size:12px;color:var(--fos-accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',text:d.fileName||'file'});
      row.appendChild(link);
      var rm=el('button',{style:'background:none;border:none;color:var(--fos-danger);font-size:12px;cursor:pointer;text-decoration:underline',text:'Remove'});
      (function(docId,rowEl){rm.onclick=function(){
        rm.disabled=true;rm.textContent='…';
        google.script.run
          .withSuccessHandler(function(r){if(r&&r.success){docs=docs.filter(function(x){return x.docId!==docId;});drawDocs();toast('Removed');}else{rm.disabled=false;rm.textContent='Remove';toast((r&&r.error)||'Error',true);}})
          .withFailureHandler(function(){rm.disabled=false;rm.textContent='Remove';toast('Error',true);})
          .deleteContractorDoc({docId:docId});
      };})(d.docId,row);
      row.appendChild(rm);
      docList.appendChild(row);
    });
  }
  drawDocs();

  // Upload row
  var upRow=el('div',{style:'display:flex;gap:6px;align-items:center;flex-wrap:wrap'});
  var dtSel=el('select',{cls:'form-select',style:'flex:0 0 auto;width:auto;font-size:12px;padding:6px 8px'});
  _DOC_TYPES.forEach(function(t){dtSel.appendChild(el('option',{value:t,text:t}));});
  var fileInp=el('input',{type:'file',style:'flex:1;font-size:12px;min-width:120px'});
  var upBtn=el('button',{cls:'primary-btn',text:'Upload',style:'padding:8px 14px;font-size:13px'});
  upBtn.onclick=function(){
    var f=fileInp.files&&fileInp.files[0];
    if(!f){toast('Choose a file first',true);return;}
    if(f.size>8*1024*1024){toast('File too large (max 8 MB)',true);return;}
    upBtn.disabled=true;upBtn.textContent='Uploading…';
    var reader=new FileReader();
    reader.onload=function(){
      var b64=String(reader.result||'').split(',')[1]||'';
      google.script.run
        .withSuccessHandler(function(r){
          upBtn.disabled=false;upBtn.textContent='Upload';
          if(r&&r.success&&r.doc){docs.push(r.doc);drawDocs();fileInp.value='';toast('Uploaded');}
          else toast((r&&r.error)||'Upload failed',true);
        })
        .withFailureHandler(function(){upBtn.disabled=false;upBtn.textContent='Upload';toast('Upload failed',true);})
        .uploadContractorDoc({contractorId:cId,docType:dtSel.value,fileName:f.name,mimeType:f.type,dataBase64:b64});
    };
    reader.onerror=function(){upBtn.disabled=false;upBtn.textContent='Upload';toast('Could not read file',true);};
    reader.readAsDataURL(f);
  };
  upRow.appendChild(dtSel);upRow.appendChild(fileInp);upRow.appendChild(upBtn);
  box.appendChild(upRow);

  // ---- BALANCE TO PAY (8.3) ----
  box.appendChild(el('div',{style:'font-size:12px;font-weight:700;color:var(--fos-ink);margin:14px 0 8px',text:'Balance to Pay'}));
  if(!acct||!acct.success){
    box.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'Balance unavailable.'}));
  } else {
    var totRow=el('div',{style:'display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--fos-accent-soft);border-radius:8px;margin-bottom:8px'});
    totRow.appendChild(el('span',{style:'font-size:12px;color:var(--fos-ink)',text:'Total outstanding'}));
    totRow.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:15px;font-weight:700;color:var(--fos-accent)',text:fmt(acct.totalOutstanding||0)}));
    box.appendChild(totRow);
    if(acct.byActivity&&acct.byActivity.length){
      var actWrap=el('div',{style:'margin-bottom:8px'});
      acct.byActivity.forEach(function(a){
        var r=el('div',{style:'display:flex;justify-content:space-between;font-size:12px;padding:3px 4px'});
        r.appendChild(el('span',{style:'color:var(--fos-ink)',text:a.activity+' · '+a.pairs+' pr'}));
        r.appendChild(el('span',{style:'font-family:var(--fos-font-mono);color:var(--fos-ink-secondary)',text:fmt(a.amount)}));
        actWrap.appendChild(r);
      });
      box.appendChild(actWrap);
    }
    if(acct.lines&&acct.lines.length){
      var det=el('div',{style:'border-top:0.5px solid var(--fos-border);padding-top:6px'});
      acct.lines.forEach(function(l){
        var r=el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);padding:2px 4px'});
        r.textContent=(l.article||l.orderRef)+' — '+l.activity+': '+l.payablePairs+' pr × '+fmt(l.ratePerPair)+' = '+fmt(l.amount)+' ('+l.status+')';
        det.appendChild(r);
      });
      box.appendChild(det);
    } else {
      box.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'Nothing outstanding.'}));
    }
  }

  panel.appendChild(box);
}

function renderActivities(c){
  c.innerHTML='';

  // ── PER-ORDER ACTIVITY SETUP ──────────────────────────────────────────
  c.appendChild(sectionTitle('Order Activity Setup'));

  // Order selector
  var oasCard = el('div', {cls:'fos-card', style:'margin-bottom:16px'});
  var oasLabel = el('div', {style:'font-size:12px;color:var(--fos-ink-secondary);margin-bottom:8px',
    text:'Select an order to set up activities for that order\'s departments'});
  oasCard.appendChild(oasLabel);

  var oasSel = el('select', {cls:'form-select', style:'margin-bottom:10px'});
  oasSel.appendChild(el('option', {value:'', text:'— Select Order —'}));
  var oasArts = D.entry && D.entry.articles ? D.entry.articles : [];
  oasArts.forEach(function(a) {
    var label = (a.bom || a.sheet) + ' · ' + (a.article || a.sheet) + (a.customer ? ' — ' + a.customer : '');
    oasSel.appendChild(el('option', {value: a.sheet, text: label}));
  });
  oasCard.appendChild(oasSel);

  var oasBody = el('div');
  oasCard.appendChild(oasBody);
  c.appendChild(oasCard);

  // When order selected — render the activity setup form for that order
  oasSel.onchange = function() {
    oasBody.innerHTML = '';
    if (!oasSel.value) return;
    var selectedArt = oasArts.filter(function(a) { return a.sheet === oasSel.value; })[0];
    if (!selectedArt) return;
    renderActivitySetup(oasBody, selectedArt);
  };

  c.appendChild(el('div', {style:'height:1px;background:var(--fos-border);margin:16px 0'}));
  // ── END PER-ORDER ACTIVITY SETUP ──────────────────────────────────────

  c.appendChild(sectionTitle('Master Activities'));
  var addWrap=el('div',{style:'margin-bottom:12px'});
  var addBtn=el('button',{cls:'fos-btn-secondary',text:'+ Add Activity',style:'margin-bottom:0'});
  var addForm=el('div',{style:'display:none;background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:12px;padding:14px;margin-top:8px'});
  var rowsWrap=el('div');
  var actRows=[];
  function makeActRow(){
    var rowDiv=el('div',{style:'padding-bottom:12px;margin-bottom:12px;border-bottom:0.5px solid var(--fos-border)'});
    var dG=el('div',{cls:'form-group'});dG.appendChild(el('label',{cls:'form-label',text:'Department'}));
    var dSel=el('select',{cls:'form-select'});
    [{v:'cutting',l:'Cutting'},{v:'prep',l:'Prep'},{v:'fitter',l:'Fitter'},{v:'lasting',l:'Lasting'},{v:'finish',l:'Finish'},{v:'dispatch',l:'Dispatch'}].forEach(function(d){dSel.appendChild(el('option',{text:d.l,value:d.v}));});
    dG.appendChild(dSel);rowDiv.appendChild(dG);
    var nG=el('div',{cls:'form-group'});nG.appendChild(el('label',{cls:'form-label',text:'Activity Name *'}));
    var nI=el('input',{cls:'form-input',type:'text',placeholder:'e.g. Upper Making'});nG.appendChild(nI);rowDiv.appendChild(nG);
    var grid=el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:10px'});
    var rG=el('div',{cls:'form-group',style:'margin-bottom:0'});rG.appendChild(el('label',{cls:'form-label',text:'Rate (₹/pair) *'}));
    var rI=el('input',{cls:'form-input',type:'number',placeholder:'0'});rG.appendChild(rI);grid.appendChild(rG);
    var cG=el('div',{cls:'form-group',style:'margin-bottom:0'});cG.appendChild(el('label',{cls:'form-label',text:'Comm (₹/pair)'}));
    var cI=el('input',{cls:'form-input',type:'number',placeholder:'0'});cG.appendChild(cI);grid.appendChild(cG);
    rowDiv.appendChild(grid);
    var entry={rowDiv:rowDiv,dept:dSel,name:nI,rate:rI,comm:cI};
    var delBtn=el('button',{text:'✕ Remove',style:'background:none;color:var(--fos-ink-secondary);font-size:11px;margin-top:8px;padding:0;cursor:pointer'});
    (function(e){delBtn.onclick=function(){var i=actRows.indexOf(e);if(i>-1)actRows.splice(i,1);rowsWrap.removeChild(rowDiv);updDel();};})(entry);
    entry.delBtn=delBtn;rowDiv.appendChild(delBtn);
    actRows.push(entry);rowsWrap.appendChild(rowDiv);updDel();
  }
  function updDel(){actRows.forEach(function(e){e.delBtn.style.display=actRows.length>1?'':'none';});}
  makeActRow();
  addForm.appendChild(rowsWrap);
  var addMoreBtn=el('button',{text:'+ Add Another',style:'background:var(--fos-bg);color:var(--fos-accent);border:1px solid var(--fos-border);font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;width:100%;margin-bottom:10px'});
  addMoreBtn.onclick=function(){makeActRow();};
  addForm.appendChild(addMoreBtn);
  var afBR=el('div',{style:'display:flex;gap:8px;align-items:center'});
  var afSub=el('button',{cls:'primary-btn',text:'Submit All for Approval',style:'flex:1;padding:12px'});
  var afCnl=el('a',{style:'font-size:12px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',text:'Cancel'});
  afBR.appendChild(afSub);afBR.appendChild(afCnl);addForm.appendChild(afBR);
  addBtn.onclick=function(){addForm.style.display='block';addBtn.style.display='none';};
  function resetActForm(){addForm.style.display='none';addBtn.style.display='';rowsWrap.innerHTML='';actRows=[];makeActRow();}
  afCnl.onclick=resetActForm;
  afSub.onclick=function(){
    var items=[],valid=true;
    actRows.forEach(function(e){
      var nm=e.name.value.trim(),rt=parseFloat(e.rate.value)||0;
      if(!nm||!rt){valid=false;return;}
      items.push({dept:e.dept.value,activityName:nm,rate:rt,comm:parseFloat(e.comm.value)||0});
    });
    if(!valid||!items.length){toast('Each activity needs a name and rate',true);return;}
    afSub.disabled=true;afSub.textContent='Submitting…';
    google.script.run
      .withSuccessHandler(function(r){
        afSub.disabled=false;afSub.textContent='Submit All for Approval';
        if(r&&r.success){
          var msg='Submitted '+r.count+' activit'+(r.count===1?'y':'ies')+' for approval';
          if(r.skipped&&r.skipped.length)msg+=' — skipped: '+r.skipped.join('; ');
          toast(msg);resetActForm();D.entry=null;loadTab('activities');
        }
        else toast((r&&r.error)||'Error',true);
      })
      .withFailureHandler(function(){afSub.disabled=false;afSub.textContent='Submit All for Approval';toast('Error',true);})
      .requestMasterActivity(items,'');
  };
  addWrap.appendChild(addBtn);addWrap.appendChild(addForm);c.appendChild(addWrap);
  if(!MASTER_ACTS.length){c.appendChild(el('div',{style:'color:#4a5578;padding:40px;text-align:center',text:'No activities — open Entry tab first'}));return;}
  var DEPT_ORDER=['cutting','prep','fitter','lasting','finish','dispatch'];
  var deptMap={};
  MASTER_ACTS.forEach(function(ma){var s=(ma.section||'other').toLowerCase();if(!deptMap[s])deptMap[s]=[];deptMap[s].push(ma);});
  var deptKeys=DEPT_ORDER.filter(function(k){return deptMap[k];});
  Object.keys(deptMap).forEach(function(k){if(DEPT_ORDER.indexOf(k)<0)deptKeys.push(k);});
  deptKeys.forEach(function(dept){
    var acts=deptMap[dept];
    c.appendChild(el('div',{style:'font-size:10px;font-weight:500;color:var(--fos-ink-secondary);letter-spacing:1px;text-transform:uppercase;margin:10px 2px 6px',text:'● '+dept.toUpperCase()+' ('+acts.length+')'}));
    acts.forEach(function(ma){
      var card=el('div',{cls:'fos-card',style:'margin-bottom:10px;padding:12px 14px'});
      var top=el('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:8px'});
      var nameDiv=el('div',{style:'flex:1;min-width:0'});
      nameDiv.appendChild(el('div',{style:'font-size:14px;font-weight:500;color:var(--fos-ink)',text:ma.name}));
      nameDiv.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary);margin-top:2px',text:'₹'+ma.stdRate+'/pr'+(ma.comm?' + ₹'+ma.comm+' comm':'')}));
      top.appendChild(nameDiv);
      card.appendChild(top);
      var _nrrMatch=NO_RESUBMIT_RATE&&NO_RESUBMIT_RATE.rowIndex===ma.rowIndex;
      if(ma.hasPendingRateEdit&&!_nrrMatch){
        top.appendChild(el('span',{cls:'badge yellow',text:'RATE CHANGE PENDING'}));
      } else if(ma.hasRejectedRateEdit&&!_nrrMatch){
        top.appendChild(el('span',{cls:'badge red',text:'RATE CHANGE REJECTED'}));
        var rejDiv=el('div',{style:'margin-top:8px;padding:8px 10px;background:var(--fos-accent-soft);border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px'});
        rejDiv.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-danger)',text:'Proposed: ₹'+ma.rejectedRate+'/pr'+(ma.rejectedComm?' + ₹'+ma.rejectedComm+' comm':'')}));
        var dismissLink=el('a',{style:'font-size:11px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline;flex-shrink:0',text:'Dismiss'});
        (function(reqId){dismissLink.onclick=function(){
          google.script.run
            .withSuccessHandler(function(res){if(res&&res.success){D.entry=null;loadTab('activities');}else toast((res&&res.error)||'Error',true);})
            .withFailureHandler(function(){toast('Error',true);})
            .dismissRateEdit(reqId);
        };})(ma.rejectedReqId);
        rejDiv.appendChild(dismissLink);
        card.appendChild(rejDiv);
      } else {
        var editBtn=el('button',{text:'Edit',style:'background:var(--fos-bg);color:var(--fos-accent);border:1px solid var(--fos-border);font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;flex-shrink:0'});
        top.appendChild(editBtn);
        var editForm=el('div',{style:'display:none;margin-top:10px;padding-top:10px;border-top:0.5px solid var(--fos-border)'});
        var r2=el('div',{style:'display:flex;gap:8px;margin-bottom:8px'});
        var rInp=el('input',{type:'number',placeholder:'New Rate ₹',value:ma.stdRate||'',style:'flex:1;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:8px;padding:8px;color:var(--fos-ink);font-family:var(--fos-font-mono);font-size:13px;text-align:center'});
        var cInp=el('input',{type:'number',placeholder:'New Comm ₹',style:'flex:1;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:8px;padding:8px;color:var(--fos-ink);font-family:var(--fos-font-mono);font-size:13px;text-align:center'});
        r2.appendChild(rInp);r2.appendChild(cInp);
        editForm.appendChild(r2);
        var subRow=el('div',{style:'display:flex;gap:8px;align-items:center'});
        var subBtn=el('button',{text:'Submit for Approval',style:'background:var(--fos-accent);color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px'});
        var cancelBtn=el('a',{style:'font-size:12px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',text:'Cancel'});
        subRow.appendChild(subBtn);subRow.appendChild(cancelBtn);
        editForm.appendChild(subRow);
        card.appendChild(editForm);
        (function(m,ri,ci,ef,sb,eb,cb){
          eb.onclick=function(){ef.style.display='block';eb.style.display='none';};
          cb.onclick=function(){ef.style.display='none';eb.style.display='';};
          sb.onclick=function(){
            var nr=parseFloat(ri.value);var nc=parseFloat(ci.value)||0;
            if(!nr){toast('Enter a rate',true);return;}
            sb.disabled=true;sb.textContent='Submitting...';
            google.script.run
              .withSuccessHandler(function(res){
                if(res&&res.success){toast('Rate change submitted');D.entry=null;setTimeout(function(){loadTab('activities');},600);}
                else{toast((res&&res.error)||'Error',true);sb.disabled=false;sb.textContent='Submit for Approval';}
              })
              .withFailureHandler(function(){toast('Error',true);sb.disabled=false;sb.textContent='Submit for Approval';})
              .requestActivityRateEdit(m.rowIndex,nr,nc,m.revisionRemark||'');
          };
        })(ma,rInp,cInp,editForm,subBtn,editBtn,cancelBtn);
        if(ACTS_REVISION_ACTIVITY&&ma.name.toLowerCase().trim()===ACTS_REVISION_ACTIVITY){
          ma.revisionRemark=ACTS_REVISION_REMARK||'';
          ACTS_REVISION_ACTIVITY=null;ACTS_REVISION_REMARK=null;
        }
        if(NO_RESUBMIT_RATE&&NO_RESUBMIT_RATE.rowIndex===ma.rowIndex){
          rInp.value=NO_RESUBMIT_RATE.currentRate||'';
          cInp.value=NO_RESUBMIT_RATE.currentComm||'';
          var nrrRmk=NO_RESUBMIT_RATE.remark||'';
          if(nrrRmk){
            var rrBanner=el('div',{style:'padding:8px 10px;background:var(--fos-accent-soft);border-left:3px solid var(--fos-warning);border-radius:0 6px 6px 0;color:var(--fos-warning);font-size:11px;margin-bottom:8px',text:'↩ '+nrrRmk});
            editForm.insertBefore(rrBanner,editForm.firstChild);
          }
          editForm.style.display='block';
          editBtn.style.display='none';
          NO_RESUBMIT_RATE=null;
        }
      }
      c.appendChild(card);
    });
  });
  var pendingActs=D.entry&&D.entry.pendingActivities?D.entry.pendingActivities:[];
  if(pendingActs.length){
    c.appendChild(el('div',{style:'font-size:10px;font-weight:500;color:var(--fos-warning);letter-spacing:1px;text-transform:uppercase;margin:14px 2px 6px',text:'● PENDING APPROVAL ('+pendingActs.length+')'}));
    pendingActs.forEach(function(pa){
      var card=el('div',{cls:'fos-card',style:'margin-bottom:10px;padding:12px 14px;opacity:0.7'});
      var top=el('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:8px'});
      var nameDiv=el('div',{style:'flex:1;min-width:0'});
      nameDiv.appendChild(el('div',{style:'font-size:14px;font-weight:500;color:var(--fos-ink)',text:pa.activityName}));
      nameDiv.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary);margin-top:2px',text:(pa.dept?pa.dept.toUpperCase()+' · ':'')+' ₹'+pa.rate+'/pr'+(pa.comm?' + ₹'+pa.comm+' comm':'')}));
      top.appendChild(nameDiv);
      top.appendChild(el('span',{cls:'badge yellow',text:'PENDING APPROVAL'}));
      card.appendChild(top);
      c.appendChild(card);
    });
  }
  updateNavBadge('activities',(D.entry&&D.entry.pendingActsCount||0)>0);
}

function renderActivitySetup(body,article){
  var DEPTS=['Cutting','Preparation','Fitter','Lasting','Finishing','Dispatch'];
  var deptData={};
  DEPTS.forEach(function(d){deptData[d]=[];});
  var approvedContainers={};   // display dept -> box to fill with approved activity list
  var actRateMap={};
  MASTER_ACTS.forEach(function(ma){actRateMap[ma.name]=ma.stdRate;});
  var DEPT_VAL={
    'Cutting':'cutting','Preparation':'prep','Fitter':'fitter',
    'Lasting':'lasting','Finishing':'finish','Dispatch':'dispatch'
  };

  var wrap=el('div',{style:'padding:14px 16px'});
  wrap.appendChild(el('div',{style:'font-size:11px;font-weight:500;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px',text:'Set Up Activities'}));

  // ── 8.P2 Import activities (from a Work Order or another Article) ──────
  // Import PRE-FILLS the editable department rows below. Arvind reviews/edits
  // rates and submits through the normal approval flow (nothing is written on
  // import). Source dept short-keys are mapped back to the display departments.
  var SHORT_TO_DEPT={cutting:'Cutting',prep:'Preparation',fitter:'Fitter',lasting:'Lasting',finish:'Finishing',dispatch:'Dispatch'};
  var deptAdders={};   // display dept name -> function(name,rate,comm) -> bool added

  var _arts=(D.entry&&D.entry.articles)?D.entry.articles:[];
  var _artOpts=_arts.filter(function(a){return a.sheet!==article.sheet;});
  var _woSeen={},_wos=[],_woArts={};
  _arts.forEach(function(a){var b=a.bom;if(!b)return;if(!_woSeen[b]){_woSeen[b]=1;_wos.push(b);_woArts[b]=[];}_woArts[b].push(a);});

  if(_wos.length||_artOpts.length){
    var impPanel=el('div',{style:'background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:8px;padding:10px;margin-bottom:14px'});
    impPanel.appendChild(el('div',{style:'font-size:12px;font-weight:600;color:var(--fos-ink);margin-bottom:4px',text:'Import activities from…'}));
    impPanel.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-bottom:8px',text:'Pre-fills the departments below. Edit rates if needed, then Submit for Approval as usual.'}));

    function _mkRow(sel,btn){
      var row=el('div',{style:'display:flex;gap:8px;margin-bottom:8px;align-items:center'});
      sel.style.cssText='flex:1;background:var(--fos-surface);border:1px solid var(--fos-border);border-radius:8px;padding:8px 10px;color:var(--fos-ink);font-size:13px';
      btn.style.cssText='background:var(--fos-surface);color:var(--fos-accent);border:1px solid var(--fos-border);font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;white-space:nowrap;cursor:pointer';
      row.appendChild(sel);row.appendChild(btn);
      return row;
    }
    function _import(source,mode,btn){
      var orig=btn.textContent;btn.disabled=true;btn.textContent='Importing…';
      google.script.run
        .withSuccessHandler(function(r){
          btn.disabled=false;btn.textContent=orig;
          if(!r||!r.success){toast((r&&r.error)||'Nothing to import',true);return;}
          var added=0,skipped=[];
          Object.keys(r.byDept).forEach(function(sd){
            var disp=SHORT_TO_DEPT[deptKeyOf(sd)]||'';var adder=disp&&deptAdders[disp];
            if(!adder){skipped.push(sd);return;}
            r.byDept[sd].forEach(function(a){if(adder(a.activityName,a.rate,a.comm))added++;});
          });
          var msg=added?('Imported '+added+' activity(ies) — review & submit'):'Nothing new to import';
          if(skipped.length)msg+=' · skipped: '+skipped.join(', ');
          toast(msg,!added);
        })
        .withFailureHandler(function(){btn.disabled=false;btn.textContent=orig;toast('Error',true);})
        .getActivitiesForCopy(source,mode);
    }
    if(_wos.length){
      var woSel=el('select');woSel.appendChild(el('option',{text:'— Work Order —',value:''}));
      _wos.forEach(function(b){
        var _l=_woArts[b]||[],_t=b;
        if(_l.length===1)_t=b+' · '+(_l[0].article||_l[0].sheet)+(_l[0].customer?' — '+_l[0].customer:'');
        else if(_l.length>1)_t=b+' · '+(_l[0].article||_l[0].sheet)+' +'+(_l.length-1)+' more';
        woSel.appendChild(el('option',{value:b,text:_t}));
      });
      var woBtn=el('button',{text:'Import'});
      woBtn.onclick=function(){if(!woSel.value){toast('Select a work order',true);return;}_import(woSel.value,'workorder',woBtn);};
      impPanel.appendChild(_mkRow(woSel,woBtn));
    }
    if(_artOpts.length){
      var arSel=el('select');arSel.appendChild(el('option',{text:'— Another Article —',value:''}));
      _artOpts.forEach(function(a){arSel.appendChild(el('option',{value:a.sheet,text:(a.article||a.sheet)+(a.bom?' ('+a.bom+')':'')+(a.customer?' — '+a.customer:'')}));});
      var arBtn=el('button',{text:'Import'});
      arBtn.onclick=function(){if(!arSel.value){toast('Select an article',true);return;}_import(arSel.value,'article',arBtn);};
      impPanel.appendChild(_mkRow(arSel,arBtn));
    }
    wrap.appendChild(impPanel);
  }
  // ── END 8.P2 import panel ─────────────────────────────────────────────

  DEPTS.forEach(function(dept){
    var section=el('div',{style:'margin-bottom:16px'});
    section.appendChild(el('div',{style:'font-size:12px;font-weight:500;color:var(--fos-ink-secondary);text-transform:uppercase;margin-bottom:6px',text:dept}));

    var deptStatus=article.deptStatus||{};
    var deptApproved=deptStatus[dept]==='APPROVED'||
                     deptStatus[dept]==='CAP_REACHED';
    if(deptApproved){
      var approvedChip=el('div',{
        style:'display:flex;align-items:center;gap:6px;padding:8px 10px;background:#d1fae5;border-radius:8px;margin-bottom:8px',
      });
      approvedChip.appendChild(el('span',{text:'✅',style:'font-size:14px'}));
      approvedChip.appendChild(el('div',{
        style:'font-size:12px;color:#065f46;font-weight:600',
        text:'Activities approved — Prakash can issue job cards'
      }));
      section.appendChild(approvedChip);
      // Show the approved activities + rates so Accounts/Admin can see them too.
      var apprList=el('div',{style:'margin:2px 0 8px;padding-left:2px'});
      apprList.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'Loading approved activities…'}));
      section.appendChild(apprList);
      approvedContainers[dept]=apprList;
      wrap.appendChild(section);
      return;
    }
    var actSel=el('select',{style:'width:100%;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:8px;padding:8px 10px;color:var(--fos-ink);font-size:13px;margin-bottom:6px'});
    actSel.appendChild(el('option',{text:'Select activity...',value:''}));
    var deptActs=MASTER_ACTS.filter(function(ma){return deptKeyOf(ma.section)===deptKeyOf(DEPT_VAL[dept]);});
    deptActs.forEach(function(ma){actSel.appendChild(el('option',{text:ma.name,value:ma.name}));});
    section.appendChild(actSel);

    var addBtn=el('button',{text:'+ Add Activity',style:'background:var(--fos-bg);color:var(--fos-accent);border:1px solid var(--fos-border);font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;white-space:nowrap;margin-bottom:6px'});
    section.appendChild(addBtn);
    var addedList=el('div');
    section.appendChild(addedList);
    (function(d,aSel,aList,entries){
      // Shared row builder — used by manual "+ Add Activity" AND import pre-fill.
      // Returns true if a row was added, false if it was a duplicate/blank.
      function addRow(name,presetRate,presetComm){
        name=(name||'').toString().trim();
        if(!name)return false;
        for(var _e=0;_e<entries.length;_e++){if((entries[_e].activityName||'').toLowerCase()===name.toLowerCase())return false;}
        var masterAct=MASTER_ACTS.filter(function(ma){return ma.name===name;})[0];
        var masterRate=masterAct?masterAct.stdRate:0;
        var masterComm=masterAct?masterAct.comm:0;
        var hasR=(presetRate!==undefined&&presetRate!==null&&presetRate!=='');
        var hasC=(presetComm!==undefined&&presetComm!==null&&presetComm!=='');
        var useRate=hasR?(Number(presetRate)||0):(masterRate||0);
        var useComm=hasC?(Number(presetComm)||0):(masterComm||0);
        var chk=el('input',{type:'checkbox',checked:true,style:'width:15px;height:15px;flex-shrink:0;accent-color:var(--fos-accent)'});
        var rowEl=el('div',{style:'padding:6px 0;border-top:0.5px solid var(--fos-border)'});
        var nameRow=el('div',{style:'display:flex;align-items:center;gap:8px;margin-bottom:6px'});
        nameRow.appendChild(chk);
        nameRow.appendChild(el('div',{style:'flex:1;font-size:12px;font-weight:600;color:var(--fos-ink)',text:name}));
        rowEl.appendChild(nameRow);
        var rateRow=el('div',{style:'display:flex;gap:8px;margin-left:23px'});
        var rateInp=el('input',{type:'number',placeholder:'Rate ₹/pair',min:'0',step:'0.01',
          value:useRate>0?String(useRate):'',
          style:'flex:1;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:6px;padding:6px 8px;color:var(--fos-ink);font-size:12px;font-family:var(--fos-font-mono)'});
        var commInp=el('input',{type:'number',placeholder:'Comm ₹/pair (optional)',min:'0',step:'0.01',
          value:useComm>0?String(useComm):'',
          style:'flex:1;background:var(--fos-bg);border:1px solid var(--fos-border);border-radius:6px;padding:6px 8px;color:var(--fos-ink);font-size:12px;font-family:var(--fos-font-mono)'});
        rateRow.appendChild(rateInp);
        rateRow.appendChild(commInp);
        rowEl.appendChild(rateRow);
        if(masterRate>0){
          var masterHint=el('div',{style:'font-size:10px;color:var(--fos-ink-secondary);margin-top:3px;margin-left:0',
            text:'Master rate: ₹'+masterRate+'/pr'+(masterComm?' + ₹'+masterComm+' comm':'')});
          rowEl.appendChild(masterHint);
        }
        var entry={chk:chk,department:d,activityName:name,rate:useRate||0,comm:useComm||0};
        rateInp.oninput=function(){entry.rate=parseFloat(rateInp.value)||0;};
        commInp.oninput=function(){entry.comm=parseFloat(commInp.value)||0;};
        entries.push(entry);
        aList.appendChild(rowEl);
        return true;
      }
      deptAdders[d]=addRow;
      addBtn.onclick=function(){
        var name=aSel.value;
        if(!name){toast('Select an activity',true);return;}
        if(!addRow(name)){toast(name+' already added',true);}
        aSel.value='';
      };
    })(dept,actSel,addedList,deptData[dept]);

    wrap.appendChild(section);
  });

  // Populate the approved-activity lists (visible to Accounts/Admin, not just Store).
  if(Object.keys(approvedContainers).length){
    google.script.run
      .withSuccessHandler(function(r){
        var byDept={};
        if(r&&r.success&&r.activities){
          r.activities.forEach(function(a){
            var disp=SHORT_TO_DEPT[deptKeyOf(a.dept)]||'';
            if(!disp)return;
            (byDept[disp]=byDept[disp]||[]).push(a);
          });
        }
        Object.keys(approvedContainers).forEach(function(dep){
          var box=approvedContainers[dep];box.innerHTML='';
          var list=byDept[dep]||[];
          if(!list.length){box.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'No activity details found'}));return;}
          list.forEach(function(a){
            box.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink);padding:3px 0;border-bottom:0.5px solid var(--fos-border)',
              text:(a.activityName||'?')+' — ₹'+(a.rate||0)+'/pr'+(a.comm?' + ₹'+a.comm+' comm':'')}));
          });
        });
      })
      .withFailureHandler(function(){
        Object.keys(approvedContainers).forEach(function(dep){var b=approvedContainers[dep];b.innerHTML='';b.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'Could not load activities'}));});
      })
      .getApprovedActivitiesForArticle(article.sheet);
  }

  var subBtn=el('button',{cls:'primary-btn',text:'Submit Selected for Approval',style:'margin-top:6px'});
  (function(art){
    subBtn.onclick = function() {
      var byDept = {};
      DEPTS.forEach(function(d) {
        var sel = deptData[d].filter(function(e) { return e.chk.checked; });
        if (sel.length) byDept[d] = sel;
      });
      if (!Object.keys(byDept).length) {
        toast('Add and select at least one activity', true);
        return;
      }
      var missingRate = false;
      Object.keys(byDept).forEach(function(dept) {
        byDept[dept].forEach(function(e) {
          if (!e.rate || e.rate <= 0) missingRate = true;
        });
      });
      if (missingRate) {
        toast('Har selected activity ka rate enter karo', true);
        return;
      }
      var items = Object.keys(byDept).map(function(dept) {
        return {
          sheet: art.sheet,
          dept: DEPT_VAL[dept],
          activities: byDept[dept].map(function(e) {
            return { activityName: e.activityName, rate: e.rate || 0, comm: e.comm || 0, department: DEPT_VAL[dept] };
          })
        };
      });
      subBtn.disabled = true;
      subBtn.textContent = 'Submitting...';
      google.script.run
        .withSuccessHandler(function(r) {
          if (r && r.success) {
            toast('Submitted ' + items.length + ' dept(s) for approval');
            D.entry = null;
            setTimeout(function() { loadTab('activities'); }, 600);
          } else {
            toast((r && r.error) || 'Error', true);
            subBtn.disabled = false;
            subBtn.textContent = 'Submit Selected for Approval';
          }
        })
        .withFailureHandler(function() {
          toast('Error', true);
          subBtn.disabled = false;
          subBtn.textContent = 'Submit Selected for Approval';
        })
        .requestActivitySetup(items, '');
    };
  })(article);

  wrap.appendChild(subBtn);
  body.appendChild(wrap);
}
</script>
