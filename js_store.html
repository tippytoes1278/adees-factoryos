<script>
// ── STORE HOME ────────────────────────────────────────────────────────────────
function renderStoreHome(c){
  c.innerHTML='';
  // ── AAJ KA KAAM (STORE) ──────────────────────────────────────
  var storeTasks=[];
  var allJCs=D.jobCards||[];

  // Daily WIP Report (printable) — today's job-card issues and receives
  (function(){
    var wipBtn=el('button',{style:'padding:6px 12px;background:none;color:var(--fos-accent);border:1px solid var(--fos-border);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:14px',text:'🖨 Daily WIP Report'});
    wipBtn.onclick=function(){
      var tStr=new Date().toISOString().slice(0,10);
      var todays=allJCs.filter(function(jc){return ((jc.issuedAt||'').slice(0,10)===tStr)||((jc.receivedAt||'').slice(0,10)===tStr);});
      if(!todays.length){toast('No job card activity today',true);return;}
      var rows=todays.map(function(jc){return '<tr><td>'+_esc(jc.jobCardId||'')+'</td><td>'+_esc(jc.orderRef||jc.workOrder||'')+'</td><td>'+_esc(jc.movement||'')+'</td><td class="rt">'+safeNum(jc.pairsIssued)+'</td><td class="rt">'+safeNum(jc.pairsReceived)+'</td><td>'+_esc(jc.status||'')+'</td></tr>';}).join('');
      printDoc('Daily WIP Report — '+tStr,
        '<table><tr><th>Job Card</th><th>Order</th><th>Stage</th><th class="rt">Issued</th><th class="rt">Received</th><th>Status</th></tr>'+rows+'</table>');
    };
    c.appendChild(wipBtn);
  })();

  // Overdue job cards
  var today=new Date();
  today.setHours(0,0,0,0);
  var overdueJCs=allJCs.filter(function(jc){
    if(!jc.expectedReturn)return false;
    try{
      var ret=new Date(jc.expectedReturn);
      ret.setHours(0,0,0,0);
      return ret<today&&jc.status==='ISSUED';
    }catch(e){return false;}
  });
  if(overdueJCs.length>0){
    storeTasks.push({
      icon:'🚨',
      text:overdueJCs.length+' job card'+(overdueJCs.length!==1?'s':'')+' OVERDUE — receive karo',
      tab:'jobcards',
      color:'var(--fos-danger)'
    });
  }

  // Cards due today
  var todayStr=today.toISOString().slice(0,10);
  var dueToday=allJCs.filter(function(jc){
    if(!jc.expectedReturn||jc.status!=='ISSUED')return false;
    try{
      return new Date(jc.expectedReturn).toISOString().slice(0,10)===todayStr;
    }catch(e){return false;}
  });
  if(dueToday.length>0){
    storeTasks.push({
      icon:'📋',
      text:dueToday.length+' job card'+(dueToday.length!==1?'s':'')+' aaj wapas aane hain',
      tab:'jobcards',
      color:'var(--fos-warning)'
    });
  }

  if(storeTasks.length>0){
    var sKaamCard=el('div',{cls:'fos-card',style:'margin-bottom:16px;padding:12px 16px'});
    sKaamCard.appendChild(el('div',{style:'font-size:11px;font-weight:600;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px',text:'Aaj Ka Kaam'}));
    storeTasks.forEach(function(t){
      var row=el('div',{style:'display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--fos-border);cursor:pointer'});
      row.onclick=function(tab){return function(){loadTab(tab);};}(t.tab);
      row.appendChild(el('div',{style:'font-size:20px;flex-shrink:0',text:t.icon}));
      var txt=el('div',{style:'flex:1'});
      txt.appendChild(el('div',{style:'font-size:13px;font-weight:600;color:'+t.color,text:t.text}));
      row.appendChild(txt);
      row.appendChild(el('div',{style:'font-size:18px;color:var(--fos-ink-secondary)',text:'›'}));
      sKaamCard.appendChild(row);
    });
    c.appendChild(sKaamCard);
  }
  // ── END AAJ KA KAAM (STORE) ──────────────────────────────────
  // Section 1: Pipeline tracker — real outstanding pairs per stage from job cards
  var _plCounts={cutting:0,prep:0,fitter:0,lasting:0,finish:0,dispatch:0};
  var _MS={'Cutting IN':'cutting','Preparation IN':'prep','Fitter IN':'fitter','Upper IN':'lasting','Lasting IN':'lasting','Packing IN':'finish','Dispatch IN':'dispatch'};
  (Array.isArray(D.jobCards)?D.jobCards:[]).forEach(function(jc){
    var st=(jc.status||'').toUpperCase();
    if(st!=='ISSUED'&&st!=='PARTIAL')return;
    var bal=(jc.pairsIssued||0)-(jc.pairsReceived||0);
    if(bal<=0)return;
    var stg=_MS[(jc.movement||'').trim()];
    if(stg)_plCounts[stg]+=bal;
  });
  var pt=fosPipelineTracker(_plCounts);
  pt.classList.add('fos-light');
  c.appendChild(pt);

  var STAGES_WIP=['Cutting','Preparation','Fitter','Lasting/Pasting','Finishing/Packing','Dispatch'];
  var todayStr=(new Date()).toISOString().slice(0,10);
  var stageTotals={};STAGES_WIP.forEach(function(s){stageTotals[s]=0;});
  var entries=D.wip&&Array.isArray(D.wip)?D.wip:[];
  var MOVEMENT_TO_STAGE={
    'Cutting IN':'Cutting',
    'Preparation IN':'Preparation',
    'Fitter IN':'Fitter',
    'Lasting IN':'Lasting/Pasting',
    'Packing IN':'Finishing/Packing',
    'Dispatch IN':'Dispatch'
  };
  entries.forEach(function(e){
    var eDate='';
    try{eDate=new Date(e.submittedAt).toISOString().slice(0,10);}catch(err){}
    if(eDate!==todayStr)return;
    var stageName=MOVEMENT_TO_STAGE[e.movement]||'';
    if(stageName&&stageTotals.hasOwnProperty(stageName))
      stageTotals[stageName]+=(e.pairs||0);
  });

  // Section 2: Aaj Ka Report
  var now=new Date();
  var _MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var _DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var todayLabel=now.getDate()+' '+_MONTHS[now.getMonth()]+', '+_DAYS[now.getDay()];
  var sumCard=el('div',{style:'background:var(--fos-surface);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)'});
  sumCard.appendChild(el('div',{style:'font-family:var(--fos-font-display);font-size:18px;font-weight:600;color:var(--fos-accent);margin-bottom:2px',text:'Aaj Ka Report'}));
  sumCard.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary);margin-bottom:14px',text:todayLabel}));
  STAGES_WIP.forEach(function(stage){
    var qty=stageTotals[stage];
    var row=el('div',{style:'display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--fos-border)'});
    row.appendChild(el('span',{style:'font-size:14px;color:var(--fos-ink)',text:stage}));
    row.appendChild(qty>0?el('span',{style:'font-size:14px;font-weight:700;color:var(--fos-ink)',text:qty+' pairs'}):el('span',{style:'font-size:14px;color:var(--fos-ink-secondary)',text:'—'}));
    sumCard.appendChild(row);
  });
  c.appendChild(sumCard);

  // Section 3: Quick Entry
  var quickBtn=el('button',{cls:'primary-btn',text:'New WIP Entry',style:'margin-bottom:16px'});
  quickBtn.onclick=function(){loadTab('wip');};
  c.appendChild(quickBtn);

  // Section 4: Recent Activity (last 5)
  c.appendChild(el('div',{style:'font-size:11px;font-weight:600;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px',text:'Recent Activity'}));
  var recent=entries.slice().reverse().slice(0,5);
  var actCard=el('div',{style:'background:var(--fos-surface);border-radius:12px;padding:0 16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)'});
  if(!recent.length){
    actCard.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary);padding:20px 0;text-align:center',text:'No entries yet'}));
  } else {
    var todayMid=new Date();todayMid.setHours(0,0,0,0);
    var _MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    recent.forEach(function(e,i){
      var arts=D.entry&&D.entry.articles?D.entry.articles:[];
      var artM=arts.find?arts.find(function(a){return a.sheet===e.orderRef;}):null;
      var dispRef=artM?artM.article:e.orderRef;
      var stLbl=(MOVEMENT_TO_STAGE[e.movement]||e.movement||'');
      var tsStr='—';
      try{if(e.submittedAt){var d=new Date(e.submittedAt);tsStr=d>=todayMid?(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')):(d.getDate()+' '+_MON[d.getMonth()]);}}catch(err){}
      var sCls=(e.status==='LINKED'||e.status==='SUBMITTED')?'badge green':e.status==='VOID'?'badge grey':'badge yellow';
      var borderStyle=i<recent.length-1?'border-bottom:1px solid var(--fos-border)':'';
      var row=el('div',{style:'display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0;'+borderStyle});
      var left=el('div',{style:'flex:1;min-width:0;margin-right:12px'});
      left.appendChild(el('div',{style:'font-size:14px;font-weight:600;color:var(--fos-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',text:dispRef}));
      left.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:stLbl}));
      row.appendChild(left);
      var right=el('div',{style:'text-align:right;flex-shrink:0'});
      right.appendChild(el('div',{style:'font-size:13px;font-weight:700;color:var(--fos-ink)',text:(e.pairs||0)+' pairs'}));
      right.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-bottom:4px',text:tsStr}));
      right.appendChild(el('span',{cls:sCls,text:e.status||'PENDING'}));
      row.appendChild(right);
      actCard.appendChild(row);
    });
  }
  c.appendChild(actCard);
}
// ── WIP ───────────────────────────────────────────────────────────────────────
function renderWIP(c){
  c.innerHTML='';

  var STORE_MOVEMENTS={
    'Upper Store':             ['Cutting IN','Preparation IN','Fitter IN'],
    'Lasting & Packing Store': ['Upper IN','Lasting IN','Packing IN'],
    'Dispatch Store':          ['Dispatch IN']
  };
  var MOVEMENT_DEPT={
    'Cutting IN':     'Cutting',
    'Preparation IN': 'Preparation',
    'Fitter IN':      'Fitter',
    'Upper IN':       'Lasting/Pasting',
    'Lasting IN':     'Lasting/Pasting',
    'Packing IN':     'Finishing/Packing',
    'Dispatch IN':    'Dispatch'
  };

  var arts=D.entry&&D.entry.articles?D.entry.articles:[];
  var enrollments=D.enrollments||[];
  var contractors=D.contractors||[];

  var DEPT_KEY_MAP={
    'Cutting IN':'cutting','Preparation IN':'prep','Fitter IN':'fitter',
    'Upper IN':'lasting','Lasting IN':'lasting','Packing IN':'finish','Dispatch IN':'dispatch'
  };
  // Movement → getDeptStatus() key, so skipped departments can be flagged.
  var MOVEMENT_STATUS_KEY={
    'Cutting IN':'Cutting','Preparation IN':'Preparation','Fitter IN':'Fitter',
    'Upper IN':'Lasting','Lasting IN':'Lasting','Packing IN':'Finishing','Dispatch IN':'Dispatch'
  };

  var selectedOrderRef='';
  var selectedWorkOrder='';
  var selectedOrderQty=0;
  var selectedStore='';
  var selectedMovement='';
  var deptStatusForOrder=null;   // getDeptStatus() result for the selected order
  var activityRows=[];       // [{activityName, rate, contractorSel, pairsInput}]
  var activityCache={};      // orderRef -> getApprovedActivitiesForArticle result
  var maxIssuableCache={};   // orderRef||movement -> number

  // ── Section 1: Issue Job Card Form ────────────────────────────────────────
  var formCard=el('div',{cls:'art-item',style:'padding:16px;margin-bottom:16px'});

  // 1. Order
  var orderGrp=el('div',{cls:'form-group'});
  orderGrp.appendChild(el('label',{cls:'form-label',text:'Order'}));
  var orderSel=el('select',{cls:'form-select'});
  orderSel.appendChild(el('option',{value:'',text:'— Select Order —'}));
  arts.forEach(function(a){
    var label=(a.article||a.bom||a.sheet)+(a.customer?' — '+a.customer:'')+(a.bom?' · '+a.bom:'')+(a.sheet?' ['+a.sheet+']':'');
    orderSel.appendChild(el('option',{value:a.sheet,text:label}));
  });
  orderGrp.appendChild(orderSel);
  formCard.appendChild(orderGrp);

  // 2. Store
  var storeGrp=el('div',{cls:'form-group'});
  storeGrp.appendChild(el('label',{cls:'form-label',text:'Store'}));
  var storeSel=el('select',{cls:'form-select'});
  storeSel.appendChild(el('option',{value:'',text:'— Select Store —'}));
  ['Upper Store','Lasting & Packing Store','Dispatch Store'].forEach(function(s){
    storeSel.appendChild(el('option',{value:s,text:s}));
  });
  storeGrp.appendChild(storeSel);
  formCard.appendChild(storeGrp);

  // 3. Movement
  var movGrp=el('div',{cls:'form-group'});
  movGrp.appendChild(el('label',{cls:'form-label',text:'Movement'}));
  var movSel=el('select',{cls:'form-select'});
  movSel.disabled=true;
  movSel.appendChild(el('option',{value:'',text:'— Select Movement —'}));
  movGrp.appendChild(movSel);
  formCard.appendChild(movGrp);

  // Order lot-size hint
  var balanceEl=el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin:-4px 0 10px',text:'Order lot size: — pairs'});
  formCard.appendChild(balanceEl);

  // 4. Pairs to Issue — one value for the whole department; applies to every activity below
  var pairsGrp=el('div',{cls:'form-group'});
  pairsGrp.appendChild(el('label',{cls:'form-label',text:'Pairs to Issue'}));
  var pairsInput=el('input',{cls:'form-input',type:'number'});
  pairsInput.min='1';pairsInput.step='1';pairsInput.placeholder='0';
  var stageMaxEl=el('div',{style:'font-size:12px;font-weight:600;margin-top:4px',text:''});
  pairsGrp.appendChild(pairsInput);
  pairsGrp.appendChild(stageMaxEl);
  formCard.appendChild(pairsGrp);

  // 5. Activities & Contractors (one row per approved activity — contractor only)
  var actGrp=el('div',{cls:'form-group'});
  actGrp.appendChild(el('label',{cls:'form-label',text:'Activities & Contractors'}));
  var actMsg=el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'Select order, store and movement to load activities'});
  var actContainer=el('div');
  actGrp.appendChild(actMsg);
  actGrp.appendChild(actContainer);
  formCard.appendChild(actGrp);

  // 6. Size Breakdown
  var sizeGrp=el('div',{cls:'form-group'});
  sizeGrp.appendChild(el('label',{cls:'form-label',text:'Size Breakdown'}));
  var sizeRunEl=el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-bottom:6px',text:''});
  sizeGrp.appendChild(sizeRunEl);
  var sizeContainer=el('div');
  sizeContainer.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'Select an order to load size breakdown'}));
  sizeGrp.appendChild(sizeContainer);
  var sizeTotalEl=el('div',{style:'font-size:12px;font-weight:600;margin-top:6px',text:''});
  sizeGrp.appendChild(sizeTotalEl);
  formCard.appendChild(sizeGrp);

  // 7. Expected Return Date
  var dateGrp=el('div',{cls:'form-group'});
  dateGrp.appendChild(el('label',{cls:'form-label',text:'Expected Return Date'}));
  var dateInput=el('input',{cls:'form-input',type:'date'});
  var d7=new Date();d7.setDate(d7.getDate()+7);
  dateInput.value=d7.toISOString().slice(0,10);
  dateGrp.appendChild(dateInput);
  formCard.appendChild(dateGrp);

  // 8. Notes
  var notesGrp=el('div',{cls:'form-group'});
  notesGrp.appendChild(el('label',{cls:'form-label',text:'Notes (optional)'}));
  var notesInput=el('textarea',{cls:'form-input'});
  notesInput.rows=2;
  notesGrp.appendChild(notesInput);
  formCard.appendChild(notesGrp);

  // 9. Issue All button
  var issueBtn=el('button',{cls:'primary-btn',text:'Issue All'});
  issueBtn.disabled=true;
  formCard.appendChild(issueBtn);
  c.appendChild(formCard);

  // ── Section 2: Recently Issued Today ─────────────────────────────────────
  var recentWrap=el('div',{style:'margin-bottom:16px'});
  recentWrap.appendChild(el('div',{
    style:'font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--fos-ink-secondary);text-transform:uppercase;padding:12px 0 6px 0;border-bottom:1px solid var(--fos-border);margin-bottom:8px',
    text:'RECENTLY ISSUED TODAY'
  }));
  var recentList=el('div');
  recentWrap.appendChild(recentList);
  c.appendChild(recentWrap);

  function todayDateStr(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}

  function renderRecentlyIssued(){
    recentList.innerHTML='';
    var jcs=Array.isArray(D.jobCards)?D.jobCards:[];
    var today=todayDateStr();
    var todayCards=jcs.filter(function(jc){return (jc.issuedAt||'').slice(0,10)===today;}).slice(0,5);
    if(!todayCards.length){
      recentList.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary);padding:12px 0;text-align:center',text:'No job cards issued yet today'}));
      return;
    }
    var artByRef={};arts.forEach(function(a){artByRef[a.sheet]=a;});
    var ctrById={};contractors.forEach(function(ct){ctrById[ct.ctrId]=ct;});
    todayCards.forEach(function(jc){
      var art=artByRef[jc.orderRef];
      var artName=art?(art.article||jc.orderRef):jc.orderRef;
      var ctr=ctrById[jc.contractorId];
      var ctrName=ctr?ctr.name:jc.contractorId;
      var card=el('div',{style:'background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:10px;padding:12px;margin-bottom:8px'});
      var row1=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:4px'});
      row1.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary)',text:jc.jobCardId}));
      row1.appendChild(el('span',{cls:'badge yellow',text:'ISSUED'}));
      card.appendChild(row1);
      card.appendChild(el('div',{style:'font-size:14px;font-weight:600;color:var(--fos-ink);margin-bottom:2px',text:artName}));
      card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:jc.store+' · '+jc.movement}));
      card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:ctrName+' — '+jc.pairsIssued+' pairs'}));
      recentList.appendChild(card);
    });
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function populateMovements(keepSel){
    var prev=keepSel?selectedMovement:'';
    movSel.innerHTML='';
    movSel.appendChild(el('option',{value:'',text:'— Select Movement —'}));
    var validPrev=false;
    (STORE_MOVEMENTS[selectedStore]||[]).forEach(function(mv){
      var sk=deptStatusForOrder && deptStatusForOrder[MOVEMENT_STATUS_KEY[mv]]==='SKIPPED';
      var opt=el('option',{value:mv,text:mv+(sk?' — skipped for this order':'')});
      if(sk)opt.disabled=true;
      movSel.appendChild(opt);
      if(mv===prev && !sk) validPrev=true;
    });
    movSel.disabled=!selectedStore;
    if(keepSel && validPrev){ movSel.value=prev; selectedMovement=prev; }
    else { selectedMovement=''; clearActivityRows(); }
  }

  function clearActivityRows(){
    activityRows=[];
    actContainer.innerHTML='';
    actMsg.style.display='block';
    actMsg.innerHTML='Select order, store and movement to load activities';
    pairsInput.value='';
    stageMaxEl.textContent='';
    issueBtn.disabled=true;
  }

  // Enrolled + active contractors for the current movement's department.
  function enrolledContractorsForMovement(){
    var dept=MOVEMENT_DEPT[selectedMovement]||'';
    var enrolled=enrollments.filter(function(e){return e.department===dept&&(e.status||'').toUpperCase()==='ACTIVE';});
    var enrolledIds={};enrolled.forEach(function(e){enrolledIds[e.contractorId]=e.contractorName||e.contractorId;});
    var found=contractors.filter(function(ct){return !!enrolledIds[ct.ctrId];});
    if(found.length)return found.map(function(ct){return {id:ct.ctrId,name:ct.name};});
    return enrolled.map(function(e){return {id:e.contractorId,name:e.contractorName||e.contractorId};});
  }

  // Fetch max-issuable for the stage (cached per order+movement), then build rows.
  function loadStageThenRows(){
    if(!selectedOrderRef||!selectedMovement){clearActivityRows();return;}
    var maxKey=selectedOrderRef+'||'+selectedMovement;
    if(maxIssuableCache.hasOwnProperty(maxKey)){buildActivityRows();return;}
    actMsg.style.display='block';actMsg.innerHTML='Loading activities…';actContainer.innerHTML='';
    google.script.run
      .withSuccessHandler(function(res){maxIssuableCache[maxKey]=(res&&res.success)?safeNum(res.maxIssuable):0;buildActivityRows();})
      .withFailureHandler(function(){maxIssuableCache[maxKey]=0;buildActivityRows();})
      .getMaxIssuableForStage(selectedOrderRef,selectedMovement);
  }

  // One row per approved activity for this order+department; each row has its own
  // contractor dropdown and editable pairs (defaulting to the stage max-issuable).
  function buildActivityRows(){
    if(!selectedOrderRef||!selectedMovement){clearActivityRows();return;}
    var deptKey=DEPT_KEY_MAP[selectedMovement]||'';
    var ctrOpts=enrolledContractorsForMovement();
    var maxKey=selectedOrderRef+'||'+selectedMovement;
    var maxDefault=maxIssuableCache.hasOwnProperty(maxKey)?maxIssuableCache[maxKey]:null;

    var doRender=function(actRes){
      activityRows=[];
      actContainer.innerHTML='';
      stageMaxEl.textContent='';
      var acts=[];
      if(actRes&&actRes.success&&Array.isArray(actRes.activities)){
        acts=actRes.activities.filter(function(a){return (a.dept||'').toLowerCase().indexOf(deptKey)===0;});
      }
      if(!acts.length){
        actMsg.style.display='block';
        actMsg.innerHTML='<span style="color:var(--fos-danger)">⚠ No approved activities for '+(MOVEMENT_DEPT[selectedMovement]||selectedMovement)+' on this order — this stage may be skipped, or not set up yet. Check with Arvind before issuing.</span>';
        pairsInput.value='';issueBtn.disabled=true;return;
      }
      if(!ctrOpts.length){
        actMsg.style.display='block';
        actMsg.innerHTML='<span style="color:var(--fos-danger)">No contractors enrolled for '+(MOVEMENT_DEPT[selectedMovement]||selectedMovement)+'. Enroll via Accounts &gt; Contractors.</span>';
        pairsInput.value='';issueBtn.disabled=true;return;
      }
      actMsg.style.display='none';
      if(typeof maxDefault==='number'){
        stageMaxEl.textContent='Max issuable for this stage: '+maxDefault+' pairs';
        stageMaxEl.style.color=maxDefault>0?'var(--fos-accent)':'var(--fos-danger)';
        if(!pairsInput.readOnly)pairsInput.value=maxDefault>0?String(maxDefault):'';
      }
      acts.forEach(function(a){
        var row=el('div',{style:'border:0.5px solid var(--fos-border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--fos-surface)'});

        var _rc=safeNum(a.comm)>0?('₹'+safeNum(a.rate).toFixed(2)+' + ₹'+safeNum(a.comm).toFixed(2)+' comm'):('₹'+safeNum(a.rate).toFixed(2)+'/pair');
        hdr.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:_rc}));
        row.appendChild(hdr);
        var cSel=el('select',{cls:'form-select',style:'width:100%;font-size:13px;padding:8px 10px'});
        cSel.appendChild(el('option',{value:'',text:'— Contractor —'}));

        row.appendChild(cSel);

      });

    };

    else{
      actMsg.style.display='block';actMsg.innerHTML='Loading activities…';actContainer.innerHTML='';
      google.script.run
        .withSuccessHandler(function(res){activityCache[selectedOrderRef]=res;if(selectedMovement)doRender(res);})
        .withFailureHandler(function(){actMsg.style.display='block';actMsg.innerHTML='<span style="color:var(--fos-danger)">Could not load activities</span>';})
        .getApprovedActivitiesForArticle(selectedOrderRef);

  }

  // Sizes depend on order AND movement (remaining is per stage), so both must be set.
  function loadSizeBreakdown(){
    sizeContainer.innerHTML='';
    if(!selectedOrderRef){sizeContainer.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'Select an order to load sizes'}));recalcSizeTotal();return;}
    if(!selectedMovement){sizeContainer.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'Select a movement to load sizes'}));recalcSizeTotal();return;}
    var key=selectedOrderRef+'|'+selectedMovement;
    if(D.orderSizes&&D.orderSizes[key]){renderSizeInputs(D.orderSizes[key]);return;}
    sizeContainer.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'Loading sizes...'}));
    var reqO=selectedOrderRef,reqM=selectedMovement;
    google.script.run
      .withSuccessHandler(function(result){
        if(!D.orderSizes)D.orderSizes={};
        D.orderSizes[reqO+'|'+reqM]=result;
        if(selectedOrderRef===reqO&&selectedMovement===reqM)renderSizeInputs(result);
      })
      .withFailureHandler(function(){
        if(selectedOrderRef===reqO&&selectedMovement===reqM){sizeContainer.innerHTML='';sizeContainer.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'Could not load sizes'}));}
      })
      .getOrderSizeBalance(reqO,reqM);
  }

  function renderSizeInputs(result){
    sizeContainer.innerHTML='';
    if(sizeRunEl)sizeRunEl.textContent='';
    if(!result||result.error||!result.sizes||!Object.keys(result.sizes).length){
      sizeContainer.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'No size breakdown for this order'}));
      recalcSizeTotal();
      return;
    }
    var sizes=result.sizes, isAdmin=!!result.isAdmin;
    var keys=Object.keys(sizes).sort(function(a,b){return parseFloat(a)-parseFloat(b);});
    // Overall order size run (the plan), so the grid below reads clearly.
    var _runTot=0;keys.forEach(function(k){_runTot+=safeNum(sizes[k]&&sizes[k].ordered);});
    if(sizeRunEl)sizeRunEl.textContent='Order size run: '+_runTot+' pairs  ('+keys.map(function(k){return k+' '+safeNum(sizes[k]&&sizes[k].ordered);}).join(', ')+'). Boxes below show how many of each size are still un-issued at this stage.';
    var scroll=el('div',{style:'overflow-x:auto;-webkit-overflow-scrolling:touch'});
    var row=el('div',{style:'display:inline-flex;gap:6px;min-width:min-content'});
    keys.forEach(function(k){
      var rem=safeNum(sizes[k]&&sizes[k].remaining);
      var col=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:3px'});
      col.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);font-weight:600',text:k}));
      var inp=el('input');
      inp.type='number';inp.min='0';inp.step='1';inp.value='0';
      inp.dataset.size=k;inp.dataset.remaining=String(rem);
      inp.style.cssText='width:50px;padding:5px 4px;border:1px solid var(--fos-border);border-radius:8px;font-size:13px;text-align:center;background:var(--fos-surface);color:var(--fos-ink)';
      var balEl=el('div',{style:'font-size:10px;color:'+(rem>0?'var(--fos-ink-secondary)':'var(--fos-success)'),text:rem>0?(rem+' left'):'done'});
      inp.oninput=function(){
        var v=parseInt(inp.value,10);if(isNaN(v)||v<0)v=0;
        if(!isAdmin&&v>rem){v=rem;inp.value=String(rem);toast('Only '+rem+' of '+k+' left — ask Ayush to override',true);}
        if(v>rem){inp.style.borderColor='var(--fos-warning)';balEl.textContent='over by '+(v-rem);balEl.style.color='var(--fos-warning)';}
        else{inp.style.borderColor='var(--fos-border)';balEl.textContent=rem>0?(rem+' left'):'done';balEl.style.color=rem>0?'var(--fos-ink-secondary)':'var(--fos-success)';}
        recalcSizeTotal();
      };
      col.appendChild(inp);col.appendChild(balEl);
      row.appendChild(col);
    });
    scroll.appendChild(row);
    sizeContainer.appendChild(scroll);
    recalcSizeTotal();
  }

  // Pairs to Issue = sum of the size boxes (locked when a size grid is present).
  function recalcSizeTotal(){
    var inputs=sizeContainer.querySelectorAll('input[data-size]');
    if(!inputs.length){pairsInput.readOnly=false;if(sizeTotalEl)sizeTotalEl.textContent='';return;}
    var sum=0;inputs.forEach(function(inp){var v=parseInt(inp.value,10);if(v>0)sum+=v;});
    pairsInput.value=sum>0?String(sum):'';
    pairsInput.readOnly=true;
    if(sizeTotalEl){
      var cap=maxIssuableCache[selectedOrderRef+'||'+selectedMovement];
      var hasCap=(typeof cap==='number');
      var over=(hasCap&&sum>cap);
      sizeTotalEl.textContent='Selected: '+sum+' pair'+(sum===1?'':'s')+(hasCap?(' — this stage can take '+cap):'');
      sizeTotalEl.style.color=over?'var(--fos-danger)':(sum>0?'var(--fos-accent)':'var(--fos-ink-secondary)');
    }
  }

  function getSizeBreakdown(){
    var result={};
    sizeContainer.querySelectorAll('input[data-size]').forEach(function(inp){
      var v=parseInt(inp.value,10);
      if(v>0)result[inp.dataset.size]=v;
    });
    return result;
  }

  // ── Event handlers ────────────────────────────────────────────────────────
  orderSel.onchange=function(){
    selectedOrderRef=orderSel.value;
    var art=arts.filter(function(a){return a.sheet===selectedOrderRef;})[0];
    selectedWorkOrder=art?(art.bom||''):'';
    selectedOrderQty=art?(parseInt(art.orderQty,10)||0):0;
    balanceEl.textContent=selectedOrderQty>0?'Order lot size: '+selectedOrderQty+' pairs':'Order lot size: — pairs';
    activityCache={};       // approved activities are per-order; reset on order change
    maxIssuableCache={};
    // Fetch skip status for this order, then refresh the movement list so skipped
    // departments show as "skipped for this order" and can't be selected.
    deptStatusForOrder=null;
    if(selectedOrderRef){
      google.script.run
        .withSuccessHandler(function(ds){deptStatusForOrder=(ds&&typeof ds==='object')?ds:null;populateMovements(true);})
        .withFailureHandler(function(){deptStatusForOrder=null;populateMovements(true);})
        .getDeptStatus(selectedOrderRef);
    } else { populateMovements(true); }
    loadSizeBreakdown();
    loadStageThenRows();
  };

  storeSel.onchange=function(){selectedStore=storeSel.value;populateMovements();loadSizeBreakdown();};
  movSel.onchange=function(){selectedMovement=movSel.value;loadStageThenRows();loadSizeBreakdown();};

  issueBtn.onclick=function(){
    if(!selectedOrderRef){toast('Select an order',true);return;}
    if(!selectedStore){toast('Select a store',true);return;}
    if(!selectedMovement){toast('Select a movement',true);return;}
    var pv=parseInt(pairsInput.value,10);
    if(!pv||pv<=0){toast('Enter pairs to issue',true);return;}
    var _stageCap=maxIssuableCache[selectedOrderRef+'||'+selectedMovement];
    if(typeof _stageCap==='number'&&pv>_stageCap){toast('This stage can take only '+_stageCap+' pairs right now (limited by the previous stage) — you selected '+pv,true);return;}
    if(!dateInput.value){toast('Enter expected return date',true);return;}
    var assignments=[];
    for(var i=0;i<activityRows.length;i++){
      var r=activityRows[i];
      var cid=r.contractorSel.value;
      if(!cid)continue;   // activities with no contractor are skipped
      assignments.push({activityName:r.activityName,contractorId:cid});
    }
    if(!assignments.length){toast('Assign a contractor to at least one activity',true);return;}
    // Size-run override gate (7.1): if any size exceeds its remaining, require the
    // admin override password. Non-admins are blocked outright.
    var _overSize=false;
    sizeContainer.querySelectorAll('input[data-size]').forEach(function(inp){
      if(parseInt(inp.value,10)>parseInt(inp.dataset.remaining||'0',10))_overSize=true;
    });
    var _overridePw='';
    if(_overSize){
      if(!USER||USER.role!=='admin'){toast('Some sizes exceed the approved run — only Ayush can override',true);return;}
      _overridePw=window.prompt('This exceeds the approved size run.\nEnter the admin override password to proceed:')||'';
      if(!_overridePw){toast('Override cancelled',true);return;}
    }
    // Size breakdown, when filled, must total the pairs to issue (matches the
    // server integrity guard — prevents breakdown≠pairs cards).
    var _sbChk=getSizeBreakdown(),_sbT=0;Object.keys(_sbChk).forEach(function(k){_sbT+=_sbChk[k];});
    if(_sbT>0&&_sbT!==pv){toast('Size breakdown totals '+_sbT+' but pairs to issue is '+pv+' — make them match',true);return;}
    var payload={
      orderRef:selectedOrderRef,
      workOrder:selectedWorkOrder,
      store:selectedStore,
      movement:selectedMovement,
      pairs:pv,
      assignments:assignments,
      sizeBreakdown:getSizeBreakdown(),
      expectedReturn:dateInput.value,
      notes:notesInput.value.trim(),
      overridePassword:_overridePw
    };
    issueBtn.disabled=true;issueBtn.textContent='Issuing...';
    google.script.run
      .withSuccessHandler(function(r){
        issueBtn.disabled=false;issueBtn.textContent='Issue All';
        if(r&&r.success){
          toast('Issued '+(r.jobCardId||'job card')+' — '+assignments.length+' activit'+(assignments.length===1?'y':'ies'));
          if(r.warning)toast(r.warning,true);
        } else {
          toast((r&&r.error)||'Error issuing job card',true);
          return;   // failed — keep form so the user can fix and retry
        }
        maxIssuableCache={};
        storeSel.value='';selectedStore='';populateMovements();
        notesInput.value='';
        var d7n=new Date();d7n.setDate(d7n.getDate()+7);dateInput.value=d7n.toISOString().slice(0,10);
        google.script.run
          .withSuccessHandler(function(jcs){D.jobCards=Array.isArray(jcs)?jcs:[];renderRecentlyIssued();})
          .withFailureHandler(function(){})
          .getJobCards({});
      })
      .withFailureHandler(function(){
        issueBtn.disabled=false;issueBtn.textContent='Issue All';
        toast('Error issuing job card',true);
      })
      .issueDepartmentJobCard(payload);
  };

  renderRecentlyIssued();
}

// ── JOB CARDS — Phase 5.4c ───────────────────────────────────────────────────
function renderJobCards(c){
  c.innerHTML='';

  var arts=D.entry&&D.entry.articles?D.entry.articles:[];
  var contractors=D.contractors||[];

  var artByRef={};arts.forEach(function(a){artByRef[a.sheet]=a;});
  var ctrById={};contractors.forEach(function(ct){ctrById[ct.ctrId]=ct;});

  var filterStore='';
  var filterStatus='open';

  c.appendChild(listWrap);

  function fmtDate(iso){

    try{var d=new Date(iso);var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.getDate()+' '+months[d.getMonth()];}
    catch(e){return iso.slice(0,10)||'—';}
  }

  function renderList(){
    listWrap.innerHTML='';
    var all=Array.isArray(D.jobCards)?D.jobCards:[];
    var filtered=all.filter(function(jc){
      if(filterStore&&jc.store!==filterStore)return false;
      var st=(jc.status||'').toUpperCase();
      if(filterStatus==='open')return st==='ISSUED'||st==='PARTIAL';
      if(filterStatus==='complete')return st==='COMPLETE';
      return true;
    });
    if(!filtered.length){
      listWrap.appendChild(el('div',{style:'text-align:center;padding:40px;font-size:14px;color:var(--fos-ink-secondary)',text:'No job cards found'}));
      return;
    }
    function buildCard(jc){
      var st=(jc.status||'ISSUED').toUpperCase();
      var art=artByRef[jc.orderRef];
      var artName=art?(art.article||jc.orderRef):jc.orderRef;
      var ctr=ctrById[jc.contractorId];
      var ctrName=ctr?ctr.name:jc.contractorId;
      var issued=jc.pairsIssued||0;
      var received=jc.pairsReceived||0;
      var balance=issued-received;
      var pct=issued>0?Math.round((received/issued)*100):0;

      var card=el('div',{style:'background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:12px;padding:14px;margin-bottom:10px'});

      // Top row: ID + badge
      var topRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:6px'});
      topRow.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:12px;color:var(--fos-ink-secondary)',text:jc.jobCardId}));
      var _rightGrp=el('div',{style:'display:flex;align-items:center;gap:8px'});
      var badgeCls=st==='COMPLETE'?'badge green':st==='PARTIAL'?'badge blue':'badge yellow';
      (function(theJc,theArt,theCtr){
        var slipBtn=el('button',{style:'padding:3px 9px;background:none;color:var(--fos-accent);border:1px solid var(--fos-border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer',text:'🖨 Slip'});
        slipBtn.onclick=function(){

          var ctrLine=asg2.length?asg2.map(function(a){var an=ctrById[a.contractorId];return _esc((an?an.name:a.contractorId)+' — '+(a.activity||a.activityName||''));}).join('<br>'):_esc(theCtr);
          var sb=theJc.sizeBreakdown||{};
          var sizeRows=Object.keys(sb).sort(function(a,b){return parseFloat(a)-parseFloat(b);}).map(function(k){return '<td class="rt">'+_esc(k)+'<br>'+safeNum(sb[k])+'</td>';}).join('');
          var body='<table><tr><td><b>Job Card</b></td><td>'+_esc(theJc.jobCardId)+'</td><td><b>Date</b></td><td>'+_esc((theJc.issuedAt||'').slice(0,10))+'</td></tr>'+

            '<tr><td><b>Store · Stage</b></td><td>'+_esc(theJc.store+' · '+theJc.movement)+'</td><td><b>Pairs</b></td><td>'+safeNum(theJc.pairsIssued)+'</td></tr></table>'+

            (sizeRows?'<div style="font-size:13px;margin:10px 0 4px"><b>Size breakdown</b></div><table><tr>'+sizeRows+'</tr></table>':'')+

      // Article name

      // Size breakdown (Point 3: size transparency)

          sizeKeys.forEach(function(k){
            var remR=remPerSize[k];

// ── FLOOR VIEW — Phase 5.5 ────────────────────────────────────────────────────
function renderFloor(c){
  c.innerHTML='';

  var arts=D.entry&&D.entry.articles?D.entry.articles:[];
  var contractors=D.contractors||[];
  var artByRef={};arts.forEach(function(a){artByRef[a.sheet]=a;});
  var ctrById={};contractors.forEach(function(ct){ctrById[ct.ctrId]=ct;});

  var filterStore='';
  var sortMode='oldest';

  // Header
  var hdr=el('div',{style:'margin-bottom:16px'});
  hdr.appendChild(el('div',{style:'font-size:20px;font-weight:700;color:var(--fos-accent)',text:'Floor View'}));
  hdr.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary)',text:'Outstanding work by contractor'}));
  c.appendChild(hdr);

  // Filters
  var filterRow=el('div',{style:'display:flex;gap:8px;margin-bottom:16px'});
  var storeFilt=el('select',{cls:'form-select',style:'flex:1;padding:8px 10px;font-size:13px'});
  [{v:'',t:'All Stores'},{v:'Upper Store',t:'Upper Store'},{v:'Lasting & Packing Store',t:'L&P Store'},{v:'Dispatch Store',t:'Dispatch'}].forEach(function(o){
    storeFilt.appendChild(el('option',{value:o.v,text:o.t}));
  });
  var sortFilt=el('select',{cls:'form-select',style:'flex:1;padding:8px 10px;font-size:13px'});
  [{v:'oldest',t:'Longest Outstanding'},{v:'pairs',t:'Most Pairs'},{v:'name',t:'Contractor Name'}].forEach(function(o){
    sortFilt.appendChild(el('option',{value:o.v,text:o.t}));
  });
  filterRow.appendChild(storeFilt);filterRow.appendChild(sortFilt);
  c.appendChild(filterRow);

  var listWrap=el('div');
  c.appendChild(listWrap);

  function daysSince(iso){
    if(!iso)return 0;
    try{
      var d=new Date(iso);d.setHours(0,0,0,0);
      var now=new Date();now.setHours(0,0,0,0);
      return Math.max(0,Math.floor((now.getTime()-d.getTime())/(86400000)));
    }catch(e){return 0;}
  }

  function fmtDate(iso){
    if(!iso)return '—';
    try{var d=new Date(iso);var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.getDate()+' '+mo[d.getMonth()];}
    catch(e){return iso.slice(0,10)||'—';}
  }

  function isPast(iso){
    if(!iso)return false;
    try{var d=new Date(iso);d.setHours(23,59,59,0);return d.getTime()<Date.now();}
    catch(e){return false;}
  }

  function renderList(){
    listWrap.innerHTML='';
    var all=Array.isArray(D.jobCards)?D.jobCards:[];
    var open=all.filter(function(jc){
      var st=(jc.status||'').toUpperCase();
      if(st!=='ISSUED'&&st!=='PARTIAL')return false;
      if(filterStore&&jc.store!==filterStore)return false;
      return true;
    });

    if(!open.length){
      var emptyWrap=el('div',{style:'text-align:center;padding:48px 16px'});
      emptyWrap.appendChild(el('div',{style:'font-size:32px;color:var(--fos-success)',text:'✓'}));
      emptyWrap.appendChild(el('div',{style:'font-size:14px;color:var(--fos-ink-secondary);margin-top:8px',text:'No outstanding work — all job cards complete'}));
      listWrap.appendChild(emptyWrap);
      return;
    }

    // Group by contractorId
    var groupMap={};
    open.forEach(function(jc){
      var cId=jc.contractorId||'UNKNOWN';
      if(!groupMap[cId])groupMap[cId]={ctrId:cId,cards:[]};
      groupMap[cId].cards.push(jc);
    });

    var groups=Object.keys(groupMap).map(function(cId){
      var g=groupMap[cId];
      var ctr=ctrById[cId];
      g.contractorName=ctr?ctr.name:cId;
      g.totalOutstanding=0;
      var oldestMs=Infinity;
      g.cards.forEach(function(jc){
        g.totalOutstanding+=(jc.pairsIssued||0)-(jc.pairsReceived||0);
        if(jc.issuedAt){var t=new Date(jc.issuedAt).getTime();if(t<oldestMs)oldestMs=t;}
      });
      g.oldestIssuedIso=oldestMs===Infinity?'':new Date(oldestMs).toISOString();
      g.daysOutstanding=daysSince(g.oldestIssuedIso);
      g.jobCardCount=g.cards.length;
      return g;
    });

    if(sortMode==='oldest'){groups.sort(function(a,b){return b.daysOutstanding-a.daysOutstanding;});}
    else if(sortMode==='pairs'){groups.sort(function(a,b){return b.totalOutstanding-a.totalOutstanding;});}
    else{groups.sort(function(a,b){return a.contractorName.localeCompare(b.contractorName);});}

    groups.forEach(function(g){
      var card=el('div',{style:'background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:12px;padding:14px;margin-bottom:10px'});

      // Top row: name + days badge
      var topRow=el('div',{style:'display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px'});
      var nameCol=el('div',{style:'flex:1;min-width:0;margin-right:8px'});
      nameCol.appendChild(el('div',{style:'font-size:16px;font-weight:700;color:var(--fos-ink)',text:g.contractorName}));
      if(g.ctrId&&g.ctrId!==g.contractorName){
        nameCol.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary)',text:g.ctrId}));
      }
      topRow.appendChild(nameCol);
      var days=g.daysOutstanding;
      var badgeCls=days>=8?'badge red':days>=4?'badge yellow':'badge grey';
      var badgeText=days>=8?(days+'d — DELAYED'):(days+'d');
      topRow.appendChild(el('span',{cls:badgeCls,text:badgeText}));
      card.appendChild(topRow);

      // Summary
      var plural=g.jobCardCount===1?' job card':' job cards';
      card.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink-secondary);margin-bottom:10px',
        text:g.totalOutstanding+' pairs outstanding across '+g.jobCardCount+plural}));

      // Expand toggle
      var expanded=false;
      var toggleLabel=g.jobCardCount+plural+' — tap to expand';
      var toggleBtn=el('div',{style:'font-size:12px;color:var(--fos-accent);cursor:pointer;user-select:none',text:toggleLabel});
      var detailWrap=el('div',{style:'display:none;margin-top:8px;border-top:0.5px solid var(--fos-border);padding-top:8px'});

      g.cards.forEach(function(jc){
        var art=artByRef[jc.orderRef];
        var artName=art?(art.article||jc.orderRef):jc.orderRef;
        var bal=(jc.pairsIssued||0)-(jc.pairsReceived||0);
        var overdue=isPast(jc.expectedReturn);

        var jcRow=el('div',{style:'padding:8px 0;border-bottom:0.5px solid var(--fos-border)'});

        var jcTop=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:2px'});
        jcTop.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary)',text:jc.jobCardId}));
        jcTop.appendChild(el('span',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:jc.store+' · '+jc.movement}));
        jcRow.appendChild(jcTop);

        jcRow.appendChild(el('div',{style:'font-size:13px;font-weight:600;color:var(--fos-ink);margin-bottom:2px',text:artName}));
        jcRow.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-bottom:2px',
          text:'Issued '+(jc.pairsIssued||0)+' · Received '+(jc.pairsReceived||0)+' · Balance '+bal}));

        var datesRow=el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
        datesRow.appendChild(el('span',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'Issued: '+fmtDate(jc.issuedAt)}));
        datesRow.appendChild(el('span',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'Expected: '+fmtDate(jc.expectedReturn)}));
        if(overdue){
          datesRow.appendChild(el('span',{style:'font-size:10px;font-weight:700;color:var(--fos-danger);font-family:var(--fos-font-mono)',text:'OVERDUE'}));
        }
        jcRow.appendChild(datesRow);
        detailWrap.appendChild(jcRow);
      });

      toggleBtn.onclick=function(){
        expanded=!expanded;
        detailWrap.style.display=expanded?'block':'none';
        toggleBtn.textContent=g.jobCardCount+plural+(expanded?' — tap to collapse':' — tap to expand');
      };
      card.appendChild(toggleBtn);
      card.appendChild(detailWrap);
      listWrap.appendChild(card);
    });
  }

  storeFilt.onchange=function(){filterStore=storeFilt.value;renderList();};
  sortFilt.onchange=function(){sortMode=sortFilt.value;renderList();};
  renderList();
}

      var td=document.createElement('td');
      td.textContent=text||'—';
      td.style.cssText='position:sticky;left:'+leftPx+'px;z-index:2;'+stickyBg+';padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--fos-border);font-size:12px;color:var(--fos-ink);min-width:'+minW+'px;max-width:'+minW+'px;overflow:hidden;text-overflow:ellipsis;'+(fw?'font-weight:'+fw+';':'');
      return td;
    }
    tr.appendChild(mkStickyTd(ord.customer,0,96,500));
    tr.appendChild(mkStickyTd((ord.article||'')+(ord.color?' · '+ord.color:''),96,120));
    tr.appendChild(mkStickyTd(ord.lotSize?String(ord.lotSize):'—',216,52));

    MOVEMENTS.forEach(function(mv){
      var key=ord.orderId+'||'+mv;
      var agg=lkp[key]||{t:0,s:0};
      var bal=(ord.lotSize||0)-(agg.s||0);

      // TODAY
      var tdT=document.createElement('td');
      tdT.style.cssText='text-align:center;padding:5px 4px;border-bottom:1px solid var(--fos-border);border-left:2px solid var(--fos-border);';
      tdT.textContent=agg.t?String(agg.t):'—';
      tdT.style.color=agg.t?'var(--fos-ink)':'var(--fos-ink-secondary)';

      // TOTAL
      var tdS=document.createElement('td');
      tdS.style.cssText='text-align:center;padding:5px 6px;border-bottom:1px solid var(--fos-border);font-size:12px;';
      tdS.textContent=agg.s?String(agg.s):'—';
      tdS.style.color=agg.s?'var(--fos-ink)':'var(--fos-ink-secondary)';

      // BAL
      var tdB=document.createElement('td');
      tdB.style.cssText='text-align:center;padding:5px 6px;border-bottom:1px solid var(--fos-border);font-size:12px;font-weight:500;';
      if(!ord.lotSize){tdB.textContent='—';tdB.style.color='var(--fos-ink-secondary)';}
      else if(bal<=0){tdB.textContent='Done';tdB.style.color='var(--fos-success)';}
      else{tdB.textContent=String(bal);tdB.style.color=bal<=(ord.lotSize*0.2)?'var(--fos-warning)':'var(--fos-ink-secondary)';}

      tr.appendChild(tdT);tr.appendChild(tdS);tr.appendChild(tdB);
    });

    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  c.appendChild(wrap);
}
</script>
