<script>
// ── ADMIN HOME ────────────────────────────────────────────────────────────────
// Work Order number is the primary order identifier. Always display alongside article name.
function buildAdminOrderRow(o){
  var wrap=el('div',{cls:'fos-admin-order'});
  var hdr=el('div',{style:'display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:8px'});
  var hLeft=el('div',{style:'flex:1;min-width:0'});
  hLeft.appendChild(el('div',{style:'font-size:14px;font-weight:500;color:var(--fos-ink)',text:o.article||o.sheet}));
  if(o.customer)hLeft.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:1px',text:o.customer}));
  if(o.bom)hLeft.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:0.72rem;color:var(--fos-ink-secondary)',text:o.bom}));
  hLeft.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:4px',text:(o.totalPaid||0)+' paid / '+(o.orderQty||0)+' lot / '+(o.thisWeekQty||0)+' this week'}));
  var _paid=o.totalPaid||o.cumul||0;
  var _pct=o.orderQty>0?Math.min(100,Math.round(_paid/o.orderQty*100)):0;
  var prog=el('div',{cls:'fos-progress'});
  var fill=el('div',{cls:'fos-progress-fill'});
  fill.style.width=(o.orderQty>0?_pct:0)+'%';
  prog.appendChild(fill);
  hLeft.appendChild(prog);
  hdr.appendChild(hLeft);
  var over=o.orderQty>0&&o.cumul>o.orderQty;
  var done=!over&&o.orderQty>0&&o.cumul>=o.orderQty;
  var rem=o.remaining||0;
  var bClass=over?'red':done?'green':rem>0?'blue':'grey';
  var bText=over?'OVER':done?'COMPLETE':rem>0?(rem+' left'):'NO LOT';
  hdr.appendChild(el('span',{cls:'badge '+bClass,text:bText}));
  // Collapse indicator — same ▶/▼ convention as the Stage Progress toggle,
  // so open/closed state is visible and consistent across order cards.
  var caret=el('span',{style:'font-size:10px;color:var(--fos-ink-secondary);margin-left:6px;flex-shrink:0',text:'▶'});
  hdr.appendChild(caret);
  var det=el('div',{style:'display:none;padding:8px 0 4px;font-size:12px'});
  if(o.deptBreakdown&&o.deptBreakdown.length){
    o.deptBreakdown.forEach(function(d){
      if(!d.paid&&!d.thisWeek)return;
      var dr=el('div',{style:'display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-top:0.5px solid var(--fos-border)'});
      dr.appendChild(el('span',{style:'color:var(--fos-ink-secondary);text-transform:uppercase;font-size:10px;font-weight:500',text:d.dept}));
      var right=el('div',{style:'display:flex;gap:8px;font-size:11px'});
      right.appendChild(el('span',{style:'color:var(--fos-success)',text:(d.paid||0)+' appr'}));
      if(o.orderQty)right.appendChild(el('span',{style:'color:var(--fos-ink-secondary)',text:o.orderQty+' lot'}));
      var remD=o.orderQty?Math.max(0,o.orderQty-(d.paid||0)):0;
      if(remD>0)right.appendChild(el('span',{style:'color:var(--fos-warning)',text:remD+' left'}));
      if(d.thisWeek)right.appendChild(el('span',{style:'color:var(--fos-accent)',text:d.thisWeek+' pend'}));
      dr.appendChild(right);det.appendChild(dr);
    });
  }
  hdr.onclick=function(){var opening=det.style.display==='none';det.style.display=opening?'block':'none';caret.textContent=opening?'▼':'▶';};
  wrap.appendChild(hdr);wrap.appendChild(det);
  var _admProg={loaded:false};
  var admTgl=el('div',{style:'font-size:0.8rem;color:var(--fos-accent);cursor:pointer;user-select:none;margin-top:6px'});
  admTgl.textContent='▶ Stage Progress';
  var admPanel=el('div',{style:'display:none'});
  admTgl.onclick=function(ev){ev.stopPropagation();
    var open=admPanel.style.display!=='none';
    admPanel.style.display=open?'none':'block';
    admTgl.textContent=open?'▶ Stage Progress':'▼ Stage Progress';
    if(!open&&!_admProg.loaded){
      admPanel.innerHTML='<div style="font-size:0.8rem;color:var(--fos-ink-secondary);padding:0.5rem 0">Loading...</div>';
      google.script.run
        .withSuccessHandler(function(r){_admProg.loaded=true;admPanel.innerHTML='';admPanel.appendChild(renderStageBreakdown(r));})
        .withFailureHandler(function(){admPanel.innerHTML='<div style="font-size:0.8rem;color:var(--fos-ink-secondary);padding:0.5rem 0">Error loading</div>';})
        .getOrderProgress(o.sheet);
    }
  };
  wrap.appendChild(admTgl);wrap.appendChild(admPanel);
  return wrap;
}

function renderAdminHome(c){
  c.innerHTML='';
  if(!D.dash){
    c.appendChild(alert_('yellow','Loading...','Tap Refresh to reload data'));
    return;
  }
  var d=D.dash;
  var approved=d.approvalStatus&&d.approvalStatus!=='';

  // 1. Pipeline tracker — real outstanding pairs per stage (from job cards)
  var _pl=d.pipeline||{};
  var pt=fosPipelineTracker({cutting:_pl.cutting||0,prep:_pl.prep||0,fitter:_pl.fitter||0,lasting:_pl.lasting||0,finish:_pl.finish||0,dispatch:_pl.dispatch||0});
  pt.classList.add('fos-light');
  c.appendChild(pt);

  // 2. Compact 4-metric row (replaces 2×2 KPI grid)
  var mrow=el('div',{cls:'fos-metric-row'});
  mrow.appendChild(fosMetricEl('Payout',fmt(d.weeklyPayout),'this week','green'));
  mrow.appendChild(fosMetricEl('Orders',String(d.totalOrders),d.redCount>0?(d.redCount+' over lot'):(d.completeCount+' done'),d.redCount>0?'red':'blue'));
  var _onFloor=(_pl.cutting||0)+(_pl.prep||0)+(_pl.fitter||0)+(_pl.lasting||0)+(_pl.finish||0)+(_pl.dispatch||0);
  mrow.appendChild(fosMetricEl('WIP',String(_onFloor),'pairs on floor','blue'));
  var pc=d.pendingCount||0;
  if(pc>0){
    var apprM=fosMetricEl('Requests',String(pc),'pending','orange');
    apprM.style.cursor='pointer';
    apprM.onclick=function(){loadTab('requests');};
    mrow.appendChild(apprM);
  } else {
    var _apSt=d.approvalStatus||'';
    var _apLabel='', _apSub='', _apColor='';
    if(_apSt==='all_approved'){
      _apLabel='All Clear';_apSub='no pending';_apColor='green';
    } else if(_apSt.indexOf('pending:')===0){
      var _pendAmt=_apSt.replace('pending:','');
      _apLabel='₹'+_pendAmt;_apSub='pending approval';_apColor='orange';
    } else {
      _apLabel='—';_apSub='no data';_apColor='';
    }
    mrow.appendChild(fosMetricEl('PENDING',_apLabel,_apSub,_apColor));
  }
  c.appendChild(mrow);

  // Order Progress Report (printable)
  if(Array.isArray(d.orders)&&d.orders.length){
    var opBtn=el('button',{style:'padding:6px 12px;background:none;color:var(--fos-accent);border:1px solid var(--fos-border);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:12px',text:'🖨 Order Progress Report'});
    opBtn.onclick=function(){
      var rows=d.orders.map(function(o){
        // Status display rule: OVER only when paid > lot; paid = lot is COMPLETE.
        // (The raw ORDER_TRACKER status column says OVER at equality — display only.)
        var _q=safeNum(o.orderQty),_cu=safeNum(o.cumul);
        var _st=(_q>0&&_cu>_q)?'OVER':(_q>0&&_cu===_q)?'COMPLETE':(o.status||'');
        return '<tr><td>'+_esc(o.article||o.sheet||'')+(o.customer?' · '+_esc(o.customer):'')+'</td><td class="rt">'+_q+'</td><td class="rt">'+_cu+'</td><td class="rt">'+safeNum(o.remaining)+'</td><td>'+_esc(_st)+'</td></tr>';
      }).join('');
      printDoc('Order Progress Report',
        '<table><tr><th>Article / Order</th><th class="rt">Lot</th><th class="rt">Produced</th><th class="rt">Remaining</th><th>Status</th></tr>'+rows+'</table>');
    };
    c.appendChild(opBtn);
  }

  // 3. Alerts
  c.appendChild(sectionTitle('Alerts'));
  if(d.redCount>0)c.appendChild(alert_('red',d.redCount+' order(s) over lot cap','Review before approving payment'));
  if(!approved)c.appendChild(alert_('yellow','Payment not approved yet','Go to Approve tab before Saturday'));
  if(approved&&d.redCount===0)c.appendChild(alert_('green','All clear - safe to pay','Approved: '+d.approvalStatus));

  // 3b. Delivery Risk — overdue open job cards (most overdue first)
  var risk=Array.isArray(d.deliveryRisk)?d.deliveryRisk:[];
  if(risk.length){
    c.appendChild(sectionTitle('Delivery Risk'));
    var riskCard=el('div',{cls:'fos-card'});
    var artByRefA={};(D.dash&&D.dash.orders?D.dash.orders:[]).forEach(function(o){artByRefA[o.sheet]=o;});
    risk.slice(0,6).forEach(function(rk){
      var o=artByRefA[rk.orderRef];
      var name=o?(o.article||rk.orderRef):rk.orderRef;
      var rr=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--fos-border)'});
      var rl=el('div',{style:'flex:1;min-width:0'});
      rl.appendChild(el('div',{style:'font-size:14px;font-weight:500;color:var(--fos-ink)',text:name}));
      rl.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:(rk.movement||'')+' · '+rk.balance+' pairs outstanding'}));
      rr.appendChild(rl);
      var days=rk.daysOverdue||0;
      rr.appendChild(el('span',{cls:days>=8?'badge red':'badge yellow',text:days+'d overdue'}));
      riskCard.appendChild(rr);
    });
    if(risk.length>6)riskCard.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);padding:8px 0 0',text:'+ '+(risk.length-6)+' more overdue'}));
    c.appendChild(riskCard);
  }

  // 3c. Pending Approvals — with age (days since submitted)
  var preqs=(D.reqs&&Array.isArray(D.reqs.requests)?D.reqs.requests:[]).filter(function(r){return (r.status||'').trim().toUpperCase()==='PENDING';});
  if(preqs.length){
    c.appendChild(sectionTitle('Pending Approvals'));
    var apCard=el('div',{cls:'fos-card'});
    var _todayA=new Date();_todayA.setHours(0,0,0,0);
    var TYPE_LBL={ACTIVITY_SETUP:'Activity setup',MASTER_ACTIVITY:'Master activity',RATE_EDIT:'Rate change',SETUP_EDIT_REQUEST:'Setup edit',EDIT_REQUEST:'Edit',NEW_ORDER:'New order',PAYMENT:'Payment'};
    preqs.forEach(function(r){
      var ageD='';
      try{var dt=new Date(r.date);if(!isNaN(dt.getTime())){dt.setHours(0,0,0,0);ageD=Math.max(0,Math.floor((_todayA-dt)/86400000))+'d';}}catch(e){}
      var arow=el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--fos-border);cursor:pointer'});
      arow.onclick=function(){loadTab('requests');};
      var al=el('div',{style:'flex:1;min-width:0'});
      al.appendChild(el('div',{style:'font-size:14px;font-weight:500;color:var(--fos-ink)',text:TYPE_LBL[r.type]||r.type||'Request'}));
      al.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'by '+(r.submittedBy||'—')}));
      arow.appendChild(al);
      var badgeCls=/^\d+d$/.test(ageD)&&parseInt(ageD,10)>=3?'badge red':'badge grey';
      arow.appendChild(el('span',{cls:badgeCls,text:ageD||'—'}));
      apCard.appendChild(arow);
    });
    c.appendChild(apCard);
  }

  // 4. Recently updated orders — reversed sheet order (no timestamp in data; positional fallback), capped at 8
  c.appendChild(sectionTitle('Recently Updated'));
  var recentOrders=d.orders?d.orders.slice().reverse().slice(0,8):[];
  recentOrders.forEach(function(o){c.appendChild(buildAdminOrderRow(o));});
  if(!recentOrders.length)c.appendChild(el('div',{style:'color:var(--fos-ink-secondary);padding:20px;text-align:center',text:'No orders'}));

  // Payouts by Period
  if(d.periodList&&d.periodList.length){
    c.appendChild(sectionTitle('Payouts by Period'));
    d.periodList.forEach(function(p){
      var pCard=el('div',{cls:'fos-card',style:'margin-bottom:8px'});
      pCard.appendChild(el('div',{style:'font-size:12px;font-weight:600;color:var(--fos-ink);margin-bottom:6px',text:_periodLabel(p.periodId)}));
      var pRow=el('div',{style:'display:flex;gap:16px;font-size:12px'});
      if(p.submitted)pRow.appendChild(el('span',{style:'font-family:var(--fos-font-mono);color:var(--fos-warning)',text:'Submitted: ₹'+p.submitted.toFixed(2)}));
      if(p.approved)pRow.appendChild(el('span',{style:'font-family:var(--fos-font-mono);color:var(--fos-success)',text:'Approved: ₹'+p.approved.toFixed(2)}));
      pRow.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-weight:600;color:var(--fos-ink)',text:'Total: ₹'+p.total.toFixed(2)}));
      pCard.appendChild(pRow);
      c.appendChild(pCard);
    });
  }

  // This Week — Contractors
  if(d.contractorSummary&&d.contractorSummary.length){
    c.appendChild(sectionTitle('This Week — Contractors'));
    var csCard=el('div',{cls:'fos-card'});
    d.contractorSummary.forEach(function(cs){
      var crow=el('div',{style:'display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--fos-border)'});
      var cl=el('div');
      cl.appendChild(el('div',{style:'font-size:14px;font-weight:500;color:var(--fos-ink)',text:cs.name}));
      cl.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:2px',text:cs.qty+' pairs · '+(cs.method||'Cash')}));
      crow.appendChild(cl);
      crow.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:14px;font-weight:600;color:var(--fos-ink)',text:fmt(cs.amount)}));
      csCard.appendChild(crow);
    });
    c.appendChild(csCard);
  }
}

// ── ORDERS ────────────────────────────────────────────────────────────────────
var ordersFilter='open',ordersBuyer='';
function renderOrders(c){
  c.innerHTML='';
  if(!D.dash){c.appendChild(alert_('yellow','Loading...','Tap Refresh'));return;}
  c.appendChild(sectionTitle('All Orders'));
  var allOrders=D.dash&&D.dash.orders?D.dash.orders:[];

  // filter bar
  var filterBar=el('div',{style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px'});
  function pill(label,val){
    var p=el('button',{text:label,style:'border:none;border-radius:16px;padding:5px 14px;font-family:var(--fos-font-body);font-size:13px;cursor:pointer;transition:background 0.15s'});
    function upd(){p.style.background=ordersFilter===val?'var(--fos-accent)':'var(--fos-surface)';p.style.color=ordersFilter===val?'#fff':'var(--fos-ink)';}
    p.onclick=function(){ordersFilter=val;renderOrders(c);};
    upd();return p;
  }
  filterBar.appendChild(pill('Open','open'));
  filterBar.appendChild(pill('Closed','closed'));
  var buyers=[];
  allOrders.forEach(function(o){if(o.customer&&buyers.indexOf(o.customer)<0)buyers.push(o.customer);});
  buyers.sort();
  if(buyers.length>0){
    var sel=el('select',{style:'border:1px solid var(--fos-border);border-radius:6px;padding:0.4rem 0.75rem;font-family:var(--fos-font-body);font-size:0.85rem;background:var(--fos-surface);color:var(--fos-ink);cursor:pointer'});
    var optAll=document.createElement('option');optAll.value='';optAll.textContent='All Buyers';sel.appendChild(optAll);
    buyers.forEach(function(b){var opt=document.createElement('option');opt.value=b;opt.textContent=b;sel.appendChild(opt);});
    sel.value=ordersBuyer;
    sel.onchange=function(){ordersBuyer=sel.value;renderOrders(c);};
    filterBar.appendChild(sel);
  }
  c.appendChild(filterBar);

  var orders=allOrders.filter(function(o){
    var lot=o.orderQty||0,paid=o.totalPaid||o.cumul||0;
    var isOpen=lot===0||paid<lot;
    var isMatch=ordersFilter==='open'?isOpen:!isOpen;
    var buyerMatch=!ordersBuyer||o.customer===ordersBuyer;
    return isMatch&&buyerMatch;
  });

  orders.forEach(function(o){
    var wrap=buildAdminOrderRow(o);
    var delBtn=el('button',{text:'Delete Order',style:'background:none;border:none;color:var(--fos-danger);font-family:var(--fos-font-body);font-size:12px;padding:6px 0 2px;cursor:pointer;display:block'});
    (function(sn,btn){btn.onclick=function(){
      // Delete proceeds — button press is confirmation
      btn.disabled=true;btn.textContent='Deleting…';
      google.script.run
        .withSuccessHandler(function(r){
          if(r.success){toast('Order deleted');D.dash=null;loadTab('orders');}
          else{toast(r.error||'Error',true);btn.disabled=false;btn.textContent='Delete Order';}
        })
        .withFailureHandler(function(){toast('Error',true);btn.disabled=false;btn.textContent='Delete Order';})
        .deleteOrder(sn);
    };})(o.sheet,delBtn);
    wrap.appendChild(delBtn);
    // ── Admin override: edit order details (password-gated, 7.1) ──
    (function(order,wrapEl){
      var _in='width:100%;padding:7px 9px;border:1px solid var(--fos-border);border-radius:8px;font-size:13px;box-sizing:border-box;background:var(--fos-surface);color:var(--fos-ink);margin-bottom:8px';
      var editBtn=el('button',{text:'✎ Edit details (override)',style:'background:none;border:none;color:var(--fos-accent);font-size:12px;padding:6px 0 2px;cursor:pointer;display:block'});
      var form=el('div',{style:'display:none;margin-top:8px;padding:12px;background:var(--fos-surface);border:1px solid var(--fos-border);border-radius:10px'});
      form.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px',text:'Lot size'}));
      var lotI=el('input',{type:'number',style:_in}); lotI.value=order.orderQty||'';
      form.appendChild(lotI);
      form.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px',text:'Customer'}));
      var custI=el('input',{type:'text',style:_in}); custI.value=order.customer||'';
      form.appendChild(custI);
      form.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px',text:'Size run'}));
      var sizeWrap=el('div',{style:'margin-bottom:8px'});
      form.appendChild(sizeWrap);
      form.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px',text:'Activity rates'}));
      var ratesWrap=el('div',{style:'margin-bottom:8px'});
      form.appendChild(ratesWrap);
      var pwI=el('input',{type:'password',placeholder:'Admin override password',style:_in.replace('margin-bottom:8px','margin-bottom:8px;border-color:var(--fos-warning)')});
      form.appendChild(pwI);
      var saveBtn=el('button',{cls:'primary-btn',text:'Save changes',style:'width:100%;padding:11px;font-size:13px;border-radius:10px'});
      form.appendChild(saveBtn);
      function renderSizeEdit(res){
        sizeWrap.innerHTML='';
        if(!res||!res.sizes||!Object.keys(res.sizes).length){sizeWrap.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'No size run set'}));return;}
        var scroll=el('div',{style:'overflow-x:auto'});var row=el('div',{style:'display:inline-flex;gap:6px'});
        Object.keys(res.sizes).sort(function(a,b){return parseFloat(a)-parseFloat(b);}).forEach(function(k){
          var col=el('div',{style:'display:flex;flex-direction:column;align-items:center;gap:3px'});
          col.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:k}));
          var si=el('input',{type:'number',style:'width:46px;padding:4px;border:1px solid var(--fos-border);border-radius:6px;font-size:13px;text-align:center;background:var(--fos-surface);color:var(--fos-ink)'});
          si.value=res.sizes[k]||0;si.dataset.size=k;col.appendChild(si);row.appendChild(col);
        });
        scroll.appendChild(row);sizeWrap.appendChild(scroll);
      }
      function renderRatesEdit(res){
        ratesWrap.innerHTML='';
        var raw=(res&&res.activities)?res.activities:[];
        // dedupe: one row per dept+activity, keeping the latest (most recent) rate
        var seen={},acts=[];
        raw.forEach(function(a){
          var k=(a.dept||'').toLowerCase().trim()+'|'+(a.activityName||'').toLowerCase().trim();
          if(seen[k]!==undefined){acts[seen[k]]=a;}
          else{seen[k]=acts.length;acts.push(a);}
        });
        if(!acts.length){ratesWrap.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'No approved activities'}));return;}
        acts.forEach(function(a){
          var r=el('div',{style:'display:flex;align-items:center;gap:6px;margin-bottom:6px'});
          var lbl=el('div',{style:'flex:1;min-width:0'});
          lbl.appendChild(el('div',{style:'font-size:12px;font-weight:600;color:var(--fos-ink)',text:a.activityName}));
          lbl.appendChild(el('div',{style:'font-size:10px;color:var(--fos-ink-secondary)',text:a.dept||''}));
          r.appendChild(lbl);
          var rt=el('input',{type:'number',style:'width:64px;padding:4px 6px;border:1px solid var(--fos-border);border-radius:6px;font-size:12px;text-align:right;background:var(--fos-surface);color:var(--fos-ink)'});
          rt.value=a.rate||0;rt.dataset.act=a.activityName;rt.dataset.dept=a.dept||'';rt.dataset.f='rate';
          var cm=el('input',{type:'number',style:'width:56px;padding:4px 6px;border:1px solid var(--fos-border);border-radius:6px;font-size:12px;text-align:right;background:var(--fos-surface);color:var(--fos-ink)'});
          cm.value=a.comm||0;cm.dataset.act=a.activityName;cm.dataset.dept=a.dept||'';cm.dataset.f='comm';
          r.appendChild(el('span',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'₹'}));r.appendChild(rt);
          r.appendChild(el('span',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'+comm'}));r.appendChild(cm);
          ratesWrap.appendChild(r);
        });
      }
      editBtn.onclick=function(){
        var opening=form.style.display==='none';form.style.display=opening?'block':'none';
        editBtn.textContent=opening?'✕ Close edit':'✎ Edit details (override)';
        if(opening){
          sizeWrap.innerHTML='Loading sizes…';
          google.script.run.withSuccessHandler(renderSizeEdit).withFailureHandler(function(){sizeWrap.textContent='Could not load sizes';}).getOrderSizes(order.sheet);
          ratesWrap.innerHTML='Loading rates…';
          google.script.run.withSuccessHandler(renderRatesEdit).withFailureHandler(function(){ratesWrap.textContent='Could not load rates';}).getApprovedActivitiesForArticle(order.sheet);
        }
      };
      saveBtn.onclick=function(){
        var pw=pwI.value.trim();if(!pw){toast('Enter the override password',true);return;}
        var payload={sheetName:order.sheet,overridePassword:pw};
        if(lotI.value!=='')payload.lot=parseInt(lotI.value,10);
        if(custI.value.trim()!=='')payload.customer=custI.value.trim();
        var sizeRun={};sizeWrap.querySelectorAll('input[data-size]').forEach(function(inp){var v=parseInt(inp.value,10);if(v>0)sizeRun[inp.dataset.size]=v;});
        if(Object.keys(sizeRun).length)payload.sizeRun=sizeRun;
        var rmap={};
        ratesWrap.querySelectorAll('input[data-act]').forEach(function(inp){
          var key=inp.dataset.dept+'|'+inp.dataset.act;
          if(!rmap[key])rmap[key]={activityName:inp.dataset.act,dept:inp.dataset.dept,rate:0,comm:0};
          rmap[key][inp.dataset.f]=parseFloat(inp.value)||0;
        });
        var rates=Object.keys(rmap).map(function(k){return rmap[k];});
        if(rates.length)payload.rates=rates;
        saveBtn.disabled=true;saveBtn.textContent='Saving…';
        google.script.run
          .withSuccessHandler(function(r){
            if(r&&r.success){toast('Order updated — '+((r.changed||[]).join(', ')||'no change'));D.dash=null;D.orderSizes=null;loadTab('orders');}
            else{saveBtn.disabled=false;saveBtn.textContent='Save changes';toast((r&&r.error)||'Update failed',true);}
          })
          .withFailureHandler(function(e){saveBtn.disabled=false;saveBtn.textContent='Save changes';toast((e&&e.message)||'Error',true);})
          .adminEditOrder(payload);
      };
      wrapEl.appendChild(editBtn);wrapEl.appendChild(form);
    })(o,wrap);
    c.appendChild(wrap);
  });
  if(!orders.length)c.appendChild(el('div',{style:'color:var(--fos-ink-secondary);padding:20px;text-align:center',text:'Is filter mein koi order nahi hai'}));
}

// Called from js_core.html renderTab for admin 'payment' tab
function renderAdminPayment(c){
  c.innerHTML='';

  if(!D.payBatches){
    c.appendChild(alert_('yellow','Loading...','Tap Refresh to reload'));
    return;
  }

  // Section 1: Pending payment batches (from job card flow)
  var batches=D.payBatches||[];
  var artMap={};
  if(D.entry&&D.entry.articles){
    D.entry.articles.forEach(function(a){artMap[a.sheet]=a.article||a.sheet;});
  }
  var ctrMap={};
  if(D.contractors){
    D.contractors.forEach(function(ct){var cid=ct.ctrId||'';if(cid)ctrMap[cid]=ct.name||cid;});
  }
  var pending=batches.filter(function(b){
    return b.status==='PENDING'&&
           !(b.approvedBy&&b.approvedBy.indexOf('REJECTED:')===0);
  });

  c.appendChild(sectionTitle('Pending Payment Approvals ('+pending.length+')'));

  if(!pending.length){
    c.appendChild(alert_('green','No pending payments','All payments approved'));
  } else {
    pending.forEach(function(b){
      var ctrName=ctrMap[b.contractorId||'']||(b.contractorId||'Unknown');
      var bCard=el('div',{cls:'req-card',style:'margin-bottom:12px'});

      // Header
      var top=el('div',{style:'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px'});
      var tl=el('div');
      tl.appendChild(el('div',{style:'font-size:14px;font-weight:700;color:var(--fos-ink)',text:ctrName}));
      tl.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary)',text:b.paymentId||'—'}));
      tl.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:'Period: '+(b.periodId?_periodLabel(b.periodId):'—')}));
      top.appendChild(tl);
      top.appendChild(el('span',{cls:'badge yellow',text:'PENDING'}));
      bCard.appendChild(top);

      // Job card lines
      var lines=b.lines||[];
      if(lines.length){
        var tbl=el('div',{style:'margin-bottom:10px'});
        var hdr=el('div',{style:'display:grid;grid-template-columns:1fr 80px 80px;gap:4px;padding:4px 0;border-bottom:1px solid var(--fos-border);font-size:10px;font-weight:700;color:var(--fos-ink-secondary);text-transform:uppercase'});
        ['Article / Dept','Pairs','Amount'].forEach(function(h){hdr.appendChild(el('div',{text:h}));});
        tbl.appendChild(hdr);
        lines.forEach(function(l){
          var aRow=el('div',{style:'display:grid;grid-template-columns:1fr 80px 80px;gap:4px;padding:5px 0;border-bottom:1px solid var(--fos-border);font-size:12px'});
          var ai=el('div');
          ai.appendChild(el('div',{style:'font-weight:600;color:var(--fos-ink)',text:artMap[l.orderRef]||l.orderRef||'—'}));
          ai.appendChild(el('div',{style:'font-size:10px;color:var(--fos-ink-secondary)',text:l.department||'—'}));
          aRow.appendChild(ai);
          aRow.appendChild(el('div',{style:'color:var(--fos-ink)',text:String(l.pairs||0)}));
          aRow.appendChild(el('div',{style:'color:var(--fos-success);font-weight:700',text:'₹'+Number(l.amount||0).toFixed(2)}));
          tbl.appendChild(aRow);
        });
        bCard.appendChild(tbl);
      }

      // Total + approve/reject
      var footer=el('div',{style:'display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--fos-border)'});
      var totalPairsV=0,totalAmountV=0;
      (b.lines||[]).forEach(function(l){totalPairsV+=(l.pairs||0);totalAmountV+=(l.amount||0);});
      footer.appendChild(el('div',{style:'font-size:14px;font-weight:700;color:var(--fos-success)',
        text:totalPairsV+' pairs · ₹'+totalAmountV.toFixed(2)}));

      var btnRow=el('div',{style:'display:flex;gap:8px'});
      var apBtn=el('button',{cls:'ap-btn',text:'Approve'});
      var rjBtn=el('button',{cls:'rj-btn',text:'Reject'});

      (function(payId,aBtn,rBtn,cardEl){
        aBtn.onclick=function(){
          // Approval proceeds directly
          aBtn.disabled=true;aBtn.textContent='Approving…';
          google.script.run
            .withSuccessHandler(function(r){
              if(r&&r.success){
                toast('Approved — '+payId);
                D.payBatches=null;
                setTimeout(function(){loadTab('payment');},600);
              } else {
                aBtn.disabled=false;aBtn.textContent='Approve';
                toast((r&&r.error)||'Error',true);
              }
            })
            .withFailureHandler(function(){
              aBtn.disabled=false;aBtn.textContent='Approve';
              toast('Error',true);
            })
            .approvePaymentBatch(payId);
        };

        // Reject with inline reason
        var rkWrap=el('div',{style:'display:none;margin-top:8px;width:100%'});
        var rkInp=el('textarea',{placeholder:'Reason for rejection — required',
          style:'width:100%;background:var(--fos-bg);border:1px solid var(--fos-danger);border-radius:8px;padding:9px 12px;color:var(--fos-ink);font-size:13px;box-sizing:border-box;margin-bottom:6px;display:block;resize:none;min-height:60px'});
        var rkRow2=el('div',{style:'display:flex;gap:8px'});
        var rkConfirm=el('button',{text:'Confirm Reject',
          style:'flex:1;padding:9px;background:#7f1d1d;color:#fca5a5;font-size:13px;font-weight:700;border-radius:8px;border:none;cursor:not-allowed;opacity:0.4'});
        rkConfirm.disabled=true;
        var rkCancel=el('a',{style:'font-size:12px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',text:'Cancel'});
        rkRow2.appendChild(rkConfirm);rkRow2.appendChild(rkCancel);
        rkWrap.appendChild(rkInp);rkWrap.appendChild(rkRow2);

        rkInp.oninput=function(){
          var ok=!!rkInp.value.trim();
          rkConfirm.disabled=!ok;
          rkConfirm.style.opacity=ok?'1':'0.4';
          rkConfirm.style.cursor=ok?'pointer':'not-allowed';
        };
        rBtn.onclick=function(){btnRow.style.display='none';rkWrap.style.display='block';rkInp.focus();};
        rkCancel.onclick=function(){rkWrap.style.display='none';btnRow.style.display='';};
        rkConfirm.onclick=function(){
          var reason=rkInp.value.trim();if(!reason)return;
          rkConfirm.disabled=true;rkConfirm.textContent='Rejecting...';
          google.script.run
            .withSuccessHandler(function(r){
              if(r&&r.success){
                toast('Rejected — '+payId);
                D.payBatches=null;
                setTimeout(function(){loadTab('payment');},600);
              } else {
                rkConfirm.disabled=false;rkConfirm.textContent='Confirm Reject';
                toast((r&&r.error)||'Error',true);
              }
            })
            .withFailureHandler(function(){
              rkConfirm.disabled=false;rkConfirm.textContent='Confirm Reject';
              toast('Error',true);
            })
            .rejectPaymentBatch(payId,reason);
        };
        cardEl.appendChild(rkWrap);
      })(b.paymentId,apBtn,rjBtn,bCard);

      btnRow.appendChild(apBtn);btnRow.appendChild(rjBtn);
      footer.appendChild(btnRow);
      bCard.appendChild(footer);
      c.appendChild(bCard);
    });
  }

  // S.5: legacy "Legacy Submissions" section deleted — D.subs was only ever
  // populated by the removed approve tab, so it could never render here.
}

// ── REQUESTS ──────────────────────────────────────────────────────────────────
function renderRequests(c){
  c.innerHTML='';
  var reqs=D.reqs&&D.reqs.requests?D.reqs.requests:[];
  var pending=reqs.filter(function(r){return (r.status||'').trim().toUpperCase()==='PENDING';});
  c.appendChild(sectionTitle('Pending Requests ('+pending.length+')'));
  if(!pending.length){c.appendChild(alert_('green','All clear','No pending requests'));return;}
  pending.forEach(function(r){
    var card=el('div',{cls:'req-card'});
    var rtEl=el('div',{cls:'req-type',text:r.type});
    if(r.type==='EDIT_REQUEST')rtEl.style.color='var(--fos-danger)';
    if(r.type==='SETUP_EDIT_REQUEST')rtEl.style.color='var(--fos-warning)';
    card.appendChild(rtEl);
    var det=el('div',{cls:'req-details'});
    if(r.orderInfo&&(r.type==='ACTIVITY_SETUP'||r.type==='SETUP_EDIT_REQUEST'||r.type==='EDIT_REQUEST')){
      var oi=r.orderInfo;
      var oiLine=(oi.bom||'')+(oi.article?' | '+oi.article+(oi.color?' - '+oi.color:''):'')+(oi.customer?' | '+oi.customer:'');
      if(oiLine)det.appendChild(el('div',{cls:'fos-code',style:'font-size:11px;font-weight:700;color:var(--fos-accent);margin-bottom:6px;padding:3px 6px;background:var(--fos-accent-soft);border-radius:4px',text:oiLine}));
    }
    if(r.type==='RATE_EDIT'){
      try{var pl=JSON.parse(r.details);det.appendChild(el('div',{text:'Rate Change: '+(r.activityName||('Row '+pl.rowIndex))+' → ₹'+pl.newRate+' rate, ₹'+pl.newComm+' comm'}));}
      catch(e){det.appendChild(el('div',{text:r.details}));}
    } else if(r.type==='ACTIVITY_SETUP'){
      try{var pl2=JSON.parse(r.details);
        if(pl2.activityName){
          det.appendChild(el('div',{style:'font-weight:700;color:var(--fos-ink);margin-bottom:4px',text:'New Activity Request'}));
          if(pl2.sheet)det.appendChild(el('div',{text:'Article: '+pl2.sheet}));
          det.appendChild(el('div',{text:'Activity: '+pl2.activityName}));
          det.appendChild(el('div',{text:'Dept: '+(pl2.dept||'—')+' | Rate: ₹'+(pl2.rate||0)+'/pr'+(pl2.comm?' | Comm: ₹'+pl2.comm+'/pr':'')}));
        } else {
          det.appendChild(el('div',{style:'font-weight:700;color:var(--fos-ink);margin-bottom:4px',text:'Activity Setup: '+(pl2.sheet||'?')}));
          (pl2.activities||[]).forEach(function(act){
            det.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);padding:2px 0;border-bottom:1px solid var(--fos-border)',text:(act.activityName||'?')+' | '+(act.department||'—')+' | ₹'+(act.rate||0)+'/pr'+(act.comm?' | ₹'+act.comm+' comm':'')}));
          });
          if(!pl2.activities||!pl2.activities.length)det.appendChild(el('div',{text:'No activities listed'}));
        }
      }catch(e2){det.appendChild(el('div',{text:r.details}));}
    } else if(r.type==='MASTER_ACTIVITY'){
      try{var plma=JSON.parse(r.details);
        det.appendChild(el('div',{style:'font-weight:700;color:var(--fos-ink);margin-bottom:4px',text:'New Master Activity'}));
        det.appendChild(el('div',{text:'Activity: '+(plma.activityName||'?')}));
        det.appendChild(el('div',{text:'Dept: '+(plma.dept||'—')+' | Rate: ₹'+(plma.rate||0)+'/pr'+(plma.comm?' | Comm: ₹'+plma.comm+'/pr':'')}));
      }catch(ema){det.appendChild(el('div',{text:r.details}));}
    } else if(r.type==='CUSTOM_PERIOD_REQUEST'){
      try{var pl3=JSON.parse(r.details);det.appendChild(el('div',{text:'Custom Period: '+(pl3.fromDate||'?')+' → '+(pl3.toDate||'?')}));if(pl3.reason)det.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'Reason: '+pl3.reason}));}
      catch(e3){det.appendChild(el('div',{text:r.details}));}
    } else if(r.type==='NEW_ORDER'){
      try{var plno=JSON.parse(r.details);det.appendChild(el('div',{text:(plno.styleName||'?')+(plno.color?' — '+plno.color:'')+' for '+(plno.buyer||'?')}));det.appendChild(el('div',{cls:'fos-code',style:'font-size:11px;color:var(--fos-ink-secondary)',text:'BOM: '+(plno.tsNumber||'?')+' | Lot: '+(plno.lotSize||0)+' pairs | Del: '+(plno.deliveryDate||'?')}));}
      catch(e4){det.appendChild(el('div',{text:r.details}));}
      if(r.ayushNotes)det.appendChild(el('div',{style:'margin-top:6px;padding:4px 8px;background:var(--fos-accent-soft);border-left:3px solid var(--fos-danger);color:var(--fos-danger);font-size:11px;border-radius:0 4px 4px 0',text:r.ayushNotes}));
    } else if(r.type==='PAYMENT'){
      try{var plpay=JSON.parse(r.details);det.appendChild(el('div',{text:'Week entries submitted for approval: '+(plpay.weekLabel||'?')}));}
      catch(epay){det.appendChild(el('div',{text:r.details}));}
    } else if(r.type==='PAYMENT_SUBMISSION'){
      if(r.psArticle)det.appendChild(el('div',{style:'font-weight:600;margin-bottom:4px',text:'Article: '+r.psArticle}));
      if(r.psPeriodId)det.appendChild(el('div',{style:'margin-bottom:6px;color:var(--fos-ink-secondary)',text:'Period: '+_periodLabel(r.psPeriodId)}));
      if(r.psActivities&&r.psActivities.length){
        var psTbl=el('table',{style:'width:100%;border-collapse:collapse;font-size:12px'});
        var psHdr=el('tr',{});
        ['Activity','Contractor','Qty','Rate','Total'].forEach(function(h){psHdr.appendChild(el('th',{style:'text-align:left;padding:2px 6px;border-bottom:1px solid var(--fos-border)',text:h}));});
        psTbl.appendChild(psHdr);
        r.psActivities.forEach(function(a){
          var tr=el('tr',{});
          [a.activity,a.contractor,a.qty,a.rate,a.total].forEach(function(v){tr.appendChild(el('td',{style:'padding:2px 6px',text:String(v)}));});
          psTbl.appendChild(tr);
        });
        det.appendChild(psTbl);
        det.appendChild(el('div',{style:'text-align:right;font-weight:600;margin-top:4px',text:'Grand Total: ₹'+((r.psGrandTotal||0).toFixed(2))}));
      }
    } else if(r.type==='EDIT_REQUEST'){
      try{var pler=JSON.parse(r.details);
        det.appendChild(el('div',{style:'font-weight:700;color:var(--fos-danger)',text:'Edit Request: '+(pler.activityName||'?')+' on '+(pler.sheet||'?')}));
        if(pler.rowNum)det.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'Row '+pler.rowNum}));
      }catch(ere){det.appendChild(el('div',{text:r.details}));}
    } else if(r.type==='SETUP_EDIT_REQUEST'){
      try{var plser=JSON.parse(r.details);
        det.appendChild(el('div',{style:'font-weight:700;color:var(--fos-warning)',text:'Setup Edit: '+(plser.dept||'?')+' dept on '+(plser.sheet||'?')}));
      }catch(sere){det.appendChild(el('div',{text:r.details}));}
    } else {
      var parts=r.details.split('|');
      parts.forEach(function(p){det.appendChild(el('div',{text:p.trim()}));});
    }
    card.appendChild(det);
    card.appendChild(el('div',{cls:'req-meta',text:'From: '+r.submittedBy+' on '+r.date}));
    var acts=el('div',{style:'margin-top:2px'});
    var btnsDiv=el('div',{cls:'req-actions'});
    var _rjBtn=el('button',{cls:'rj-btn',text:'Reject'});
    var _rvBtn=el('button',{text:'Revision',style:'padding:7px 12px;border-radius:8px;border:1px solid #f59e0b;background:transparent;color:#f59e0b;font-size:13px;font-weight:600;cursor:pointer'});
    if(r.type==='RATE_EDIT'){
      var ab=el('button',{cls:'ap-btn',text:'Approve'});
      (function(reqId){ab.onclick=function(){doApproveRateEdit(reqId);};})(r.reqId);
      btnsDiv.appendChild(ab);btnsDiv.appendChild(_rjBtn);
    } else if(r.type==='EDIT_REQUEST'){
      var ab3=el('button',{cls:'ap-btn',text:'Approve'});
      (function(reqId){ab3.onclick=function(){doApproveEditRequest(reqId);};})(r.reqId);
      btnsDiv.appendChild(ab3);btnsDiv.appendChild(_rjBtn);
    } else if(r.type==='SETUP_EDIT_REQUEST'){
      var ab4=el('button',{cls:'ap-btn',text:'Approve'});
      (function(reqId){ab4.onclick=function(){doApproveSetupEditRequest(reqId);};})(r.reqId);
      btnsDiv.appendChild(ab4);btnsDiv.appendChild(_rjBtn);
    } else if(r.type==='PAYMENT_SUBMISSION'){
      // S.5: approve disabled — the legacy submission chain could pay a contractor twice.
      det.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-top:6px;padding:6px 8px;background:var(--fos-surface);border-left:3px solid var(--fos-warning);border-radius:0 4px 4px 0',text:'Legacy payment submission — approving is disabled (double-payment risk). Use Reject; pay via Job Cards → Payment.'}));
      btnsDiv.appendChild(_rjBtn);
    } else {
      var ab2=el('button',{cls:'ap-btn',text:'Approve'});
      (function(rowNum){ab2.onclick=function(){processReq(rowNum,'APPROVE');};})(r.rowNum);
      btnsDiv.appendChild(ab2);btnsDiv.appendChild(_rjBtn);
    }
    btnsDiv.appendChild(_rvBtn);
    acts.appendChild(btnsDiv);
    (function(rjBtn,rvBtn,bDiv,actsEl,rowNum,cardEl){
      var mode='REJECT';
      var rkWrap=el('div',{style:'display:none;margin-top:8px'});
      var rkTitle=el('div',{style:'font-size:12px;font-weight:600;margin-bottom:5px;color:#e8eaf0'});
      var rkInp=el('textarea',{placeholder:'Remark — required',style:'width:100%;background:#0f1117;border:1px solid #f59e0b;border-radius:8px;padding:9px 12px;color:#e8eaf0;font-size:13px;box-sizing:border-box;margin-bottom:6px;display:block;resize:none;min-height:60px'});
      var rkRow=el('div',{style:'display:flex;gap:8px;align-items:center'});
      var rkConfirm=el('button',{text:'Confirm',style:'flex:1;padding:9px;background:#7f1d1d;color:#fca5a5;font-size:13px;font-weight:700;border-radius:8px;border:none;cursor:not-allowed;opacity:0.4'});
      rkConfirm.disabled=true;
      var rkCancel=el('a',{style:'font-size:12px;color:#4a5578;cursor:pointer;text-decoration:underline',text:'Cancel'});
      rkRow.appendChild(rkConfirm);rkRow.appendChild(rkCancel);
      rkWrap.appendChild(rkTitle);rkWrap.appendChild(rkInp);rkWrap.appendChild(rkRow);
      actsEl.appendChild(rkWrap);
      rkInp.oninput=function(){var ok=!!rkInp.value.trim();rkConfirm.disabled=!ok;rkConfirm.style.opacity=ok?'1':'0.4';rkConfirm.style.cursor=ok?'pointer':'not-allowed';};
      function openBox(m){
        mode=m;
        rkTitle.textContent=(m==='REVISION')?'Send back for revision — remark required':'Reject — reason required';
        rkConfirm.textContent=(m==='REVISION')?'Send for Revision':'Confirm Reject';
        rkInp.style.borderColor=(m==='REVISION')?'#f59e0b':'#ef4444';
        bDiv.style.display='none';rkWrap.style.display='block';rkInp.focus();
      }
      rjBtn.onclick=function(){openBox('REJECT');};
      rvBtn.onclick=function(){openBox('REVISION');};
      rkCancel.onclick=function(){rkWrap.style.display='none';bDiv.style.display='';};
      rkConfirm.onclick=function(){
        var rmk=rkInp.value.trim();if(!rmk)return;
        var m=mode;
        rkConfirm.disabled=true;rkConfirm.textContent=(m==='REVISION')?'Sending...':'Rejecting...';
        google.script.run
          .withSuccessHandler(function(res){
            if(res&&res.success){
              D.reqs=null;
              actsEl.style.display='none';
              var st=el('div',{style:'margin-top:8px'});
              if(m==='REVISION'){
                st.appendChild(el('span',{cls:'badge',style:'background:#78350f;color:#fcd34d;display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600',text:'↩ Sent for revision'}));
                st.appendChild(el('div',{style:'font-size:12px;color:#f59e0b;margin-top:6px;padding:8px 10px;background:#451a03;border-left:3px solid #f59e0b;border-radius:0 6px 6px 0',text:rmk}));
                toast('Sent back for revision');
              } else {
                st.appendChild(el('span',{cls:'badge red',text:'✕ Rejected'}));
                st.appendChild(el('div',{style:'font-size:12px;color:#ef4444;margin-top:6px;padding:8px 10px;background:#450a0a;border-left:3px solid #ef4444;border-radius:0 6px 6px 0',text:rmk}));
                toast('Rejected');
              }
              cardEl.appendChild(st);
            } else{toast((res&&res.error)||'Error',true);rkConfirm.disabled=false;rkConfirm.textContent=(m==='REVISION')?'Send for Revision':'Confirm Reject';}
          })
          .withFailureHandler(function(){toast('Error',true);rkConfirm.disabled=false;rkConfirm.textContent=(m==='REVISION')?'Send for Revision':'Confirm Reject';})
          .processRequest(rowNum,m,rmk);
      };
    })(_rjBtn,_rvBtn,btnsDiv,acts,r.rowNum,card);
    card.appendChild(acts);
    c.appendChild(card);
  });
}

function processReq(rowNum,action){
  google.script.run

// ── MASTERS (Phase B) ─────────────────────────────────────────────────────────
// Sub-tab dispatcher: renderMasters draws the pill bar + a body container,
// then hands the body to exactly one renderMasters<Tab>(container) function.
// Later commits fill in renderMastersStyles by replacing its placeholder
// branch below with a real pane function — nothing else changes.
var MASTERS_TAB='suppliers';

function renderMasters(c){
  c.innerHTML='';
  c.appendChild(sectionTitle('Masters'));
  var tabs=[['styles','Styles'],['rates','Rates'],['materials','Materials'],['suppliers','Suppliers']];
  var bar=el('div',{style:'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px'});
  var body=el('div');
  tabs.forEach(function(t){
    var active=(MASTERS_TAB===t[0]);
    var pill=el('button',{
      text:t[1],
      style:'border-radius:16px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;'+
        (active
          ?'background:var(--fos-accent);color:#fff;border:1px solid var(--fos-accent)'
          :'background:var(--fos-surface);color:var(--fos-ink-secondary);border:1px solid var(--fos-border)')
    });
    (function(id){pill.onclick=function(){MASTERS_TAB=id;renderMasters(c);};})(t[0]);
    bar.appendChild(pill);
  });
  c.appendChild(bar);
  c.appendChild(body);
  // Dispatcher — one pane function per sub-tab.
  if(MASTERS_TAB==='suppliers')renderMastersSuppliers(body);
  else if(MASTERS_TAB==='styles')renderMastersPlaceholder(body,'Styles');
  else if(MASTERS_TAB==='rates')renderMastersRates(body);
  else renderMastersMaterials(body);
}

// Placeholder pane for sub-tabs that land in later Phase B commits.
function renderMastersPlaceholder(container,label){
  container.innerHTML='';
  container.appendChild(el('div',{
    style:'color:var(--fos-ink-secondary);text-align:center;padding:48px 20px;background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:12px;font-size:13px',
    text:label+' master — coming in this phase'
  }));
}

// ── MASTERS · SUPPLIERS (B.4) ─────────────────────────────────────────────────
function renderMastersSuppliers(container){
  container.innerHTML='';
  container.appendChild(el('div',{style:'display:flex;justify-content:center;padding:40px',html:'<div class="loader"></div>'}));
  google.script.run
    .withSuccessHandler(function(list){
      container.innerHTML='';
      if(list&&list.error){
        container.appendChild(el('div',{style:'color:var(--fos-danger);padding:20px;text-align:center;font-size:13px',text:list.error}));
        return;
      }
      var sups=Array.isArray(list)?list:[];

      // ── ADD / EDIT FORM (collapsed behind the button) ─────────────────────
      var addWrap=el('div',{style:'margin-bottom:12px'});
      var addBtn=el('button',{cls:'primary-btn',text:'+ Add Supplier',style:'border-radius:8px;font-size:14px;font-weight:500;padding:12px;margin-bottom:0'});
      var form=el('div',{style:'display:none;background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:12px;padding:14px;margin-top:8px'});
      var formTitle=el('div',{style:'font-size:13px;font-weight:700;color:var(--fos-ink);margin-bottom:10px',text:'Add Supplier'});
      form.appendChild(formTitle);
      var fields=[['name','Name *','e.g. Sharma Leathers'],['contactPerson','Contact Person','e.g. Rakesh Sharma'],['phone','Phone','e.g. 9876543210'],['gstNo','GST No','e.g. 09ABCDE1234F1Z5'],['materials','Materials','e.g. Upper leather, soles'],['paymentTerms','Payment Terms','e.g. 30 days credit']];
      var inp={};
      fields.forEach(function(f){
        var g=el('div',{cls:'form-group'});
        g.appendChild(el('label',{cls:'form-label',text:f[1]}));
        var i=el('input',{cls:'form-input',type:(f[0]==='phone'?'tel':'text'),placeholder:f[2]});
        inp[f[0]]=i;g.appendChild(i);form.appendChild(g);
      });
      var editingId='',editingStatus='';
      var btnRow=el('div',{style:'display:flex;gap:8px;align-items:center;margin-top:8px'});
      var sub=el('button',{cls:'primary-btn',text:'Add Supplier',style:'flex:1;padding:12px'});
      var cnl=el('a',{style:'font-size:12px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',text:'Cancel'});
      btnRow.appendChild(sub);btnRow.appendChild(cnl);form.appendChild(btnRow);
      var openForm=function(sp){
        editingId=sp?sp.supId:'';
        editingStatus=sp?(sp.status||'ACTIVE'):'';
        fields.forEach(function(f){inp[f[0]].value=sp?(sp[f[0]]||''):'';});
        formTitle.textContent=sp?('Edit Supplier — '+sp.supId):'Add Supplier';
        sub.textContent=sp?'Save Changes':'Add Supplier';
        form.style.display='block';addBtn.style.display='none';
        form.scrollIntoView({behavior:'smooth',block:'nearest'});
      };
      var closeForm=function(){form.style.display='none';addBtn.style.display='';};
      addBtn.onclick=function(){openForm(null);};
      cnl.onclick=closeForm;
      sub.onclick=function(){
        var nm=inp.name.value.trim();
        if(!nm){toast('Enter supplier name',true);return;}
        sub.disabled=true;sub.textContent='Saving…';
        var idle=function(){sub.disabled=false;sub.textContent=editingId?'Save Changes':'Add Supplier';};
        var payload={name:nm,contactPerson:inp.contactPerson.value.trim(),phone:inp.phone.value.trim(),gstNo:inp.gstNo.value.trim(),materials:inp.materials.value.trim(),paymentTerms:inp.paymentTerms.value.trim()};
        if(editingId){payload.supId=editingId;payload.status=editingStatus;}
        // S.9-style: server rejects a name duplicating an ACTIVE supplier; the
        // admin is offered a deliberate override (confirm → resubmit with flag).
        var _sendSup=function(p){
          google.script.run
            .withSuccessHandler(function(r){
              if(r&&r.success){
                toast(editingId?'Supplier updated':'Supplier added ('+(r.supId||'')+')');
                renderMastersSuppliers(container);
              } else if(r&&r.duplicateOf&&USER&&USER.role==='admin'&&!p.allowDuplicateName){
                if(window.confirm((r.error||'Duplicate name.')+'\n\nSave this supplier anyway?')){
                  p.allowDuplicateName=true;_sendSup(p);
                } else {idle();}
              } else {idle();toast((r&&r.error)||'Error',true);}
            })
            .withFailureHandler(function(){idle();toast('Error',true);})
            .saveSupplier(p);
        };
        _sendSup(payload);
      };
      addWrap.appendChild(addBtn);addWrap.appendChild(form);
      container.appendChild(addWrap);

      // ── SUPPLIER CARDS ────────────────────────────────────────────────────
      if(!sups.length){
        container.appendChild(el('div',{style:'color:var(--fos-ink-secondary);padding:40px;text-align:center',text:'No suppliers yet'}));

      }
      sups.forEach(function(sp){
        var isActive=(sp.status!=='ARCHIVED');
        var card=el('div',{style:'background:var(--fos-surface);border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.06)'});
        if(!isActive)card.style.opacity='0.6';
        var topRow=el('div',{style:'display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px'});
        var nameCol=el('div');
        nameCol.appendChild(el('div',{style:'font-family:var(--fos-font-mono);font-size:11px;color:var(--fos-ink-secondary)',text:sp.supId}));
        nameCol.appendChild(el('div',{style:'font-size:15px;font-weight:600;color:var(--fos-ink)',text:sp.name}));
        topRow.appendChild(nameCol);
        var rightCol=el('div',{style:'display:flex;flex-direction:column;align-items:flex-end;gap:6px'});
        rightCol.appendChild(el('span',{cls:'badge '+(isActive?'green':'grey'),text:sp.status||'ACTIVE'}));
        var linkRow=el('div',{style:'display:flex;gap:10px'});
        var editLnk=el('a',{style:'font-size:11px;color:var(--fos-accent);cursor:pointer;text-decoration:underline',text:'Edit'});
        var stLnk=el('a',{style:'font-size:11px;cursor:pointer;text-decoration:underline;color:'+(isActive?'var(--fos-danger)':'var(--fos-accent)'),text:isActive?'Archive':'Reactivate'});
        linkRow.appendChild(editLnk);linkRow.appendChild(stLnk);
        rightCol.appendChild(linkRow);
        topRow.appendChild(rightCol);
        card.appendChild(topRow);
        var meta=[];
        if(sp.contactPerson)meta.push(sp.contactPerson);
        if(sp.phone)meta.push(sp.phone);
        if(meta.length)card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary)',text:meta.join(' · ')}));
        if(sp.gstNo)card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:2px',text:'GST: '+sp.gstNo}));
        if(sp.materials)card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:2px',text:'Materials: '+sp.materials}));
        if(sp.paymentTerms)card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:2px',text:'Terms: '+sp.paymentTerms}));
        (function(s,eLnk,sLnk,act){
          eLnk.onclick=function(){openForm(s);};
          sLnk.onclick=function(){
            var next=act?'ARCHIVED':'ACTIVE';
            if(!window.confirm((act?'Archive':'Reactivate')+' supplier "'+s.name+'" ('+s.supId+')?'))return;
            google.script.run
              .withSuccessHandler(function(r){
                if(r&&r.success){toast(act?'Supplier archived':'Supplier reactivated');renderMastersSuppliers(container);}
                else toast((r&&r.error)||'Error',true);
              })
              .withFailureHandler(function(){toast('Error',true);})
              .setSupplierStatus(s.supId,next);
          };
        })(sp,editLnk,stLnk,isActive);
        container.appendChild(card);
      });
    })
    .withFailureHandler(function(e){
      container.innerHTML='';
      container.appendChild(el('div',{style:'color:var(--fos-danger);padding:20px;text-align:center;font-size:13px',text:(e&&e.message)||'Error loading suppliers'}));
    })
    .getSuppliers();
}

// ── MASTERS · MATERIALS (B.3) ─────────────────────────────────────────────────
// Needs BOTH getMaterials and getSuppliers (supplier names resolved from
// SUPPLIER_ID; ACTIVE suppliers populate the form select) — the two
// google.script.run calls are chained, then the pane is built once.
function renderMastersMaterials(container){
  container.innerHTML='';
  container.appendChild(el('div',{style:'display:flex;justify-content:center;padding:40px',html:'<div class="loader"></div>'}));
  var _matErr=function(msg){
    container.innerHTML='';
    container.appendChild(el('div',{style:'color:var(--fos-danger);padding:20px;text-align:center;font-size:13px',text:msg}));
  };
  google.script.run
    .withSuccessHandler(function(matList){
      if(matList&&matList.error){_matErr(matList.error);return;}
      google.script.run
        .withSuccessHandler(function(supList){
          if(supList&&supList.error){_matErr(supList.error);return;}
          _buildMaterialsPane(container,Array.isArray(matList)?matList:[],Array.isArray(supList)?supList:[]);
        })
        .withFailureHandler(function(e){_matErr((e&&e.message)||'Error loading suppliers');})
        .getSuppliers();
    })
    .withFailureHandler(function(e){_matErr((e&&e.message)||'Error loading materials');})
    .getMaterials();
}

function _buildMaterialsPane(container,mats,sups){
  container.innerHTML='';
  var UNITS=['mtr','kg','pair','pc','roll'];
  var supName={};
  sups.forEach(function(s){supName[s.supId]=s.name;});

  // ── ADD / EDIT FORM (collapsed behind the button) ───────────────────────────
  var addWrap=el('div',{style:'margin-bottom:12px'});
  var addBtn=el('button',{cls:'primary-btn',text:'+ Add Material',style:'border-radius:8px;font-size:14px;font-weight:500;padding:12px;margin-bottom:0'});
  var form=el('div',{style:'display:none;background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:12px;padding:14px;margin-top:8px'});
  var formTitle=el('div',{style:'font-size:13px;font-weight:700;color:var(--fos-ink);margin-bottom:10px',text:'Add Material'});
  form.appendChild(formTitle);

  var gName=el('div',{cls:'form-group'});
  gName.appendChild(el('label',{cls:'form-label',text:'Name *'}));
  var iName=el('input',{cls:'form-input',type:'text',placeholder:'e.g. Upper leather — black'});
  gName.appendChild(iName);form.appendChild(gName);

  var gUnit=el('div',{cls:'form-group'});
  gUnit.appendChild(el('label',{cls:'form-label',text:'Unit *'}));
  var iUnit=el('select',{cls:'form-input'});
  iUnit.appendChild(el('option',{value:'',text:'— select unit —'}));
  UNITS.forEach(function(u){iUnit.appendChild(el('option',{value:u,text:u}));});
  gUnit.appendChild(iUnit);form.appendChild(gUnit);

  var gRate=el('div',{cls:'form-group'});
  gRate.appendChild(el('label',{cls:'form-label',text:'Rate'}));
  var iRate=el('input',{cls:'form-input',type:'number',placeholder:'e.g. 450'});
  gRate.appendChild(iRate);
  var rateHint=el('div',{style:'display:none;font-size:11px;color:var(--fos-ink-secondary);margin-top:4px',text:'Changing the rate logs the old→new change in the rate history.'});
  gRate.appendChild(rateHint);form.appendChild(gRate);

  var gSup=el('div',{cls:'form-group'});
  gSup.appendChild(el('label',{cls:'form-label',text:'Supplier'}));
  var iSup=el('select',{cls:'form-input'});
  iSup.appendChild(el('option',{value:'',text:'— none —'}));
  sups.forEach(function(s){
    if(s.status==='ARCHIVED')return;
    iSup.appendChild(el('option',{value:s.supId,text:s.name+' ('+s.supId+')'}));
  });
  gSup.appendChild(iSup);form.appendChild(gSup);

  var gNotes=el('div',{cls:'form-group'});
  gNotes.appendChild(el('label',{cls:'form-label',text:'Notes'}));
  var iNotes=el('input',{cls:'form-input',type:'text',placeholder:'e.g. min order 50 mtr'});
  gNotes.appendChild(iNotes);form.appendChild(gNotes);

  var editingId='',editingStatus='';
  var btnRow=el('div',{style:'display:flex;gap:8px;align-items:center;margin-top:8px'});
  var sub=el('button',{cls:'primary-btn',text:'Add Material',style:'flex:1;padding:12px'});
  var cnl=el('a',{style:'font-size:12px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',text:'Cancel'});
  btnRow.appendChild(sub);btnRow.appendChild(cnl);form.appendChild(btnRow);
  var openForm=function(m){
    editingId=m?m.matId:'';
    editingStatus=m?(m.status||'ACTIVE'):'';
    iName.value=m?(m.name||''):'';
    iUnit.value=m?(m.unit||''):'';
    iRate.value=m?(m.rate||m.rate===0?m.rate:''):'';
    iSup.value=m?(m.supplierId||''):'';
    if(m&&m.supplierId&&iSup.value!==m.supplierId){
      // Supplier is archived (not in the ACTIVE list) — add it so the edit
      // form shows the current value instead of silently blanking it.
      iSup.appendChild(el('option',{value:m.supplierId,text:(supName[m.supplierId]||m.supplierId)+' (archived)'}));
      iSup.value=m.supplierId;
    }
    iNotes.value=m?(m.notes||''):'';
    rateHint.style.display=m?'block':'none';
    formTitle.textContent=m?('Edit Material — '+m.matId):'Add Material';
    sub.textContent=m?'Save Changes':'Add Material';
    form.style.display='block';addBtn.style.display='none';
    form.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  var closeForm=function(){form.style.display='none';addBtn.style.display='';};
  addBtn.onclick=function(){openForm(null);};
  cnl.onclick=closeForm;
  sub.onclick=function(){
    var nm=iName.value.trim();
    if(!nm){toast('Enter material name',true);return;}
    if(!iUnit.value){toast('Select a unit',true);return;}
    sub.disabled=true;sub.textContent='Saving…';
    var idle=function(){sub.disabled=false;sub.textContent=editingId?'Save Changes':'Add Material';};
    var payload={name:nm,unit:iUnit.value,rate:safeNum(iRate.value),supplierId:iSup.value,notes:iNotes.value.trim()};
    if(editingId){payload.matId=editingId;payload.status=editingStatus;}
    // S.9-style: server rejects a name duplicating an ACTIVE material; the
    // admin is offered a deliberate override (confirm → resubmit with flag).
    var _sendMat=function(p){
      google.script.run
        .withSuccessHandler(function(r){
          if(r&&r.success){
            toast(editingId?'Material updated':'Material added ('+(r.matId||'')+')');
            renderMastersMaterials(container);
          } else if(r&&r.duplicateOf&&USER&&USER.role==='admin'&&!p.allowDuplicateName){
            if(window.confirm((r.error||'Duplicate name.')+'\n\nSave this material anyway?')){
              p.allowDuplicateName=true;_sendMat(p);
            } else {idle();}
          } else {idle();toast((r&&r.error)||'Error',true);}
        })
        .withFailureHandler(function(){idle();toast('Error',true);})
        .saveMaterial(p);
    };
    _sendMat(payload);
  };
  addWrap.appendChild(addBtn);addWrap.appendChild(form);
  container.appendChild(addWrap);

    nameCol.appendChild(el('div',{style:'font-size:15px;font-weight:600;color:var(--fos-ink)',text:m.name}));
    topRow.appendChild(nameCol);
    var rightCol=el('div',{style:'display:flex;flex-direction:column;align-items:flex-end;gap:6px'});
    rightCol.appendChild(el('span',{cls:'badge '+(isActive?'green':'grey'),text:m.status||'ACTIVE'}));
    var linkRow=el('div',{style:'display:flex;gap:10px'});
    var editLnk=el('a',{style:'font-size:11px;color:var(--fos-accent);cursor:pointer;text-decoration:underline',text:'Edit'});
    var stLnk=el('a',{style:'font-size:11px;cursor:pointer;text-decoration:underline;color:'+(isActive?'var(--fos-danger)':'var(--fos-accent)'),text:isActive?'Archive':'Reactivate'});
    var histLnk=el('a',{style:'font-size:11px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',text:'History'});
    linkRow.appendChild(editLnk);linkRow.appendChild(stLnk);linkRow.appendChild(histLnk);
    rightCol.appendChild(linkRow);
    topRow.appendChild(rightCol);
    card.appendChild(topRow);
    card.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink);font-weight:500',text:fmt(safeNum(m.rate))+' / '+(m.unit||'—')}));
    card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:2px',text:'Supplier: '+(m.supplierId?(supName[m.supplierId]||m.supplierId):'—')}));
    if(m.notes)card.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);margin-top:2px',text:'Notes: '+m.notes}));
    var histBox=el('div',{style:'display:none;margin-top:8px;border-top:0.5px solid var(--fos-border);padding-top:8px'});
    card.appendChild(histBox);
    (function(mt,eLnk,sLnk,hLnk,hBox,act){
      eLnk.onclick=function(){openForm(mt);};
      sLnk.onclick=function(){
        var next=act?'ARCHIVED':'ACTIVE';
        if(!window.confirm((act?'Archive':'Reactivate')+' material "'+mt.name+'" ('+mt.matId+')?'))return;
        google.script.run
          .withSuccessHandler(function(r){
            if(r&&r.success){toast(act?'Material archived':'Material reactivated');renderMastersMaterials(container);}
            else toast((r&&r.error)||'Error',true);
          })
          .withFailureHandler(function(){toast('Error',true);})
          .setMaterialStatus(mt.matId,next);
      };
      // History toggles an inline list of past rates (date · ₹rate · by),
      // fetched once per open — re-opening refetches so it is never stale.
      hLnk.onclick=function(){
        if(hBox.style.display!=='none'){hBox.style.display='none';hLnk.textContent='History';return;}
        hBox.style.display='block';hLnk.textContent='Hide history';
        hBox.innerHTML='<div style="font-size:11px;color:var(--fos-ink-secondary)">Loading…</div>';
        google.script.run
          .withSuccessHandler(function(log){
            hBox.innerHTML='';
            if(log&&log.error){hBox.appendChild(el('div',{style:'font-size:11px;color:var(--fos-danger)',text:log.error}));return;}
            var entries=Array.isArray(log)?log:[];
            if(!entries.length){hBox.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary)',text:'No rate history'}));return;}
            hBox.appendChild(el('div',{style:'font-size:11px;font-weight:700;color:var(--fos-ink);margin-bottom:4px',text:'Rate history'}));
            entries.forEach(function(h){
              hBox.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-top:2px',
                text:(h.date||'—')+' · '+fmt(safeNum(h.rate))+(h.updatedBy?' · by '+h.updatedBy:'')}));
            });
          })
          .withFailureHandler(function(){hBox.innerHTML='';hBox.appendChild(el('div',{style:'font-size:11px;color:var(--fos-danger)',text:'Error loading history'}));})
          .getMaterialRateLog(mt.matId);
      };
    })(m,editLnk,stLnk,histLnk,histBox,isActive);
    container.appendChild(card);
  });
}

// ── MASTERS · RATES (B.2 Labour Rate Card) ────────────────────────────────────
// Append-only rate card. Every save APPENDS a new LR row; the previous ACTIVE
// row for the same (stage, activity, article) tuple is marked SUPERSEDED —
// history is never edited. "Edit" therefore pre-fills the form and saves a
// NEW rate; both add and edit go through the same saveRate call.
function renderMastersRates(container){
  container.innerHTML='';
  container.appendChild(el('div',{style:'display:flex;justify-content:center;padding:40px',html:'<div class="loader"></div>'}));
  google.script.run
    .withSuccessHandler(function(list){
      container.innerHTML='';
      if(list&&list.error){
        container.appendChild(el('div',{style:'color:var(--fos-danger);padding:20px;text-align:center;font-size:13px',text:list.error}));
        return;
      }
      _buildRatesPane(container,Array.isArray(list)?list:[]);
    })
    .withFailureHandler(function(e){
      container.innerHTML='';
      container.appendChild(el('div',{style:'color:var(--fos-danger);padding:20px;text-align:center;font-size:13px',text:(e&&e.message)||'Error loading rates'}));
    })
    .getRates({});
}

function _buildRatesPane(container,rates){
  container.innerHTML='';
  // Canonical pipeline order + display labels: reuse FOS_PIPELINE_STAGES
  // (js_core) with its line-broken labels flattened for selects/headers.
  var STAGES=FOS_PIPELINE_STAGES.map(function(s){return {key:s.key,label:s.label.replace(/\n/g,' ')};});
  var stageLbl={};STAGES.forEach(function(s){stageLbl[s.key]=s.label;});
  var todayStr=(function(){
    var d=new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  })();

  // ── ADD / EDIT FORM (collapsed behind the button) ───────────────────────────
  var addWrap=el('div',{style:'margin-bottom:12px'});
  var addBtn=el('button',{cls:'primary-btn',text:'+ Add Rate',style:'border-radius:8px;font-size:14px;font-weight:500;padding:12px;margin-bottom:0'});
  var form=el('div',{style:'display:none;background:var(--fos-surface);border:0.5px solid var(--fos-border);border-radius:12px;padding:14px;margin-top:8px'});
  var formTitle=el('div',{style:'font-size:13px;font-weight:700;color:var(--fos-ink);margin-bottom:10px',text:'Add Rate'});
  form.appendChild(formTitle);

  var gStage=el('div',{cls:'form-group'});
  gStage.appendChild(el('label',{cls:'form-label',text:'Stage *'}));
  var iStage=el('select',{cls:'form-input'});
  iStage.appendChild(el('option',{value:'',text:'— select stage —'}));
  STAGES.forEach(function(s){iStage.appendChild(el('option',{value:s.key,text:s.label}));});
  gStage.appendChild(iStage);form.appendChild(gStage);

  var gAct=el('div',{cls:'form-group'});
  gAct.appendChild(el('label',{cls:'form-label',text:'Activity *'}));
  var iAct=el('input',{cls:'form-input',type:'text',placeholder:'e.g. Skiving'});
  // Datalist of the chosen stage's master-activity names — cheap because
  // MASTER_ACTS already lives in the client global when the entry data has
  // loaded; when it has not, this stays a plain text input.
  var dl=el('datalist',{id:'rateActDatalist'});
  iAct.setAttribute('list','rateActDatalist');
  var fillDatalist=function(){
    dl.innerHTML='';
    if(!(window.MASTER_ACTS&&MASTER_ACTS.length))return;
    MASTER_ACTS.forEach(function(ma){
      if(iStage.value&&deptKeyOf(ma.section)!==iStage.value)return;
      dl.appendChild(el('option',{value:ma.name}));
    });
  };
  iStage.onchange=fillDatalist;
  gAct.appendChild(iAct);gAct.appendChild(dl);form.appendChild(gAct);

  var gArt=el('div',{cls:'form-group'});
  gArt.appendChild(el('label',{cls:'form-label',text:'Article ID'}));
  var iArt=el('input',{cls:'form-input',type:'text',placeholder:'blank = standard/base rate'});
  gArt.appendChild(iArt);form.appendChild(gArt);

  var gRate=el('div',{cls:'form-group'});
  gRate.appendChild(el('label',{cls:'form-label',text:'Rate ₹/pair *'}));
  var iRate=el('input',{cls:'form-input',type:'number',placeholder:'e.g. 12'});
  gRate.appendChild(iRate);form.appendChild(gRate);

  var gComm=el('div',{cls:'form-group'});
  gComm.appendChild(el('label',{cls:'form-label',text:'Commission ₹/pair'}));
  var iComm=el('input',{cls:'form-input',type:'number',placeholder:'e.g. 2'});
  gComm.appendChild(iComm);form.appendChild(gComm);

  var gDate=el('div',{cls:'form-group'});
  gDate.appendChild(el('label',{cls:'form-label',text:'Effective from'}));
  var iDate=el('input',{cls:'form-input',type:'date'});
  iDate.value=todayStr;
  gDate.appendChild(iDate);form.appendChild(gDate);

  var editHint=el('div',{style:'display:none;font-size:11px;color:var(--fos-ink-secondary);margin:4px 0 8px',
    text:'Editing never changes history: this appends a new rate from the chosen date and marks the old row superseded.'});
  form.appendChild(editHint);

  var editing=false;
  var btnRow=el('div',{style:'display:flex;gap:8px;align-items:center;margin-top:8px'});
  var sub=el('button',{cls:'primary-btn',text:'Add Rate',style:'flex:1;padding:12px'});
  var cnl=el('a',{style:'font-size:12px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',text:'Cancel'});
  btnRow.appendChild(sub);btnRow.appendChild(cnl);form.appendChild(btnRow);
  var openForm=function(r){
    editing=!!r;
    iStage.value=r?(r.stage||''):'';
    fillDatalist();
    iAct.value=r?(r.activity||''):'';
    iArt.value=r?(r.articleId||''):'';
    iRate.value=r?(r.rate||r.rate===0?r.rate:''):'';
    iComm.value=(r&&r.comm)?r.comm:'';
    iDate.value=todayStr;                              // the NEW rate starts from the chosen date
    formTitle.textContent=r?('Edit Rate — '+r.rateId):'Add Rate';
    sub.textContent=r?'Save as New Rate (supersedes current)':'Add Rate';
    editHint.style.display=r?'block':'none';
    form.style.display='block';addBtn.style.display='none';
    form.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  var closeForm=function(){form.style.display='none';addBtn.style.display='';};
  addBtn.onclick=function(){openForm(null);};
  cnl.onclick=closeForm;
  sub.onclick=function(){
    if(!iStage.value){toast('Select a stage',true);return;}
    var act=iAct.value.trim();
    if(!act){toast('Enter activity name',true);return;}
    if(iRate.value===''||safeNum(iRate.value)<=0){toast('Enter rate per pair',true);return;}
    sub.disabled=true;var subLbl=sub.textContent;sub.textContent='Saving…';
    var idle=function(){sub.disabled=false;sub.textContent=subLbl;};
    var payload={stage:iStage.value,activity:act,articleId:iArt.value.trim(),
      rate:safeNum(iRate.value),comm:safeNum(iComm.value),
      effectiveFrom:iDate.value||todayStr};
    google.script.run
      .withSuccessHandler(function(r){
        if(r&&r.success){
          toast('Rate saved ('+(r.rateId||'')+')'+(r.supersededId?' — superseded '+r.supersededId:''));
          renderMastersRates(container);
        } else {idle();toast((r&&r.error)||'Error',true);}
      })
      .withFailureHandler(function(){idle();toast('Error',true);})
      .saveRate(payload);
  };
  addWrap.appendChild(addBtn);addWrap.appendChild(form);
  container.appendChild(addWrap);

  // ── FILTER BAR ──────────────────────────────────────────────────────────────
  var iFilter=el('input',{cls:'form-input',type:'text',placeholder:'Filter by activity or article…'});
  container.appendChild(el('div',{style:'margin-bottom:12px'},[iFilter]));
  var listWrap=el('div');
  container.appendChild(listWrap);

  // ── RATE CARDS, GROUPED BY PIPELINE STAGE ───────────────────────────────────
  var renderList=function(){
    listWrap.innerHTML='';
    var q=iFilter.value.trim().toLowerCase();
    var shown=rates.filter(function(r){
      if(!q)return true;
      return (r.activity||'').toLowerCase().indexOf(q)>=0||(r.articleId||'').toLowerCase().indexOf(q)>=0;
    });
    if(!shown.length){
      listWrap.appendChild(el('div',{style:'color:var(--fos-ink-secondary);padding:40px;text-align:center',
        text:rates.length?'No rates match the filter':'No rates yet'}));
      return;
    }
    var groups={};
    shown.forEach(function(r){
      var k=r.stage||'other';
      if(!groups[k])groups[k]=[];
      groups[k].push(r);
    });
    var order=STAGES.map(function(s){return s.key;});
    Object.keys(groups).forEach(function(k){if(order.indexOf(k)<0)order.push(k);});
    order.forEach(function(stKey){
      var grp=groups[stKey];
      if(!grp)return;
      var active=grp.filter(function(r){return r.status==='ACTIVE';});
      var superseded=grp.filter(function(r){return r.status!=='ACTIVE';});
      var section=el('div',{style:'margin-bottom:18px'});
      section.appendChild(el('div',{style:'font-size:12px;font-weight:700;color:var(--fos-ink-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px',
        text:(stageLbl[stKey]||stKey)+' ('+active.length+')'}));
      if(!active.length){
        section.appendChild(el('div',{style:'font-size:12px;color:var(--fos-ink-secondary);padding:6px 2px',text:'No active rates'}));
      }
      active.forEach(function(r){
        var card=el('div',{style:'background:var(--fos-surface);border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06)'});
        var topRow=el('div',{style:'display:flex;align-items:flex-start;justify-content:space-between'});
        var left=el('div');
        var nameRow=el('div',{style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap'});
        nameRow.appendChild(el('span',{style:'font-size:14px;font-weight:600;color:var(--fos-ink)',text:r.activity}));
        if(r.articleId){
          nameRow.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:10px;font-weight:600;color:var(--fos-accent);border:1px solid var(--fos-accent);border-radius:10px;padding:1px 8px',text:r.articleId}));
        } else {
          nameRow.appendChild(el('span',{style:'font-family:var(--fos-font-mono);font-size:10px;color:var(--fos-ink-secondary);border:1px solid var(--fos-border);border-radius:10px;padding:1px 8px',text:'BASE'}));
        }
        left.appendChild(nameRow);
        left.appendChild(el('div',{style:'font-size:13px;color:var(--fos-ink);font-weight:500;margin-top:4px',
          text:'₹'+safeNum(r.rate)+'/pr'+(safeNum(r.comm)>0?' + ₹'+safeNum(r.comm)+' comm':'')}));
        left.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);margin-top:2px',
          text:'from '+(r.effectiveFrom||'—')+' · '+r.rateId}));
        topRow.appendChild(left);
        var editLnk=el('a',{style:'font-size:11px;color:var(--fos-accent);cursor:pointer;text-decoration:underline',text:'Edit'});
        (function(rr){editLnk.onclick=function(){openForm(rr);};})(r);
        topRow.appendChild(editLnk);
        card.appendChild(topRow);
        section.appendChild(card);
      });
      if(superseded.length){
        var histLnk=el('a',{style:'font-size:11px;color:var(--fos-ink-secondary);cursor:pointer;text-decoration:underline',
          text:'show history ('+superseded.length+')'});
        var histBox=el('div',{style:'display:none;margin-top:6px'});
        superseded.forEach(function(r){
          histBox.appendChild(el('div',{style:'font-size:11px;color:var(--fos-ink-secondary);opacity:0.7;padding:3px 2px',
            text:r.activity+(r.articleId?' · '+r.articleId:' · BASE')+' · ₹'+safeNum(r.rate)+'/pr'+(safeNum(r.comm)>0?' + ₹'+safeNum(r.comm)+' comm':'')+' · from '+(r.effectiveFrom||'—')+' · '+r.rateId+' · SUPERSEDED'}));
        });
        histLnk.onclick=function(){
          var open=histBox.style.display!=='none';
          histBox.style.display=open?'none':'block';
          histLnk.textContent=open?('show history ('+superseded.length+')'):'hide history';
        };
        section.appendChild(histLnk);
        section.appendChild(histBox);
      }
      listWrap.appendChild(section);
    });
  };
  iFilter.oninput=renderList;
  renderList();
}
</script>
